}

function errorSummary(root){

 const count=Object.keys(S.form.errors||{}).length;
 if(!count){summary.remove();return}
 const strong=summary.querySelector('strong');if(strong)strong.textContent='有 '+count+' 个字段需要修正';
 summary.querySelector('.error-links')?.remove();
 const links=document.createElement('nav');links.className='error-links';links.setAttribute('aria-label','需要修正的字段');
 for(const key of Object.keys(S.form.errors||{})){
  const el=[...root.querySelectorAll('[data-formf]')].find(x=>x.dataset.formf===key);
  const group=key==='funcPerms'?root.querySelector('[data-formfp]'):key==='dataDepts'?root.querySelector('[data-formdp]'):null;
  const target=el||group;if(!target)continue;
  const b=document.createElement('button');b.type='button';b.className='error-link';b.dataset.errorFocus=target.id||key;
  b.textContent=el?controlLabel(el):key==='funcPerms'?'功能权限':'数据权限';links.append(b);
 }
 if(links.children.length)summary.append(links);
}
function enhanceRegion(root){
 if(!root)return;
 root.querySelectorAll('.control,.field,.form-grid > div,.facts > div').forEach(el=>el.classList.add('od-field'));
 root.querySelectorAll('.report-head > div:first-child,.cat-main,.kv:not([style*="display:flex"])').forEach(el=>el.classList.add('od-field'));
 root.querySelectorAll('.notice').forEach(el=>{
  if(el.querySelector('.notice-symbol'))return;
  el.classList.add('has-symbol');el.insertAdjacentHTML('afterbegin',icon(el.classList.contains('danger')||el.classList.contains('warn')?'warning':'info','notice-symbol'));
 });
 root.querySelectorAll('.empty').forEach(el=>{if(!el.querySelector('.ico'))el.insertAdjacentHTML('afterbegin',icon('empty'))});
 root.querySelectorAll('.arrow').forEach(el=>{el.innerHTML=icon('forward')});
 root.querySelectorAll('.btn[data-action]').forEach(el=>{
  if(el.querySelector('.btn-label'))return;
  const name=commandIcon(el.dataset.action),label=el.textContent.trim();
  el.innerHTML=(name?icon(name):'')+'<span class="btn-label">'+esc(label.replace(/^＋\s*/,''))+'</span>';
 });
 root.querySelectorAll('[data-formf]').forEach(el=>{
  const parent=el.closest('.form-grid > div');
  if(parent?.querySelector('label .req'))el.setAttribute('aria-required','true');
  if(S.form?.errors?.[el.dataset.formf])syncFieldError(el,el.dataset.formf);
 });
 for(const [key,selector] of [['funcPerms','[data-formfp]'],['dataDepts','[data-formdp]']]){
  const group=root.querySelector(selector)?.closest('.checks');
  if(group&&S.form?.errors?.[key]){group.setAttribute('aria-describedby','form-error-'+key);group.setAttribute('aria-invalid','true')}
 }
 root.querySelectorAll('.table-wrap').forEach((el,tableIndex)=>{
  el.tabIndex=0;el.setAttribute('role','region');el.setAttribute('aria-label',pageContextLabel()+' 数据表');
  el.dataset.tableKind=S.nav==='people'?'people':S.nav==='departments'?'departments':'business';
  el.dataset.tableKey=[S.nav,S.nav==='dashboard'?S.tab:S.reportMode,el.closest('#drawer')?.dataset.context||'',tableIndex].join(':');
  const table=el.querySelector(':scope > table');if(!table)return;
  table.classList.add('data-table');table.setAttribute('role','table');
  const headings=[...table.querySelectorAll('thead th')];
  headings.forEach(th=>{th.setAttribute('scope','col');th.setAttribute('role','columnheader')});
  table.querySelectorAll('thead,tbody').forEach(group=>group.setAttribute('role','rowgroup'));
  table.querySelectorAll('thead tr').forEach(row=>row.setAttribute('role','row'));
  const tbody=table.tBodies[0];
  if(tbody&&!tbody.rows.length){
   const row=tbody.insertRow(),cell=row.insertCell();
   cell.colSpan=headings.length||1;cell.className='cell-empty';
   cell.innerHTML='<div class="empty"><strong>没有符合条件的记录</strong><p>请调整搜索条件后重试。</p><button type="button" class="btn" data-clear-search>清空搜索</button></div>';
  }
  [...(tbody?.rows||[])].forEach(row=>{
   row.setAttribute('role','row');
   [...row.cells].forEach((cell,index)=>{
    const label=headings[index]?.textContent.trim()||'';
    cell.dataset.label=label;cell.setAttribute('role','cell');
    if(label==='操作')cell.classList.add('cell-actions');
    if(/^(跟进日期|最近跟进日期|截止日期|状态|优先级|手机号|在编人数|业务数据)$/.test(label))cell.classList.add('cell-compact');
    if(!cell.querySelector(':scope > .cell-content')){
     const content=document.createElement('div');content.className='cell-content';
     while(cell.firstChild)content.appendChild(cell.firstChild);
     cell.appendChild(content);
    }
   });
  });
  const saved=UI.tableScroll.get(el.dataset.tableKey);if(typeof saved==='number')el.scrollLeft=saved;
 });
 root.querySelectorAll('.src-row label.sr-only').forEach(label=>label.classList.remove('sr-only'));
 root.querySelectorAll('.richbox img').forEach(img=>{
  const measure=()=>{if(img.naturalWidth&&img.naturalHeight){img.setAttribute('width',img.naturalWidth);img.setAttribute('height',img.naturalHeight)}};
  if(img.complete)measure();else img.addEventListener('load',measure,{once:true});
 });
 errorSummary(root);
}
function enhanceApp(){
 const app=$('app');
 app.dataset.module=S.session?S.nav:'session';
 app.dataset.board=S.nav==='dashboard'?S.tab:'';
 // Normalize presentation once per render, retaining the original content and action nodes.
 const head=app.querySelector(':scope > .pagehead');
 if(head&&!head.querySelector(':scope > .page-cover')){
  const body=document.createElement('div');body.className='pagehead-body';
  while(head.firstChild)body.appendChild(head.firstChild);
  const copy=body.querySelector(':scope > div:not(.actions)');
  if(copy)copy.classList.add('pagehead-copy','od-field');
  const cover=document.createElement('div');cover.className='page-cover';
  cover.innerHTML='<span class="cover-disc" aria-hidden="true"></span><span class="cover-sheet" aria-hidden="true"></span>';
  cover.append(body);
  head.append(cover);
 }
 enhanceRegion(app);
 document.querySelectorAll('.nav-btn').forEach(el=>{
  if(!el.querySelector('.nav-label')){const label=el.textContent;el.innerHTML=icon(el.dataset.nav)+'<span class="nav-label">'+esc(label)+'</span>'}
  if(el.classList.contains('active'))el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');
 });
 app.querySelectorAll('[data-tab]').forEach(el=>{el.tabIndex=el.getAttribute('aria-selected')==='true'?0:-1});
 const pageKey=[S.session?'on':'off',S.nav,S.nav==='dashboard'?S.tab:'',S.nav==='reports'?S.reportMode:'',S.loading?'loading':'ready'].join(':');
 app.classList.remove('ui-page-enter');clearTimeout(UI.pageTimer);
 if(UI.pageKey!==pageKey){
  app.classList.add('ui-page-enter');app.querySelectorAll('.reports > .report').forEach((el,i)=>el.style.setProperty('--entry-index',Math.min(i,4)));
  UI.pageTimer=setTimeout(()=>app.classList.remove('ui-page-enter'),200);
 }
 UI.pageKey=pageKey;
}
function syncEditorToolbar(id){
 const box=$(id);if(!box)return;
 const toolbar=box.previousElementSibling;if(!toolbar?.classList.contains('editor-toolbar'))return;
 for(const [name,command] of [['bold','bold'],['list','insertUnorderedList']]){
  const button=toolbar.querySelector('[data-tool="'+name+':'+id+'"]');if(!button)continue;
  let active=false;try{active=document.queryCommandState(command)}catch(error){}
  button.setAttribute('aria-pressed',String(active));
 }
}
function focusEditor(id){
 const box=$(id);if(!box)return;
 box.focus();const selection=window.getSelection(),saved=UI.editorRanges.get(id);
 if(saved&&saved.commonAncestorContainer.isConnected&&box.contains(saved.commonAncestorContainer)){
  selection.removeAllRanges();selection.addRange(saved);
 }else{
  const range=document.createRange();range.selectNodeContents(box);range.collapse(false);selection.removeAllRanges();selection.addRange(range);
 }
}
function dismissToast(){
 const el=$('toast');clearTimeout(S.toastTimer);clearTimeout(UI.toastExit);
 if(el.classList.contains('hidden'))return;
 el.classList.add('is-leaving');UI.toastExit=setTimeout(()=>{el.classList.add('hidden');el.classList.remove('is-leaving')},window.matchMedia('(prefers-reduced-motion:reduce)').matches?0:140);
}
function restorePageContext(){
 const key=S.nav+':'+(S.nav==='reports'?S.reportMode:'');
 const y=UI.pageScroll?.get(key);if(typeof y==='number')window.scrollTo(0,y);
}
document.addEventListener('selectionchange',()=>{
 const selection=window.getSelection();if(!selection?.rangeCount)return;
 const range=selection.getRangeAt(0),node=range.commonAncestorContainer;
 const el=node.nodeType===1?node:node.parentElement,box=el?.closest('.richbox');
 if(box){UI.editorRanges.set(box.id,range.cloneRange());syncEditorToolbar(box.id)}
});
document.addEventListener('mousedown',e=>{if(e.target.closest('.editor-toolbar [data-tool]'))e.preventDefault()});
document.addEventListener('focusout',e=>{
 const el=e.target,key=el.dataset?.formf;if(!key||!S.form||!el.isConnected)return;
 if(el.hasAttribute('data-choice')&&activeChoice?.trigger===el)return;
 const all=validateForm();S.form.errors=S.form.errors||{};
 if(all[key])S.form.errors[key]=all[key];else delete S.form.errors[key];
 syncFieldError(el,key);
 errorSummary($('overlay'));
});
document.addEventListener('click',e=>{
 const close=e.target.closest('[data-toast-close]');if(close){dismissToast();return}
 const clear=e.target.closest('[data-clear-search]');if(clear){
  const input=$('app').querySelector('input[data-filter]');
  if(input){
   const id=input.id,root=input.closest('[data-board-search]');
   if(root)UI.boardSearch=root.dataset.boardSearch;
   input.value='';input.dispatchEvent(new Event('input',{bubbles:true}));$(id)?.focus({preventScroll:true});
  }
  return;
 }
 const link=e.target.closest('[data-error-focus]');if(link){
  const key=link.dataset.errorFocus;
  const el=$(key)||(key==='funcPerms'?document.querySelector('[data-formfp]'):key==='dataDepts'?document.querySelector('[data-formdp]'):null);
  el?.focus();el?.scrollIntoView({block:'center',behavior:window.matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
 }
});
document.addEventListener('keydown',e=>{
 if(e.key==='Tab'&&(S.drawer||S.dialog)){
  const active=S.dialog?document.querySelector('.dialog-card'):document.getElementById('drawer');if(!active)return;
  const items=[...active.querySelectorAll('button:not(:disabled),input:not(:disabled),[data-choice]:not(:disabled),textarea:not(:disabled),a[href],[contenteditable="true"],[tabindex]:not([tabindex="-1"])')].filter(el=>!el.closest('[inert]')&&el.getClientRects().length);
  if(!items.length){e.preventDefault();active.focus();return}
  const first=items[0],last=items[items.length-1];
  if(e.shiftKey&&(document.activeElement===first||!active.contains(document.activeElement))){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&(document.activeElement===last||!active.contains(document.activeElement))){e.preventDefault();first.focus()}
 }
 const tab=e.target.closest('[role="tab"][data-tab]');
 if(tab&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){
  const tabs=[...document.querySelectorAll('[role="tab"][data-tab]')],i=tabs.indexOf(tab);
  const index=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
  const key=tabs[index].dataset.tab;e.preventDefault();tabs[index].click();document.querySelector('[data-tab="'+key+'"]')?.focus();
 }
 const tool=e.target.closest('[data-tool]');
 if(tool&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){
  const tools=[...tool.closest('.editor-toolbar').querySelectorAll('[data-tool]')],i=tools.indexOf(tool);
  const index=e.key==='Home'?0:e.key==='End'?tools.length-1:(i+(e.key==='ArrowRight'?1:-1)+tools.length)%tools.length;
  e.preventDefault();tools[index].focus();
 }
});
$('toast').addEventListener('mouseenter',()=>clearTimeout(S.toastTimer));
$('toast').addEventListener('focusin',()=>clearTimeout(S.toastTimer));
$('toast').addEventListener('mouseleave',()=>{S.toastTimer=setTimeout(dismissToast,4200)});
$('toast').addEventListener('focusout',e=>{if(!$('toast').contains(e.relatedTarget))S.toastTimer=setTimeout(dismissToast,4200)});

function notify(msg){
 const el=$('toast');clearTimeout(S.toastTimer);clearTimeout(UI.toastExit);
 el.className='toast';
 el.innerHTML=icon(/失败|错误|未通过|不可|不能为空/.test(msg)?'warning':'info')+'<span class="toast-message">'+esc(msg)+'</span><button type="button" class="toast-close" data-toast-close aria-label="关闭提示">'+icon('close')+'</button>';
 S.toastTimer=setTimeout(dismissToast,4200);
}

function applyNav(){
 const perms=funcPermsOf();
 document.querySelectorAll('.nav-btn').forEach(b=>{
  const ok=perms.indexOf(NAVNAME[b.dataset.nav])>=0;
  b.classList.toggle('nav-off',!ok);b.disabled=!ok;b.setAttribute('aria-disabled',ok?'false':'true');
  if(!ok){b.setAttribute('title','当前登录人无「'+NAVNAME[b.dataset.nav]+'」功能权限，入口不可用');}
 });
 document.querySelectorAll('.sidebar nav .nav-title').forEach(t=>{
  let n=t.nextElementSibling,any=false;
  while(n&&!n.classList.contains('nav-title')){if(n.classList.contains('nav-btn')&&!n.classList.contains('nav-off'))any=true;n=n.nextElementSibling}
  t.classList.toggle('nav-off',!any);
 });
}
function render(){
 closeChoice(false,true);
 document.querySelectorAll('.table-wrap[data-table-key]').forEach(el=>UI.tableScroll.set(el.dataset.tableKey,el.scrollLeft));
 if(!S.session){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));$('app').innerHTML=sessionView();enhanceApp();renderOverlay();return}
 applyNav();
 const perms=funcPermsOf();
 if(perms.indexOf(NAVNAME[S.nav])<0){
  const first=S.nav==='dashboard'?null:PERMS.find(p=>perms.indexOf(p)>=0);
  const key=Object.keys(NAVNAME).find(k=>NAVNAME[k]===first)||'dashboard';
  S.nav=key;S.tab=key==='dashboard'?S.tab||'reports':S.tab;S.drawer=null;S.form=null;S.dialog=null;
 }
 document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.nav===S.nav));
 $('app').innerHTML=
  S.nav==='dashboard'?(S.loading?skeleton():dashboard()):
  S.nav==='reports'?(S.reportMode==='edit'?editor():reportsPage()):
  S.nav==='projects'?(S.loading?skeleton():projectsPage()):
  S.nav==='follows'?(S.loading?skeleton():followsPage()):
  S.nav==='tasks'?(S.loading?skeleton():tasksPage()):
  S.nav==='people'?peoplePage():departmentsPage();
 enhanceApp();renderOverlay();
}

function openForm(type,id){
 snapshot();
 UI.formOrigin=S.drawer&&S.drawer.type!=='form'?{...S.drawer}:null;
 S.form={type:type,id:id||null,mode:/^edit-/.test(type)?'edit':'create',draft:draftOf(type,id),errors:{}};

 S.drawer={type:'form',side:'left'};

function draftOf(type,id){
 if(type==='new-project'||type==='edit-project'){
  const p=id?D.projects.find(x=>x.id===id):null;
  return p?{no:p.no,name:p.name,cat:p.cat,stage:p.stage,owner:p.owner,created:p.created,createdBy:p.createdBy,createdDept:p.createdDept,followText:''}
   :{no:billNo('PJ',D.projects),name:'',cat:'项目支持',stage:(D.stages[0]||{}).name||'',owner:curUser(),created:today(),createdBy:curUser(),createdDept:curDept(),followText:''};
 }
 if(type==='new-task'||type==='edit-task'){
  const x=id?D.tasks.find(v=>v.id===id):null;
  return x?{no:x.no,name:x.name,level:String(x.level),parent:'',cat:x.path==='—'?(catNames()[0]||''):x.path,owner:x.owner,partners:x.partners.slice(),priority:x.priority,project:x.project,due:x.due,created:x.created,createdBy:x.createdBy,createdDept:x.createdDept,progressText:''}
   :{no:billNo('TK',D.tasks),name:'',level:'1',parent:'',cat:catNames()[0]||'',owner:curUser(),partners:[],priority:'中',project:(D.projects[0]||{}).name||'',due:'2026-10-10',created:today(),createdBy:curUser(),createdDept:curDept(),progressText:''};
 }
 if(type==='new-follow')return {no:billNo('FO',D.follows),project:id||(D.projects[0]||{}).name||'',date:today(),person:curUser(),createdBy:curUser(),createdDept:curDept(),content:''};
 if(type==='new-progress')return {no:billNo('PR',D.progresses),task:id||(D.tasks[0]||{}).name||'',date:today(),person:curUser(),status:'进行中',createdBy:curUser(),createdDept:curDept(),content:''};
 if(type==='new-person')return {no:billNo('PS',D.accounts),name:'',phone:'',pwd:'',pwd2:'',pwdSet:false,dept:(D.depts[0]||{}).name||'',status:'启用',funcPerms:PERMS.slice(),dataDepts:deptNames(),createdBy:curUser(),createdDept:curDept()};
 if(type==='edit-person'){
  const a=D.accounts.find(x=>x.name===id);
  return a?{no:a.no,name:a.name,phone:a.raw||'',pwd:'',pwd2:'',pwdSet:a.pwdSet,dept:a.dept,status:a.status,funcPerms:a.funcPerms.slice(),dataDepts:a.dataDepts.slice(),createdBy:a.createdBy,createdDept:a.createdDept}
   :{no:billNo('PS',D.accounts),name:'',phone:'',pwd:'',pwd2:'',pwdSet:false,dept:(D.depts[0]||{}).name||'',status:'启用',funcPerms:PERMS.slice(),dataDepts:deptNames(),createdBy:curUser(),createdDept:curDept()};
 }
 if(type==='new-dept')return {no:billNo('DP',D.depts),code:'',name:'',note:'',status:'启用',createdBy:curUser(),createdDept:curDept()};
 if(type==='edit-dept'){
  const x=D.depts.find(v=>v.no===id);
  return x?{no:x.no,code:x.code,name:x.name,note:x.note,status:x.status,createdBy:x.createdBy,createdDept:x.createdDept}
   :{no:billNo('DP',D.depts),code:'',name:'',note:'',status:'启用',createdBy:curUser(),createdDept:curDept()};
 }
 if(type==='new-cat')return {no:billNo('TC',D.taskCats),name:'',code:'',sort:String(D.taskCats.length+1),createdBy:curUser(),createdDept:curDept()};
 if(type==='edit-cat'){

   :{no:billNo('TC',D.taskCats),name:'',code:'',sort:String(D.taskCats.length+1),createdBy:curUser(),createdDept:curDept()};
 }
 if(type==='new-stage')return {no:billNo('ST',D.stages),name:'',sort:String(D.stages.length+1),createdBy:curUser(),createdDept:curDept()};
 if(type==='edit-stage'){

   :{no:billNo('ST',D.stages),name:'',sort:String(D.stages.length+1),createdBy:curUser(),createdDept:curDept()};
 }
 return {};

function formDrawer(){

 const body=f.type==='new-project'||f.type==='edit-project'?formProject()
  :f.type==='new-task'||f.type==='edit-task'?formTask()
  :f.type==='new-follow'?formFollow()
  :f.type==='new-progress'?formProgress()
  :f.type==='new-person'||f.type==='edit-person'?formPerson()
  :f.type==='new-dept'||f.type==='edit-dept'?formDept()

 +`<div class="drawer-body">
  ${n?'<div class="notice danger" role="alert"><strong>有 '+n+' 个字段需要修正</strong>：原因已标在对应字段下方，修正后再次保存即可。</div>':'<div class="notice">'+esc(m.note)+'</div>'}

 <div class="drawer-foot">${act('取消','form-cancel')}${act(m.ok,'form-submit','primary')}</div>`;
}

 <div><label for="fs-sort">排序 <span class="req">*</span></label>

 <div><label for="fs-createdby">创建人 / 创建部门</label>

 <div class="sec"><h3>删除约束</h3>

function validateForm(){
 const f=S.form,d=f.draft,e={};
 if(f.type==='new-project'||f.type==='edit-project'){
  const n=(d.name||'').trim();
  if(!n)e.name='项目名称为必填项。';
  else if(D.projects.some(p=>p.name===n&&p.id!==f.id))e.name='项目名称已存在，请改用其他名称或直接编辑已有项目。';
  else if(n.length<2)e.name='项目名称过短，请填写可识别的完整名称。';
  if(!d.cat)e.cat='请选择项目分类。';
  if(!d.stage)e.stage='请选择项目阶段；可在下拉内直接新建阶段。';
  if(!d.owner)e.owner='请选择项目负责人。';
  if((d.followText||'').length>500)e.followText='项目跟进内容请控制在 500 字以内。';
 }
 if(f.type==='new-task'||f.type==='edit-task'){
  const n=(d.name||'').trim();
  if(!n)e.name='任务名称为必填项。';
  else if(D.tasks.some(t=>t.name===n&&t.id!==f.id))e.name='任务名称已存在，请改用其他名称。';
  const lv=Number(d.level);
  if(!(lv>=1&&lv<=3))e.level='任务层级只能是 1、2、3 级。';
  if(lv>1&&!d.parent)e.parent=lv===3?'三级任务必须归属上级任务，请选择上级：否则无法确定其在三级结构中的位置。':'二级任务请指定上级任务。';
  if(lv===3&&d.parent){const pt=D.tasks.find(t=>t.name===d.parent);if(pt&&pt.level>=3)e.parent='所选上级已是三级任务，不能再作为父级（三级为上限）。'}
  if(!d.cat)e.cat='请选择任务分类。';
  if(!d.owner)e.owner='请选择主负责人。';
  if(!d.priority)e.priority='请选择优先级。';
  if(!d.project)e.project='请选择关联项目。';
  if(!d.due)e.due='请选择截止日期。';
  else if(d.due<d.created)e.due='截止日期不能早于创建日期 '+d.created+'。';
 }
 if(f.type==='new-follow'){
  if(!d.project)e.project='请选择关联项目。';
  if(!d.date)e.date='请选择跟进日期。';
  else if(d.date>today())e.date='跟进日期不能晚于今天（'+today()+'）。';
  if(!d.person)e.person='请选择跟进人员。';
  const c=(d.content||'').trim();
  if(!c)e.content='跟进内容为必填项：缺少内容无法形成有效跟进记录。';
  else if(c.length<4)e.content='跟进内容过短，请补充具体进展与结论。';
 }
 if(f.type==='new-progress'){
  if(!d.task)e.task='请选择任务。';
  if(!d.date)e.date='请选择跟进日期。';
  else if(d.date>today())e.date='进度日期不能晚于今天（'+today()+'）。';
  if(!d.person)e.person='请选择填写人员。';
  if(!d.status)e.status='请选择任务状态。';
  const c=(d.content||'').trim();
  if(!c)e.content=d.status==='已完成'?'标记为已完成时必须填写完成说明。':'进度内容为必填项。';
  else if(c.length<4)e.content='进度内容过短，请补充具体产出与阻塞。';
 }
 if(f.type==='new-person'||f.type==='edit-person'){
  const n=(d.name||'').trim(),edit=f.mode==='edit';
  if(!n)e.name='人员姓名为必填项。';
  else if(D.accounts.some(a=>a.name===n&&a.name!==f.id))e.name='该姓名已存在，请确认是否重复添加。';
  const ph=(d.phone||'').trim();
  if(!ph)e.phone='手机号为必填项：手机号即登录账号。';
  else if(!/^1[3-9]\d{9}$/.test(ph))e.phone='手机号格式不正确，应为 1 开头的 11 位数字。';
  else if(D.accounts.some(a=>(a.raw||'')===ph&&a.name!==f.id))e.phone='该手机号已被其他人员使用，一个手机号只能对应一个人员。';
  if(!d.dept)e.dept='归属部门为必填项：人员必须归属一个部门。';
  if(!d.status)e.status='请选择账号状态。';
  if(!d.funcPerms||!d.funcPerms.length)e.funcPerms='至少保留一项功能权限；如确需停用该账号，请改用「账号状态」。';
  if(!d.dataDepts||!d.dataDepts.length)e.dataDepts='至少选择一个可见部门作为数据权限范围。';
  const pw=d.pwd||'';
  if(!pw){if(!edit)e.pwd='设置密码为必填项。'}
  else{
   if(pw.length<8)e.pwd='密码长度至少 8 位。';
   else if(!(/[A-Za-z]/.test(pw)&&/\d/.test(pw)))e.pwd='密码需同时包含字母与数字。';
   if((d.pwd2||'')!==pw)e.pwd2='两次输入的密码不一致。';
  }
 }
 if(f.type==='new-dept'||f.type==='edit-dept'){
  const c=(d.code||'').trim().toUpperCase(),n=(d.name||'').trim();
  if(!c)e.code='部门编码为必填项。';
  else if(!/^[A-Za-z0-9-]{2,20}$/.test(c))e.code='部门编码只能使用字母、数字与连字符，长度 2–20。';
  else if(D.depts.some(x=>String(x.code).toUpperCase()===c&&x.no!==f.id))e.code='部门编码已存在，请改用其他编码。';
  if(!n)e.name='部门名称为必填项。';
  else if(D.depts.some(x=>x.name===n&&x.no!==f.id))e.name='部门名称已存在，请改用其他名称。';
  if(!d.status)e.status='请选择状态。';
 }
 if(f.type==='new-cat'||f.type==='edit-cat'){
  const n=(d.name||'').trim(),c=(d.code||'').trim();
  if(!n)e.name='分类名称为必填项。';
  else if(D.taskCats.some(x=>x.name===n&&x.no!==f.id))e.name='分类名称已存在，请改用其他名称。';
  if(!c)e.code='分类编码为必填项。';
  else if(D.taskCats.some(x=>x.code===c&&x.no!==f.id))e.code='分类编码已存在，请改用其他编码。';
  if(!(Number(d.sort)>=1))e.sort='排序需为不小于 1 的数字。';
 }
 if(f.type==='new-stage'||f.type==='edit-stage'){
  const n=(d.name||'').trim();
  if(!n)e.name='阶段名称为必填项。';
  else if(D.stages.some(x=>x.name===n&&x.no!==f.id))e.name='阶段名称已存在，请直接在下拉中选用，不做重复创建。';
  if(!(Number(d.sort)>=1))e.sort='排序需为不小于 1 的数字。';
 }
 return e;
}
function addFollowRec(project,date,person,content,createdBy,createdDept){
 const no=billNo('FO',D.follows,date);
 const rec={no:no,project:project,date:date,person:person,content:content,createdBy:createdBy||person,createdDept:createdDept||curDept()};
 D.follows.push(rec);
 D.syncPool.push({no:rec.no,type:'项目跟进',project:project,person:person,date:date,text:content});
 return rec;
}
function addProgressRec(task,date,person,content,status,createdBy,createdDept){
 const no=billNo('PR',D.progresses,date);
 const rec={no:no,task:task,date:date,person:person,content:content,status:status,createdBy:createdBy||person,createdDept:createdDept||curDept()};
 D.progresses.push(rec);
 D.syncPool.push({no:rec.no,type:'任务进度',project:(D.tasks.find(t=>t.name===task)||{}).project||'—',person:person,date:date,text:content});
 return rec;
}
function submitForm(){
 const f=S.form;if(!f)return;
 f.errors=validateForm();
 const bad=Object.keys(f.errors);
 if(bad.length){
  renderOverlay();
  const first=document.querySelector('#drawer .input.bad');
  if(first)first.focus();
  notify('校验未通过：'+bad.length+' 个字段需要修正，原因已标在字段下方。本次未写入任何数据。');
  return;
 }
 const d=f.draft,ty=f.type;
 if(ty==='new-project'||ty==='edit-project'){
  let extra='';
  if(f.mode==='edit'){
   const p=D.projects.find(x=>x.id===f.id);
   if(p){
    const old=p.name,now=d.name.trim();
    p.name=now;p.cat=d.cat;p.stage=d.stage;p.owner=d.owner;
    if(old!==now){D.tasks.forEach(t=>{if(t.project===old)t.project=now});D.follows.forEach(x=>{if(x.project===old)x.project=now})}
   }
  }else{
   const nid='P'+String(D.projects.length+1).padStart(2,'0');
   const no=noUnique(D.projects,d.no)?d.no:billNo('PJ',D.projects);
   D.projects.push({no:no,id:nid,name:d.name.trim(),cat:d.cat,stage:d.stage,owner:d.owner,computed:null,override:null,reason:'',created:d.created,createdBy:curUser(),createdDept:curDept()});
  }
  if((d.followText||'').trim()){const fr=addFollowRec(d.name.trim(),today(),d.owner,d.followText.trim());extra='，并创建 1 条项目跟进（单据编号 '+fr.no+'）'}
  closeForm();
  notify('项目已'+(f.mode==='edit'?'保存':'创建')+'（演示）：单据编号 '+d.no+'，创建日期 '+d.created+' 不受编辑影响'+extra+'。');
  return;
 }
 if(ty==='new-task'||ty==='edit-task'){
  const lv=Number(d.level);
  let extra='';
  if(f.mode==='edit'){
   const t=D.tasks.find(x=>x.id===f.id);
   if(t){
    const old=t.name,now=d.name.trim();
    t.name=now;t.level=lv;t.priority=d.priority;t.owner=d.owner;t.partners=d.partners.slice();t.project=d.project;t.due=d.due;t.path=d.cat||'—';
    if(old!==now)D.progresses.forEach(p=>{if(p.task===old)p.task=now});
   }
  }else{
   const nid='T'+String(D.tasks.length+1).padStart(2,'0');
   const no=noUnique(D.tasks,d.no)?d.no:billNo('TK',D.tasks);
   D.tasks.push({no:no,id:nid,name:d.name.trim(),created:d.created,priority:d.priority,owner:d.owner,partners:d.partners.slice(),project:d.project,status:'未开始',latest:'尚未填写任务进度',due:d.due,level:lv,path:d.cat||'—',createdBy:curUser(),createdDept:curDept()});
  }
  if((d.progressText||'').trim()){const pr=addProgressRec(d.name.trim(),today(),d.owner,d.progressText.trim(),'未开始');extra='，并追加 1 条任务进度（单据编号 '+pr.no+'）'}
  closeForm();
  notify('任务已'+(f.mode==='edit'?'保存':'创建')+'（演示）：单据编号 '+d.no+'，'+d.created+'｜'+d.name.trim()+'，层级 '+lv+' 级，优先级'+d.priority+extra+'。');
  return;
 }
 if(ty==='new-follow'){
  const rec=addFollowRec(d.project,d.date,d.person,d.content.trim(),curUser(),curDept());
  closeForm();
  if(S.nav==='follows')render();
  notify('项目跟进已提交（演示）：单据编号 '+rec.no+'；已同步更新「'+d.project+'」的最近跟进日期与最后跟进内容。');
  return;
 }
 if(ty==='new-progress'){
  const t=D.tasks.find(x=>x.name===d.task);
  const rec=addProgressRec(d.task,d.date,d.person,d.content.trim(),d.status,curUser(),curDept());
  if(t){t.status=d.status;t.latest=d.content.trim()}
  closeForm();
  notify('任务进度已提交（演示）：单据编号 '+rec.no+'；任务「'+d.task+'」状态更新为'+d.status+'，历史记录保留 '+D.progresses.filter(p=>p.task===d.task).length+' 条。');
  return;
 }
 if(ty==='new-person'||ty==='edit-person'){
  const nm=d.name.trim(),ph=d.phone.trim(),pw=d.pwd||'';
  if(f.mode==='edit'){
   const a=D.accounts.find(x=>x.name===f.id);
   if(a){a.name=nm;a.phone=ph.slice(0,3)+'****'+ph.slice(7);a.raw=ph;
    a.dept=d.dept;a.status=d.status;a.funcPerms=d.funcPerms.slice();a.dataDepts=d.dataDepts.slice();
    if(pw){a.pwdSet=true}
    const i=D.people.indexOf(f.id);if(i>=0)D.people[i]=nm;
    D.projects.forEach(p=>{if(p.owner===f.id)p.owner=nm});
    D.tasks.forEach(t=>{if(t.owner===f.id)t.owner=nm;const j=t.partners.indexOf(f.id);if(j>=0)t.partners[j]=nm});
    D.follows.forEach(x=>{if(x.person===f.id)x.person=nm});
    D.progresses.forEach(x=>{if(x.person===f.id)x.person=nm});
   }
  }else{
   D.accounts.push({no:noUnique(D.accounts,d.no)?d.no:billNo('PS',D.accounts),name:nm,phone:ph.slice(0,3)+'****'+ph.slice(7),raw:ph,dept:d.dept,status:d.status,pwdSet:!!pw,funcPerms:d.funcPerms.slice(),dataDepts:d.dataDepts.slice(),created:today(),createdBy:curUser(),createdDept:curDept()});
   if(D.people.indexOf(nm)<0)D.people.push(nm);
  }
  const warn=d.status==='停用'?'　该账号为停用状态，将无法登录。':'';
  closeForm();
  notify('人员已'+(f.mode==='edit'?'保存':'新增')+'（演示）：'+d.no+' · '+nm+'；归属部门 '+d.dept+'，功能权限 '+d.funcPerms.length+'/'+PERMS.length+' 项，数据权限 '+d.dataDepts.length+' 个部门。密码不落明文、不写入演示数据。'+warn);
  return;
 }
 if(ty==='new-dept'||ty==='edit-dept'){
  if(f.mode==='edit'){
   const x=D.depts.find(v=>v.no===f.id);
   if(x){const old=x.name;x.code=d.code.trim().toUpperCase();x.name=d.name.trim();x.note=d.note.trim();x.status=d.status;
    if(old!==x.name){D.accounts.forEach(a=>{if(a.dept===old)a.dept=x.name});D.projects.forEach(p=>{if(p.createdDept===old)p.createdDept=x.name})}}
  }else{
   D.depts.push({no:noUnique(D.depts,d.no)?d.no:billNo('DP',D.depts),code:d.code.trim().toUpperCase(),name:d.name.trim(),note:d.note.trim(),status:d.status,created:today(),createdBy:curUser(),createdDept:curDept()});
  }
  closeForm();render();
  notify('部门已'+(f.mode==='edit'?'保存':'新增')+'（演示）：'+d.no+' · '+d.name.trim()+'（编码 '+d.code.trim().toUpperCase()+'）。');
  return;
 }
 if(ty==='new-cat'||ty==='edit-cat'){
  if(f.mode==='edit'){
   const x=D.taskCats.find(v=>v.no===f.id);
   if(x){const old=x.name;x.name=d.name.trim();x.code=d.code.trim();x.sort=Number(d.sort);
    if(old!==x.name)D.tasks.forEach(t=>{if(t.path===old)t.path=x.name})}
  }else{
   D.taskCats.push({no:noUnique(D.taskCats,d.no)?d.no:billNo('TC',D.taskCats),name:d.name.trim(),code:d.code.trim(),sort:Number(d.sort),created:today(),createdBy:curUser(),createdDept:curDept()});
  }
  closeForm();render();
  notify('任务分类已'+(f.mode==='edit'?'保存':'新增')+'（演示）：'+d.no+' · '+d.name.trim()+'（编码 '+d.code.trim()+'，排序 '+d.sort+'）。');
  return;
 }
 if(ty==='new-stage'||ty==='edit-stage'){
  if(f.mode==='edit'){
   const x=D.stages.find(v=>v.no===f.id);
   if(x){const old=x.name;x.name=d.name.trim();x.sort=Number(d.sort);
    if(old!==x.name)D.projects.forEach(p=>{if(p.stage===old)p.stage=x.name})}
  }else{
   D.stages.push({no:noUnique(D.stages,d.no)?d.no:billNo('ST',D.stages),name:d.name.trim(),sort:Number(d.sort),created:today(),createdBy:curUser(),createdDept:curDept()});
  }
  closeForm();render();
  notify('项目阶段已'+(f.mode==='edit'?'保存':'新增')+'（演示）：'+d.no+' · '+d.name.trim()+'。');
  return;
 }
 closeForm();
}

function renderOverlay(){
 closeChoice(true,true);
 const ov=$('overlay'),shell=document.querySelector('.app');
 const oldKey=UI.overlayKey,focused=focusDescription(document.activeElement);
 const oldDrawer=ov.querySelector('#drawer'),oldBody=oldDrawer?.querySelector('.drawer-body');
 const oldDrawerKey=oldDrawer?.dataset.context||'';
 if(oldBody&&oldDrawerKey)UI.drawerScroll.set(oldDrawerKey,oldBody.scrollTop);
 const drawerKey=S.drawer?'drawer:'+S.drawer.type+':'+(S.drawer.id||'')+(S.drawer.type==='ai'?':'+(S.report.batch?.id||''):'')+(S.form?':'+S.form.type+':'+(S.form.id||''):''):'';
 const key=S.dialog?'dialog:'+S.dialog.ok+':'+S.dialog.title:drawerKey;
 clearTimeout(UI.closeTimer);
 if(!key){
  if(!ov.childElementCount){shell.inert=false;document.body.classList.remove('modal-open');UI.overlayKey='';return}
  const target=UI.returnFocus;UI.overlayKey='';ov.classList.add('is-closing');ov.inert=true;
  const finish=()=>{
   if(UI.overlayKey)return;
   ov.replaceChildren();ov.classList.remove('is-closing');ov.inert=false;shell.inert=false;
   document.body.classList.remove('modal-open');
   if(!focusDescribed(target))document.querySelector('.nav-btn.active')?.focus({preventScroll:true});
   UI.returnFocus=null;UI.dialogReturn=null;
  };
  UI.closeTimer=setTimeout(finish,window.matchMedia('(prefers-reduced-motion:reduce)').matches?0:160);return;
 }
 if(!oldKey)UI.returnFocus=focused||UI.returnFocus;
 if(S.dialog&&!oldKey.startsWith('dialog:'))UI.dialogReturn=focused;
 shell.inert=true;document.body.classList.add('modal-open');
 ov.classList.remove('is-closing');ov.inert=false;UI.overlayKey=key;
 const side=S.drawer?.side==='left'?' left':' right';
 const isForm=S.drawer?.type==='form';
 const label=isForm?'新增或编辑表单，从左侧滑出':'详情侧滑页，从右侧滑出';
 const sameDrawer=oldDrawerKey===drawerKey;
 const motionClass=sameDrawer?' no-enter':'';
 let html='';
 if(S.drawer&&!S.dialog){
  html=`<div class="backdrop${oldKey?' no-enter':''}" data-action="close-overlay" aria-hidden="true"></div><aside class="drawer${side}${motionClass}" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-label="${label}" tabindex="-1" id="drawer" data-context="${esc(drawerKey)}">${drawerContent()}</aside>`;
 }else if(S.drawer&&S.dialog){
  html=`<aside class="drawer${side}${motionClass} inactive" role="dialog" aria-label="${label}" id="drawer" data-context="${esc(drawerKey)}" aria-hidden="true" inert>${drawerContent()}</aside><div class="backdrop" style="z-index:32" data-action="cancel-dialog" aria-hidden="true"></div>${dialogHtml()}`;
 }else{
  html=`<div class="backdrop" style="z-index:32" data-action="cancel-dialog" aria-hidden="true"></div>${dialogHtml()}`;
 }
 ov.innerHTML=html;enhanceRegion(ov);
 const body=ov.querySelector('.drawer-body');
 if(body)body.scrollTop=UI.drawerScroll.get(drawerKey)||0;
 const restore=oldKey===key?focused:!S.dialog&&oldKey.startsWith('dialog:')?UI.dialogReturn:null;
 requestAnimationFrame(()=>{
  if(UI.overlayKey!==key)return;
  const active=S.dialog?ov.querySelector('.dialog-card'):ov.querySelector('#drawer');if(!active)return;
  const bad=active.querySelector('.input.bad');
  if(bad){bad.focus({preventScroll:true});bad.scrollIntoView({block:'nearest'});return}
  if(focusDescribed(restore,active))return;
  const target=S.dialog?(active.querySelector('input,textarea,[data-choice]')||active.querySelector('[data-action="cancel-dialog"]')):isForm?active.querySelector('input:not([readonly]):not(:disabled),textarea:not(:disabled),[data-choice]:not(:disabled)'):active.querySelector('[data-action="close-overlay"]');
  (target||active).focus({preventScroll:true});
 });
}
function dialogHtml(){
 const d=S.dialog;
 return `<div class="dialog-layer"><div class="panel dialog-card${d.danger?' is-danger':''}" role="dialog" aria-modal="true" aria-labelledby="dlg-title" aria-describedby="dlg-copy" tabindex="-1">
  <div class="dialog-heading">${icon(d.danger?'warning':'info')}<h2 id="dlg-title">${esc(d.title)}</h2></div>
  <div id="dlg-copy" class="dialog-copy">${d.body}</div>
  ${d.extra||''}
  <div class="actions">${act(d.cancelText||'取消','cancel-dialog')}${act(d.okText||'确认','dialog-ok',d.danger?'danger':'primary')}</div>
 </div></div>`;

function drawerContent(){
 const d=S.drawer;if(!d)return '';
 if(d.type==='form')return formDrawer();
 if(d.type==='project')return projectDrawer(d.id);
 if(d.type==='task')return taskDrawer(d.id);
 if(d.type==='report')return reportDrawer(d.id);
 if(d.type==='ai')return aiDrawer();
 if(d.type==='stages')return stagesDrawer();
 if(d.type==='taskcats')return taskCatsDrawer();
 if(d.type==='ue')return ueDrawer();
 if(d.type==='info')return infoDrawer(d.id);
 return '';
}
const drawerHead=(eyebrow,title,extra='')=>`<div class="drawer-head"><div><span class="eyebrow">${esc(eyebrow)}</span><h2 id="drawer-title">${title}</h2><div class="drawer-meta">${extra}</div></div>${act('关闭','close-overlay','small')}</div>`;

 const f=fs[0]||null;
 return drawerHead('PROJECT / '+p.id,p.name,tag(p.stage)+' '+tag(p.cat))
 +`<div class="drawer-body">
  <div class="facts">
   <div><span>项目负责人</span><strong>${esc(p.owner)}</strong></div>
   <div><span>最近跟进日期</span><strong>${f?f.date:'暂无有效跟进'}</strong></div>

   <div><span>当前进度</span><strong>${cur===null?'暂无可计算进度':cur+'% · '+(p.override!==null?'人工修正':'系统计算')}</strong></div>
  </div>
  <div class="sec"><h3>进度来源与人工修正</h3>
   <div class="diff">
    <div class="box"><b>系统计算值（末级任务）</b>${p.computed===null?'无有效末级任务，不显示 0%':p.computed+'%'}</div>
    <div class="box"><b>人工修正值（优先展示）</b>${p.override===null?'无':p.override+'%'}</div>
   </div>

  </div>

   ${f?`<p style="margin:0 0 4px">${esc(f.content)}</p><p class="meta">跟进人员 ${esc(f.person)} · 跟进日期 ${f.date}（最近跟进日期按该项目全部跟进的最大日期实时重算）</p>`:'<p class="meta" style="margin:0">暂无项目跟进。最近跟进日期与最后跟进内容均由跟进记录派生，无跟进时保持为空，不显示占位值。</p>'}

function aiDrawer(){
 const b=S.report.batch;if(!b)return '';
 const ro=b.status==='已提交',cur=b.status==='失败'?'待提交':b.status;
 const steps=['草稿','生成中','待提交','提交中','已提交'];
 return drawerHead('AI REVIEW / '+b.id,'生成结果审核',tag(b.status,ro?'good':b.status==='失败'?'high':'ai')+` <span class="meta">仅手工填写区 · 内容版本 v${b.version}</span>`)
 +`<div class="drawer-body">
  <div class="batch-status">${steps.map((s,i)=>`<span class="step ${s===cur?(b.status==='失败'?'fail':'now'):(steps.indexOf(cur)>i?'done':'')}">${s}</span>${i<steps.length-1?'<span class="arrow">'+icon('forward')+'</span>':''}`).join('')}</div>
  <div class="notice">AI 结果为<strong>待确认建议</strong>。请逐行核对「原文证据 → 匹配对象 → 建议内容」；未点击「提交生成结果」前，正式对象写入数为 <strong>0</strong>。</div>
  <div class="sec"><h3>项目跟进生成表（${b.projRows.length} 行）</h3>${b.projRows.map((r,i)=>aiRow('proj',r,i,ro)).join('')||'<div class="empty" style="padding:16px">当前没有项目跟进行。</div>'}
   ${ro?'':`<div class="row-actions">${act('补充项目跟进行','ai-add-proj','small')}</div>`}</div>
  <div class="sec"><h3>任务进度生成表（${b.taskRows.length} 行）</h3>${b.taskRows.map((r,i)=>aiRow('task',r,i,ro)).join('')||'<div class="empty" style="padding:16px">当前没有任务进度行。</div>'}
   ${ro?'':`<div class="row-actions">${act('补充任务进度行','ai-add-task','small')}</div>`}</div>
  ${ro?'<div class="notice warn">已提交批次<strong>只读</strong>，不可重复提交。如需修正，请使用「回滚本次生成」并重新生成新批次；回滚需二次确认并保留审计日志。</div>':''}
 </div>
 <div class="drawer-foot">
  ${ro?act('回滚本次生成','rollback-ai','small danger'):''}
  ${ro?'':`${act('暂不处理','close-overlay')}${act(b.status==='失败'?'修正并重试提交':'提交生成结果','ai-submit','primary')}`}
 </div>`;
}
function aiRow(kind,r,i,ro){
 if(kind==='proj'){
  return `<div class="ai-row${r.error?' error':''}">
   <div class="ai-row-head">${tag('AI 建议','ai')}${matchTag(r.match)}<span class="meta">行 ${i+1}</span></div>
   <div class="evidence"><strong>原文证据：</strong>${esc(r.evidence)}<br><strong>匹配理由：</strong>${esc(r.reason)}</div>
   <div class="field"><label for="ai-p-${i}">匹配项目（未匹配必须人工选择，不自动创建对象）</label>
    ${choice({id:`ai-p-${i}`,className:`input`,bindings:{"ai-p":`${i}`},disabled:ro},opts(['请选择项目',...D.projects.map(p=>p.name)],r.project))}</div>
   <div class="field" style="margin-top:8px"><label for="ai-pc-${i}">跟进内容</label>
    <textarea class="input" id="ai-pc-${i}" data-ai-pc="${i}" ${ro?'disabled':''}>${esc(r.content)}</textarea></div>
   ${r.error?`<p class="err" role="alert">${icon('warning')}<span>${esc(r.error)}</span></p>`:''}
   ${ro?'':`<div class="row-actions">${act('采纳本行','noop','small')}${act('移除此行','ai-del-proj:'+esc(i),'small danger')}</div>`}
  </div>`;
 }
 return `<div class="ai-row${r.error?' error':''}">
  <div class="ai-row-head">${tag('AI 建议','ai')}${matchTag(r.match)}<span class="meta">行 ${i+1}</span></div>
  <div class="evidence"><strong>原文证据：</strong>${esc(r.evidence)}<br><strong>匹配理由：</strong>${esc(r.reason)}</div>
  <div class="field"><label for="ai-t-${i}">匹配任务</label>
   ${choice({id:`ai-t-${i}`,className:`input`,bindings:{"ai-t":`${i}`},disabled:ro},opts(['请选择任务',...D.tasks.map(t=>t.name)],r.task))}</div>
  <div class="diff" style="margin-top:8px">
   <div class="box"><b>当前状态</b>${esc(r.current||'未开始')}</div>
   <div class="box"><b>建议状态</b>${esc(r.status)}</div>

   <textarea class="input" id="ai-tc-${i}" data-ai-tc="${i}" ${ro?'disabled':''}>${esc(r.content)}</textarea></div>
  ${r.error?`<p class="err" role="alert">${icon('warning')}<span>${esc(r.error)}</span></p>`:''}
  ${ro?'':`<div class="row-actions">${act('采纳本行','noop','small')}${act('移除此行','ai-del-task:'+esc(i),'small danger')}</div>`}
 </div>`;
}

function infoDrawer(name){
 return drawerHead('PROTOTYPE NOTE',esc(name),'<span class="meta">交互占位</span>')
 +`<div class="drawer-body"><div class="notice warn">此入口为原型占位，用于说明该功能的位置与交互意图，不执行真实新增、编辑、删除或批量删除。</div>
  <p class="meta">正式实现需：服务端逐条关联校验、返回成功 / 失败明细；关联对象与已提交批次采用软删除并保留操作日志；失败项需给出对象名称、阻断关联与处理建议。</p></div>`;

function dialog(title,body,ok,okText,danger,extra,cancelText){
 S.dialog={title,body,ok,okText,danger,extra,cancelText};renderOverlay();
}
/* ============================== 状态同步与自动保存 ============================== */
function snapshot(){
 if(S.nav!=='reports'||S.reportMode!=='edit')return;
 const m=$('manual'),n=$('next');
 if(m)S.report.manual=m.innerHTML;
 if(n)S.report.next=n.innerHTML;
 const b=S.report.batch;
 document.querySelectorAll('[data-ff]').forEach(el=>{if(S.report.final)S.report.final[el.dataset.ff]=el.value});
 document.querySelectorAll('[data-src]').forEach(el=>{const s=S.report.sources[+el.dataset.src];if(s)s.text=el.value});
 if(!b)return;
 document.querySelectorAll('[data-ai-p]').forEach(el=>{const r=b.projRows[+el.dataset.aiP];if(r)r.project=el.value});
 document.querySelectorAll('[data-ai-pc]').forEach(el=>{const r=b.projRows[+el.dataset.aiPc];if(r)r.content=el.value});
 document.querySelectorAll('[data-ai-t]').forEach(el=>{const r=b.taskRows[+el.dataset.aiT];if(r)r.task=el.value});
 document.querySelectorAll('[data-ai-tc]').forEach(el=>{const r=b.taskRows[+el.dataset.aiTc];if(r)r.content=el.value});
}
const textOf=html=>{const d=document.createElement('div');d.innerHTML=html||'';return (d.textContent||'').trim()};
function autoSave(){
 if(!S.session)return;
 S.report.save='有未保存的更改';
 if($('save-state'))$('save-state').textContent=S.report.save;
 clearTimeout(S.autoTimer);
 S.autoTimer=setTimeout(()=>{
  snapshot();
  if(!S.report.created)S.report.created=today();
  S.report.version++;
  S.report.save='已自动保存（演示）· v'+S.report.version;
  if($('save-state'))$('save-state').textContent=S.report.save;
 },900);
}
/* ============================== 业务动作 ============================== */
function doSave(){
 snapshot();
 if(!S.report.created)S.report.created=today();
 S.report.version++;S.report.save='已保存草稿（演示）· v'+S.report.version;
 if($('save-state'))$('save-state').textContent=S.report.save;
 notify('演示草稿已保存：创建日期按首次成功保存生成；后续自动保存只更新更新时间，系统内部保留精确审计时间。');
}
function doSync(){
 snapshot();
 const r=S.report,btn=$('sync-btn');
 if(r.start>r.end){notify('结束日期不能早于开始日期，请检查工作周范围。');return}
 if(btn){btn.disabled=true;btn.setAttribute('aria-busy','true');btn.textContent='同步中…'}
 setTimeout(()=>{
  const matches=D.syncPool.filter(x=>x.date>=r.start&&x.date<=r.end&&x.person===r.syncPerson);
  const fresh=matches.filter(x=>!r.sources.some(s=>s.no===x.no));
  r.sources.push(...fresh);
  if(btn){btn.disabled=false;btn.removeAttribute('aria-busy');btn.textContent='同步数据';enhanceRegion(btn.parentElement)}
  if($('sources')){$('sources').innerHTML=sourcesHtml();enhanceRegion($('sources'))}
  if($('syncwho'))$('syncwho').textContent=r.syncPerson;
  notify(`同步完成：符合条件 ${matches.length} 条，新增 ${fresh.length} 条，重复来源已按单据编号跳过。原项目跟进与任务进度未被修改。`);
 },450);
}
function makeFinal(){
 snapshot();
 const r=S.report,manual=textOf(r.manual),next=textOf(r.next);
 if(!manual&&!r.sources.length){notify('请先填写手工内容，或在数据获取区同步已有业务记录。');return}
 r.final={topic:r.sources[0]?r.sources[0].project:'本周工作汇报',
  done:[...r.sources.map(s=>s.text),manual].filter(Boolean).join('；')||'暂无',
  risk:'待补充问题风险',next:next||'待补充下周工作计划'};
 if($('final-area')){$('final-area').innerHTML=finalHtml();enhanceRegion($('final-area'))}
 notify('最终汇报快照已生成：可编辑表达与排版，编辑不会反向改写数据获取区原文或原业务对象。');
}
function generateAI(){
 snapshot();
 const r=S.report,manual=textOf(r.manual);
 if(!manual){notify('请先在【手工填写】区输入本周工作内容；AI 只处理该区域。');return}
 if(r.batch&&r.batch.status==='已提交'){S.drawer={type:'ai'};renderOverlay();notify('该周报已有已提交批次，批次只读且不可重复提交。');return}
 if(r.batch&&r.batch.status==='失败'){S.drawer={type:'ai'};renderOverlay();notify('原批次存在失败行，请修正后重试，不新建重复批次。');return}
 if(r.batch&&r.batch.version===r.version){S.drawer={type:'ai'};renderOverlay();notify('已打开同一内容版本的待提交批次，避免重复生成。');return}
 const p=D.projects.find(x=>manual.includes(x.name));
 const t=D.tasks.find(x=>manual.includes(x.name));
 const clip=n=>manual.slice(0,n);
 r.batch={id:'B-'+String(Date.now()).slice(-6),status:'待提交',version:Math.max(r.version,1),
  projRows:[{project:p?p.name:'请选择项目',content:clip(90),evidence:clip(110),reason:p?'原文命中项目名称「'+p.name+'」':'未命中任何项目名称，需人工选择（不自动创建对象）',match:p?'名称命中':'需人工指定',error:''}],
  taskRows:[{task:t?t.name:'请选择任务',current:'进行中',status:'进行中',content:clip(90),evidence:clip(110),reason:t?'原文命中任务名称「'+t.name+'」':'未命中任何任务名称，需人工选择（不自动创建对象）',match:t?'名称命中':'需人工指定',error:''}]};
 if($('ai-summary'))$('ai-summary').innerHTML=batchSummary();
 S.drawer={type:'ai'};renderOverlay();
 notify('已生成待确认建议：请核对原文证据与匹配对象；提交前不会写回任何正式对象。');
}
function submitAI(){
 snapshot();
 const b=S.report.batch;
 if(!b||b.status==='已提交'){notify('已提交批次不可重复提交。');return}
 let bad=0;
 b.projRows.forEach(r=>{
  r.error=r.project==='请选择项目'?'未选择匹配项目：项目无法匹配时必须人工选择，系统不自动创建对象。'
   :!r.content.trim()?'跟进内容为空：请补充后再提交。':'';
  if(r.error)bad++;
 });
 b.taskRows.forEach(r=>{
  r.error=r.task==='请选择任务'?'未选择匹配任务：任务无法匹配时必须人工选择，系统不自动创建对象。'
   :!r.content.trim()?'进度内容为空：请补充后再提交。':'';
  if(r.error)bad++;
 });
 if(bad){
  b.status='失败';
  renderOverlay();
  if($('ai-summary'))$('ai-summary').innerHTML=batchSummary();
  notify(`校验未通过：${bad} 行存在问题。正式对象写入已全部回滚，错误行与原因保留，可在原批次修正后重试。`);
  return;
 }
 const n=b.projRows.length,m=b.taskRows.length;
 const projNames=[...new Set(b.projRows.map(r=>r.project))].join('、');
 const taskNames=[...new Set(b.taskRows.map(r=>r.task))].join('、');
 dialog('确认提交 AI 生成结果',
  `将按批次 <strong>${esc(b.id)}</strong> 拆分写入：<br>· 项目跟进 <strong>${n}</strong> 条 → 影响项目：${esc(projNames)}<br>· 任务进度 <strong>${m}</strong> 条 → 影响任务：${esc(taskNames)}<br><br>该事务为一次性提交：任一行失败则全部回滚，不产生半成品数据。提交后批次转为只读；如需修正，只能回滚后重新生成。`,
  'ai-commit','确认提交生成结果');
}
/* ============================== 事件绑定 ============================== */
function handleAction(a){
 if(!a)return;
 const [k,...rest]=a.split(':'),id=rest.join(':');
 switch(k){
  case 'refresh':S.loading=true;render();setTimeout(()=>{S.loading=false;render();notify('演示数据已刷新。')},600);break;
  case 'scope-toggle':S.scope=S.scope==='dept'?'me':'dept';render();
   notify(S.scope==='me'?'已切换到我的视角：业务人员字段默认当前登录人员，任务清单按负责人过滤。':'已切换到部门整体视角。');break;
  case 'new-report':UI.pageScroll.set(S.nav+':'+(S.nav==='reports'?S.reportMode:''),window.scrollY);S.nav='reports';S.reportMode='edit';S.drawer=null;S.dialog=null;window.scrollTo(0,0);render();break;
  case 'report-list':snapshot();S.reportMode='list';window.scrollTo(0,0);render();restorePageContext();break;
  case 'open-report':saveScroll();S.drawer={type:'report',id};renderOverlay();break;
  case 'open-project':saveScroll();S.drawer={type:'project',id};renderOverlay();break;
  case 'open-task':saveScroll();S.drawer={type:'task',id};renderOverlay();break;
  case 'open-ue':saveScroll();S.drawer={type:'ue'};renderOverlay();break;
  case 'close-overlay':if(S.form){closeForm();break}S.form=null;S.drawer=null;S.dialog=null;renderOverlay();restoreScroll();break;
  case 'cancel-dialog':S.dialog=null;renderOverlay();break;  case 'dialog-ok':case 'confirm-dialog':{
   const ok=S.dialog?S.dialog.ok:null;
   if(ok==='add-stage'){
    const el=$('stage-name'),v=(el?el.value:'').trim();
    if(!v){notify('阶段名称不能为空。');if(el)el.focus();return}
    if(stageNames().includes(v)){notify('阶段名称「'+v+'」已存在，请直接在下拉中选用，不做重复创建。');if(el)el.focus();return}
    const rec={no:billNo('ST',D.stages),name:v,sort:D.stages.length+1,created:today(),createdBy:curUser(),createdDept:curDept()};
    D.stages.push(rec);
    S.dialog=null;
    if(S.form&&(S.form.type==='new-project'||S.form.type==='edit-project')){
     S.form.draft.stage=v;renderOverlay();
     notify('项目阶段「'+v+'」已新增（'+rec.no+'）并回填当前项目（演示）。');
    }else{
     render();notify('项目阶段「'+v+'」已新增（'+rec.no+'）；正式实现先保存阶段档案再回填当前项目。');
    }
    return;
   }
   S.dialog=null;renderOverlay();if(ok)handleAction(ok);break;
  }
  case 'reset-reports':S.week='all';S.rPerson='all';S.rStatus='all';S.rQ='';render();break;
  case 'reset-projects':S.pQ='';S.pStage='all';render();break;
  case 'reset-tasks':S.tOwner='all';S.tPri='all';S.tStatus='all';render();break;
  case 'save-draft':doSave();break;
  case 'sync':doSync();break;
  case 'make-final':makeFinal();break;
  case 'generate-ai':generateAI();break;
  case 'submit-report':{
   snapshot();const r=S.report;
   if(r.start>r.end){notify('工作周结束日期不能早于开始日期。');return}
   if(!r.final){notify('请先生成并检查最终汇报，再提交周报。');return}
   dialog('确认提交周报',
    `将保存 <strong>${r.person}</strong> 第 <strong>${r.week}</strong> 周（${r.start} — ${r.end}）的最终汇报快照，并提交周报状态。<br><br>本次提交<strong>不会</strong>执行 AI 生成，也<strong>不会</strong>创建或修改项目跟进、任务进度。如需写入业务对象，请回到 AI 批次使用「提交生成结果」。`,
    'report-commit','提交周报');
   break;
  }
  case 'report-commit':{
   S.report.status='已提交';if(!S.report.created)S.report.created=today();S.report.save='已提交（演示）';
   snapshot();
   /* 需求①：提交成功后自动返回工作汇报列表，不驻留编辑态 */
   S.reportMode='list';S.drawer=null;S.dialog=null;window.scrollTo(0,0);render();
   notify('周报已提交（演示）：只改变周报状态并保存汇报快照，未产生任何项目跟进或任务进度；已自动返回工作汇报列表。');break;
  }
  case 'view-ai':S.drawer={type:'ai'};renderOverlay();break;
  case 'ai-submit':submitAI();break;
  case 'ai-commit':S.report.batch.status='已提交';render();
   notify('演示批次已提交并转为只读。正式环境此处按事务拆分写入项目跟进与任务进度，失败则全部回滚。');break;
  case 'rollback-ai':dialog('确认回滚本次生成',
   '将撤销本批次已创建的项目跟进与任务进度记录，并按回写前快照回滚（不得硬编码原值），同时保留操作日志与审计信息。已回滚批次不可再次提交；如需重新写入，请基于最新手工内容生成新批次。<br><br>此动作不可自动恢复。',
   'ai-rollback-do','确认回滚',true);break;
  case 'ai-rollback-do':S.report.batch=null;render();notify('演示批次已回滚并保留审计日志占位。');break;
  case 'ai-del-proj':case 'ai-del-task':{
   const b=S.report.batch;if(!b||b.status==='已提交')break;
   (k==='ai-del-proj'?b.projRows:b.taskRows).splice(+id,1);
   renderOverlay();if($('ai-summary'))$('ai-summary').innerHTML=batchSummary();break;
  }
  case 'ai-add-proj':case 'ai-add-task':{
   const b=S.report.batch;if(!b||b.status==='已提交')break;
   if(k==='ai-add-proj')b.projRows.push({project:'请选择项目',content:'',evidence:'用户补充行',reason:'人工新增',match:'需人工指定',error:''});
   else b.taskRows.push({task:'请选择任务',current:'未开始',status:'未开始',content:'',evidence:'用户补充行',reason:'人工新增',match:'需人工指定',error:''});
   renderOverlay();if($('ai-summary'))$('ai-summary').innerHTML=batchSummary();break;
  }
  case 'source-open':notify('来源记录 '+id+'：正式实现跳转原记录详情；演示环境仅展示来源 ID，用于可追溯校验。');break;
  case 'manage-stages':saveScroll();S.drawer={type:'stages'};renderOverlay();break;
  case 'add-stage':case 'quick-add-stage':dialog('新建项目阶段',
   '项目阶段为单选，可在项目表单内直接新建：先保存阶段档案，成功后自动回填当前项目；同名时提示复用已有阶段，不做重复创建。',
   'add-stage','新建阶段',false,
   '<div class="field" style="margin-top:12px"><label for="stage-name">阶段名称 <span class="req">*</span></label><input id="stage-name" class="input" maxlength="30" placeholder="例如：试点验证"></div>');break;
  case 'edit-stage':openForm('edit-stage',id);break;
  case 'del-stage':{
   const st=D.stages.find(v=>v.no===id);
   if(!st){notify('该阶段不存在或已被删除。');break}
   const used=D.projects.filter(p=>p.stage===st.name).length;
   if(used){notify('「'+st.name+'」正被 '+used+' 个项目使用，不可直接删除；请先解除项目关联。');break}
   dialog('删除项目阶段','确认删除未被使用的项目阶段「'+esc(st.name)+'」（单据编号 '+esc(st.no)+'）？删除后该单据编号随之释放并保留操作日志；批量删除需逐项返回成功 / 失败明细。','del-stage-do:'+id,'删除阶段',true);break;
  }
  case 'del-stage-do':{const i=D.stages.findIndex(v=>v.no===id);if(i>=0){const [rm]=D.stages.splice(i,1);render();notify('阶段「'+rm.name+'」已删除（演示）：单据编号 '+rm.no+' 已释放。')}else notify('该阶段不存在或已被删除。');break}
  case 'adjust-progress':dialog('人工修正项目进度','正式操作必须：填写修正原因、记录修正人与修正时间、保存修正前后数值；取消修正需二次确认。后续末级任务变化触发重算时，先提示「保留人工修正 / 采用最新计算值」，不静默覆盖。','noop','了解');break;
  case 'delete-project':{
   const p=D.projects.find(x=>x.id===id);
   if(!p){notify('该项目不存在或已被删除。');break}
   const relTasks=D.tasks.filter(t=>t.project===p.name).length,relFollows=D.follows.filter(f=>f.project===p.name).length;
   dialog('删除项目','确认删除项目「'+esc(p.name)+'」（单据编号 '+esc(p.no)+'）？<br><br>删除前关联校验：该项目存在 <strong>'+relTasks+'</strong> 项关联任务、<strong>'+relFollows+'</strong> 条项目跟进。删除后项目单据编号随之释放、不会复用到其他记录；关联任务与跟进记录保留，但需人工重新归属。<br><br>正式实现必须：服务端逐条校验 → 返回成功 / 失败明细 → 已进入正式批次的记录采用软删除并保留来源与日志，禁止物理删除导致断链。','delete-project-do:'+id,'删除项目',true);break;
  }
  case 'delete-project-do':{

   if(i<0){notify('该项目不存在或已被删除。');break}
   const [rm]=D.projects.splice(i,1);

document.addEventListener('click',e=>{

  const start=e.target.selectionStart,end=e.target.selectionEnd,direction=e.target.selectionDirection,sc=window.scrollY;

  window.scrollTo(0,sc);return;

 if(e.target.matches('#manual,#next,[data-src],[data-ff]'))autoSave();

 }
 if(f&&e.target.tagName==='INPUT'){
  S[f]=e.target.value;const y=window.scrollY,id=e.target.id,restore=!!e.target.closest('[data-board-search]');
  render();if(restore)$(id)?.focus({preventScroll:true});window.scrollTo(0,y);return;
 }
 if(e.target.dataset.aiP!==undefined||e.target.dataset.aiT!==undefined){
  const b=S.report.batch;if(!b)return;
  if(e.target.dataset.aiP!==undefined)b.projRows[+e.target.dataset.aiP].project=e.target.value;
  if(e.target.dataset.aiT!==undefined)b.taskRows[+e.target.dataset.aiT].task=e.target.value;
  if($('ai-summary'))$('ai-summary').innerHTML=batchSummary();
  return;
 }
 if(e.target.id==='file-input'){
  const file=e.target.files&&e.target.files[0];if(!file)return;
  const box=$(S.uploadTarget||'manual');
  S.report.attach.push({name:file.name,status:'本地演示，未上传'});
  if($('attach'))$('attach').innerHTML=S.report.attach.map(a=>tag(a.name+' · '+a.status)).join('');
  if(box&&file.type.indexOf('image/')===0){
   const rd=new FileReader();
   rd.onload=()=>{box.insertAdjacentHTML('beforeend','<figure style="margin:8px 0"><img src="'+rd.result+'" alt="'+esc(file.name)+'" style="max-width:100%;border:1px solid var(--line)"><figcaption style="font-size:var(--fs-helper);color:var(--text-3)">'+esc(file.name)+' · 仅本地预览</figcaption></figure>');autoSave()};
   rd.readAsDataURL(file);
  }else if(box){box.insertAdjacentHTML('beforeend','<p>附件：'+esc(file.name)+'（本地演示，未上传至服务端）</p>');autoSave()}
  e.target.value='';
  notify('文件已加入本地预览，未上传至服务端。');
 }
});
document.addEventListener('paste',e=>{
 const box=e.target.closest?e.target.closest('.richbox'):null;
 if(!box)return;
 const items=e.clipboardData?[...(e.clipboardData.items||[])]:[];
 const item=items.find(i=>i.type.indexOf('image/')===0);
 if(!item)return;
 e.preventDefault();
 const file=item.getAsFile(),rd=new FileReader();
 rd.onload=()=>{box.insertAdjacentHTML('beforeend','<figure style="margin:8px 0"><img src="'+rd.result+'" alt="粘贴的截图" style="max-width:100%;border:1px solid var(--line)"><figcaption style="font-size:var(--fs-helper);color:var(--text-3)">粘贴的截图 · 仅当前演示页面可见</figcaption></figure>');autoSave()};
 rd.readAsDataURL(file);
 notify('截图已插入演示编辑区（第一级降级：剪贴板粘贴），未上传服务端。');
});
document.addEventListener('keydown',e=>{
 if(e.isComposing||e.keyCode===229||activeChoice?.composing||e.key!=='Escape')return;
 if(S.dialog){S.dialog=null;renderOverlay();return}
 if(S.drawer){if(S.form){closeForm();return}S.drawer=null;renderOverlay();restoreScroll()}
});
render();
</script>
</body></html>
