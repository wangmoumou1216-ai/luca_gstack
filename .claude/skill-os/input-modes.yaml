version: 1
principle: "Skill-first, Graph-optional"

skills:
  auto:
    modes:
      standalone:
        required: ["natural_language_requirement"]
        optional: ["scene", "existing_artifacts"]
      workflow:
        required: []
        optional: ["topic", "scene"]
    quality_gates: ["skill_pipeline_complete", "artifacts_produced"]

  handoff:
    modes:
      standalone:
        required: []
        optional: ["next_session_focus"]
    quality_gates: ["os_temp_output", "artifact_references_not_duplication", "sensitive_data_redacted", "suggested_skills_verified"]
    notes: "用户显式调用的会话交接工具；输出 OS 临时目录，不碰项目级交接目录、工作流记录、当前话题或 checkpoint，不参与 workflow gate，也不要求项目 pin。"

  wait-what:
    modes:
      standalone:
        required: ["previous_assistant_message"]
        optional: ["conversation_context", "focus_segment"]
    quality_gates: ["missing_premise_restored", "natural_chinese", "project_vocabulary_reused_when_available", "repitch_only", "no_side_effects"]
    notes: "显式调用的对话修复覆盖层；只重讲上一条回复，不创建产物/handoff、不改 workflow state、不要求项目 pin。"

  domain-modeling:
    modes:
      standalone:
        required: ["domain_question"]
        optional: ["existing_glossary", "code_evidence", "exact_authorized_artifact"]
      internal:
        required: ["caller", "domain_question", "trigger_condition", "scope", "inherited_authority", "authority_effect_intersection"]
        optional: ["parent_u_id", "exact_authorized_artifact", "existing_glossary", "code_evidence"]
    quality_gates: ["scope_bound", "facts_separated_from_decisions", "human_answer_required", "code_evidence_honest", "authorized_writes_only", "structured_return", "caller_resumed"]
    notes: "手动或语义触发，也可由上游条件调用；无独立 workflow 节点/state。未给 exact artifact 写入授权时只分析；NO_PIN 不读写下游项目。"

  writing-for-agents:
    modes:
      standalone:
        required: ["agent_facing_document_target"]
        optional: ["consuming_agent", "observed_failure", "target_behavior", "validation_command"]
    quality_gates: ["truth_owner_preserved", "pointer_reachability", "information_hierarchy", "checkable_completion_criteria", "single_source_of_truth", "no_op_pruned", "requested_effect_only", "fresh_validation_evidence"]
    notes: "Agent-facing 文档写作/评审参考；skill-creator 或领域 skill 仍拥有流程与事实。本 skill 不独占 workflow 节点，不自产 handoff/state，不扩大 effect authority。"

  writing-workshop:
    modes:
      standalone:
        required: ["entry_mode"]
        optional: ["topic", "conversation_material", "material_path", "output_path", "reader_prerequisites", "caller", "resume_target"]
    entry_modes:
      fragments:
        required: ["topic", "output_path"]
        optional: ["conversation_material"]
      shape:
        required: ["material_path", "output_path"]
        optional: ["reader_prerequisites"]
      beats:
        required: ["material_path", "output_path"]
        optional: ["reader_prerequisites"]
    quality_gates: ["explicit_workshop_and_mode_selection", "exact_authorized_paths", "full_material_read_when_exploit", "distinct_canonical_path_and_inode", "real_prerequisite_and_unit_choice", "disk_reread_before_each_write", "single_increment_then_wait", "author_edits_preserved", "actual_context_cost_handoff"]
    notes: "仅显式 writing-workshop 与真实 mode 选择；三 entry_modes 共用本 key，不是 Workflow modes。fragments 用真实初始语料探索；shape/beats 原料只读且输出另文件；缺必要路径或权限不写。普通编辑/文章润色与 UX 微文案仍归原 owner。"

  loop-me:
    modes:
      standalone:
        required: []
        optional: ["goal", "workspace_context_path", "workflow_spec_path", "existing_spec", "caller", "resume_target"]
    write_requirements: ["workspace_context_path", "workflow_spec_path", "exact_path_write_authority", "real_loop_selection"]
    quality_gates: ["explicit_design_selection", "real_world_context", "thin_context_interview", "ready_frontier_rounds", "real_answers_only", "no_implementation_changing_open_questions", "shared_understanding_confirmed", "spec_cas_and_user_edits_preserved", "actual_context_cost_handoff"]
    notes: "goal 可空；真实 workspace_context_path 的上下文薄则先访谈，已有答案复用。两路径缺失/未授权只设计与等待、不写 spec。输出为该用户明确批准的 workflows/<slug>.md，不创建 NOTES、调度器或运行既有流程；与执行/自动化调度反路由。"

  issue-triage:
    modes:
      standalone:
        required: ["tracker_material", "maintainer_goal"]
        optional: ["tracker_target", "category_mapping", "state_mapping", "mapping_source", "external_pr_scope", "out_of_scope_root", "existing_notes_or_brief", "conditional_write_capability", "caller", "resume_target"]
    quality_gates: ["explicit_maintainer_selection", "actual_material_coverage", "existing_category_state_mapping_confirmed", "three_attention_buckets_oldest_first", "external_pr_discovery_scope_confirmed", "exactly_one_category_and_state", "history_and_reporter_response_preserved", "concept_redundancy_and_rejection_checks", "claim_verified_before_grilling", "durable_outcome_contract", "each_effect_separately_authorized_and_read_back", "actual_context_cost_handoff"]
    notes: "tracker_material 可为已授权离线 Issue/PR；缺 tracker 接入不安装或获得远端权。已有 category/state 映射缺失或冲突须真实确认；external_pr_scope 只筛 discovery，明确点名内部 PR 仍处理。out_of_scope_root 可选且须精确读写范围。无 conditional write capability 只交未应用预览；comment/close/send 明确批准。区别于原始需求批量筛选、代码双轴评审和 task-plan/to-tickets。"

  setup-wizard:
    modes:
      standalone:
        required: ["service_goal", "manual_step_contract", "output_path"]
        optional: ["authorized_public_materials", "current_and_target_state", "existing_script_preimage", "confirmed_env_target", "confirmed_ci_target"]
    quality_gates: ["explicit_wizard_selection", "complete_manual_contract_human_confirmed", "exact_script_path_authorized", "real_journey_and_recovery", "all_values_classified_and_targeted", "template_library_byte_preservation", "stages_complete_and_total_equal", "runtime_confirm_before_each_effect", "secret_not_in_script_or_logs", "fresh_static_validation", "not_run_by_agent", "actual_context_cost_handoff"]
    notes: "仅制作人运行的 Bash 向导；目标服务、阶段、值分类/来源/落点与精确路径真实确认后写 STAGES。Agent 可直接完成的自动化/排障/实现归原 owner。生成不授予读取真实 secret、浏览器/服务写入、安装、Git 或执行脚本权限；服务配置仍待人运行。"

  magicpath:
    modes:
      standalone:
        required: ["ui_requirement"]
        optional: ["design_brief_artifact", "external_design_system"]
      workflow:
        required: ["design_brief_artifact"]
        optional: ["ux_brainstorm_artifact"]
    quality_gates: ["design_generation_packet", "tool_consumption_contract", "page_interaction_mapping", "state_coverage", "no_packet_fact_drift", "component_rendered", "react_canvas_valid"]

  open-design:
    modes:
      standalone:
        required: ["design_source_artifact"]   # chain: design-brief 交互文档 | adhoc: 单点指定的方案 md
        optional: ["od_skill", "od_design_system", "confirmed_page_selection"]
      workflow:
        required: ["design_brief_artifact"]
        optional: ["ux_brainstorm_artifact"]
    entry_modes:
      chain: "verified task design-brief Generation Packet"
      adhoc: "explicit aligned design source; no forced PRD workflow"
      recover: "explicit bound OD project; skip source compilation, page matching and generation"
    quality_gates: ["input_source_resolved_when_not_recover", "design_generation_packet_when_chain", "no_source_fact_drift", "high_confidence_page_recommendation_only", "reference_confirmed_or_none", "platform_user_confirmed", "external_design_system_not_overridden", "designsystem_bound_verified_when_delegated", "exact_tool_target_and_write_authority"]
    completion_gates:
      exported: ["same_source_body_and_reference_materials", "no_claim_of_external_import"]
      staged: ["od_daemon_reachable", "exact_project_readback", "brief_and_all_reference_bytes_match", "no_claim_of_generation"]
      recovered: ["bound_project_only", "actual_nonempty_prototype_recovered", "all_related_artifacts_recovered", "prototype_spec_written", "honest_traceability", "project_handoff_when_pinned"]
    notes: "Brief在冻结前完成模板选择/语义适配，OD复用有效选择并在冻结后核验正式绑定/采用，不重做产品定义。未指定模板且无高置信匹配可reference=none；指定原件/未决冲突不能降级绕过。原始需求/原型先由Brief归一化，原型实际bytes可作不可变证据附件。页确认不代替工具写入权。用户在OD配置DS；仅委托时绑定验证。默认桌面端生成，headless显式opt-in，原请求最多重试1次后回同一staged项目桌面端。Claude Design只导出同包，不探测OD。EXPORTED/STAGED不是生成完成或节点DONE。"

  idea:
    modes:
      standalone:
        required: ["user_raw_idea"]
        optional: ["screenshots", "notes"]
      workflow:
        required: []
        optional: ["current_topic", "scene"]
    quality_gates: ["structured_need_list", "scene_capture"]

  deepresearch:
    modes:
      standalone:
        required: ["research_topic"]
        optional: ["scope_constraints"]
      workflow:
        required: []
        optional: ["idea_artifact", "prd_artifact"]
    quality_gates: ["source_traceability", "search_log", "consensus_matrix"]

  quick-research:
    modes:
      standalone:
        required: ["research_question"]
        optional: ["scope_constraints"]
    quality_gates: ["primary_source_only", "per_claim_attribution"]

  brainstorm:
    modes:
      standalone:
        required: ["idea_or_problem_statement"]
        optional: ["deepresearch_report", "idea_artifact"]
      workflow:
        required: []
        optional: ["deepresearch_report", "idea_artifact"]
    quality_gates: ["socratic_questions", "oracle_review", "stable_ids", "research_claim_coverage", "prd_destination_matrix", "no_unmapped_high_confidence_claims", "handoff_gate"]

  superpowers-brainstorming:
    source: "superpowers plugin"
    invoke: "Skill tool → superpowers:brainstorming"
    modes:
      standalone:
        required: ["idea_or_problem_statement"]
        optional: ["idea_artifact", "deepresearch_report"]
      workflow:
        required: []
        optional: ["idea_artifact"]
    quality_gates: ["design_doc_written", "user_approved_design"]
    notes: "/brainstorm 的轻量替代。不含 subagent、Oracle、AI Native 评估。适用场景 A/B。"

  ux-research:
    modes:
      standalone:
        required: ["design_question"]
        optional: ["prd_artifact", "screenshots"]
      workflow:
        required: []
        optional: ["prd_artifact", "brainstorm_output"]
    quality_gates: ["human_research_plan_gate", "source_traceability", "consensus_matrix", "research_only"]

  ux-brainstorm:
    modes:
      standalone:
        required: ["design_problem_or_idea"]
        optional: ["ux_research_report", "screenshots", "architecture_brief"]
      workflow:
        required: []
        optional: ["ux_research_report", "prd_artifact"]
    quality_gates: ["seven_ux_questions", "oracle_review", "stable_design_ids", "interaction_architecture"]

  design-brief:
    modes:
      standalone:
        required: ["design_input"]
        optional: ["prd_artifact", "ux_research_report", "ux_audit_report", "ux_brainstorm_artifact", "pasted_solution", "architecture_brief", "prototype_artifact", "voice_copy_spec"]
      workflow:
        required: ["design_input"]
        optional: ["prd_artifact", "ux_research_report", "ux_audit_report", "ux_brainstorm_artifact", "prototype_artifact", "voice_copy_spec"]
    entry_modes:
      pipeline: "ready selected design + exact chosen upstream handoff; inherit mature decisions"
      existing_requirements: "written/spoken requirements; normalize source facts without fabricated PRD"
      prototype_visual_refinement: "actual prototype + preserve scope + permitted UI changes; template adaptation before freeze"
    modes_detail:
      traceable_delivery:
        required: ["prd_artifact"]
        note: "Actual PRD end-to-end coverage required for tech-spec/task-plan/development; design-source PASS cannot substitute."
      design_generation:
        required: ["design_input"]
        note: "Complete current-source coverage permits generation from requirements/prototype without forcing PRD or research."
      standalone_light:
        required: ["design_input"]
        note: "May omit PRD, but must not claim end-to-end traceable delivery."
    quality_gates: ["design_coordinate_system", "ai_native_layers", "eight_field_decision_cards", "state_coverage", "page_interaction_mapping", "output_target_platform_scope_sources", "traceability_gate", "design_generation_packet", "tool_consumption_contract", "single_entry_contract", "source_inheritance", "prototype_preservation_when_applicable", "template_adaptation_before_freeze", "scoped_traceability"]

  html-prototype:
    modes:
      standalone:
        required: ["prototype_brief"]
        optional: ["design_brief", "ux_audit_report", "screenshots", "figma_demo_blueprint", "purpose", "ui_variant_count"]
      workflow:
        required: []
        optional: ["design_brief", "ux_audit_report", "prd_artifact", "purpose", "ui_variant_count"]
    purposes: ["ui", "logic-validation"]
    ui_variant_count: {default: 0, explicit_comparison_default: 3, allowed: [0, 2, 3, 4, 5], logic_validation_required: 0}
    source_kinds: ["design_brief", "ux_audit", "screenshot_delta", "figma_demo_blueprint", "standalone_brief", "standalone_mobile_prototype"]
    quality_gates: ["step0_cognitive_gate", "source_scope_contract", "current_design_system_when_provided", "design_generation_packet_gate", "prototype_carrier_respected", "decision_mapping_coverage", "state_mapping_coverage", "dynamic_reference_when_triggered", "prototype_qa", "purpose_count_source_contract", "logic_portability_and_real_walkthrough_when_selected", "ui_per_variant_state_content_and_aesthetic_qa", "real_variant_choice_when_comparison"]
    notes: "purpose 和 ui_variant_count 是同 key 输入/CLI属性，不是 Workflow mode。普通 ui/0 保持；显式对比才默认3、合法2–5；logic-validation 必须0且仅固定五态/24分门 N/A，其余门有效。冲突回原 owner，不切 standalone 绕 Packet。"

  figma-demo:
    modes:
      standalone:
        required: ["spoken_or_written_flow"]
        optional: ["figma_link", "figma_screenshot"]
      workflow:
        required: []
        optional: ["design_brief", "prototype_context"]
    quality_gates: ["mapping_verification", "blueprint_schema", "builder_isolation", "assembly_no_new_design"]

  tech-spec:
    modes:
      standalone:
        required: ["design_brief_handoff", "prd_artifact"]
        optional: ["ai_spec_artifact", "architecture_brief"]
      workflow:
        required: ["prd_artifact", "design_brief_handoff"]
        optional: ["prd_handoff"]
    quality_gates: ["brief_prd_end_to_end_gate_when_prd_mode", "exact_current_sources", "conflict_register", "architecture_view", "interface_contracts", "traceability_matrix", "design_mapping_coverage", "coverage_gate"]
    output_path: "docs/engineering/YYYY-MM-DD-<topic>-tech-spec.md"
    handoff_path: "docs/handoff/YYYY-MM-DD-<topic>-tech-spec-handoff.md"

  task-plan:
    modes:
      standalone:
        required: ["tech_spec_handoff", "design_brief_handoff"]
        optional: []
      workflow:
        required: ["tech_spec_handoff", "design_brief_handoff"]
        optional: []
    quality_gates: ["upstream_handoff_verdicts", "brief_prd_end_to_end_gate", "exact_current_sources", "l0_index", "l1_source_index", "l2_node_index", "assertion_matrix", "task_cards", "design_decision_coverage", "state_coverage", "coverage_gate"]
    output_path: "docs/engineering/YYYY-MM-DD-<topic>-task-plan.md"
    handoff_path: "docs/handoff/YYYY-MM-DD-<topic>-task-plan-handoff.md"

  grilling:
    modes:
      standalone:
        required: ["plan_decision_or_idea"]
        optional: ["retrievable_evidence"]
      workflow:
        required: ["consequential_unresolved_decision"]
        optional: ["parent_u_id"]
      internal:
        required: ["caller", "human_decision_gate", "condition_evidence", "authority_record_sha256", "inherited_authority", "authority_effect_intersection"]
        optional: ["parent_u_id"]
    quality_gates: ["one_decision_question_per_turn", "facts_retrieved_before_asking", "no_authority_expansion"]
    notes: "Direct/semantic/internal 共用一次一个决定规则；internal 只继承父任务 authority。"

  diagnosing-bugs:
    modes:
      standalone:
        required: ["unexpected_symptom"]
        optional: ["authorized_local_diagnostics"]
      workflow:
        required: ["unexpected_failure", "original_u_id"]
        optional: ["inherited_path_scope"]
      internal:
        required: ["caller", "unexpected_failure", "condition_evidence", "original_u_id", "authority_record_sha256", "inherited_authority", "authority_effect_intersection"]
        optional: ["inherited_path_scope"]
    quality_gates: ["symptom_hitting_red_loop", "expected_tdd_red_excluded", "diagnose_only_default", "returns_to_original_u_id"]
    notes: "自然语言异常主路由；diagnose-only 不获得写入、网络、Git 或 external effect 权限。"

  resolving-merge-conflicts:
    modes:
      standalone:
        required: ["real_in_progress_git_conflict"]
        optional: ["authorized_read_only_git_observation"]
      workflow:
        required: ["real_in_progress_git_conflict", "original_u_id"]
        optional: ["inherited_path_scope"]
      internal:
        required: ["caller", "real_in_progress_git_conflict", "condition_evidence", "original_u_id", "authority_record_sha256", "inherited_authority", "authority_effect_intersection"]
        optional: ["inherited_path_scope"]
    quality_gates: ["operation_and_unmerged_entries_confirmed", "both_intents_recovered", "mutation_doors_separate", "no_automatic_commit_or_push", "returns_to_original_u_id"]
    notes: "inspect/propose 默认只读；edit/stage/advance/abort 分门授权。"

  to-spec:
    modes:
      standalone:
        required: ["resolved_engineering_conversation"]
        optional: ["repository_evidence"]
      workflow:
        required: ["resolved_engineering_conversation"]
        optional: ["existing_tech_spec_context"]
      internal:
        required: ["caller", "resolved_engineering_conversation", "condition_evidence", "authority_record_sha256", "inherited_authority", "authority_effect_intersection"]
        optional: ["parent_u_id"]
    quality_gates: ["conversation_source_register", "no_product_or_design_invention", "canonical_tech_spec_coverage_gate"]
    notes: "薄 facade，只进入 tech-spec conversation_synthesis；不拥有第二份 spec/state。"

  to-tickets:
    modes:
      standalone:
        required: ["gated_task_plan"]
        optional: ["publication_target", "parent_reference", "include_partial"]
      workflow:
        required: ["gated_task_plan", "explicit_ticket_publication_selection"]
        optional: ["selected_engineering_delivery_preset", "publication_target", "parent_reference", "include_partial"]
    quality_gates: ["task_plan_sha_bound", "tracer_bullet_projection_only", "preview_approved_before_publish", "blocking_edges_preserved", "published_bodies_read_back"]
    notes: "Explicit-only 发布 facade；task-plan 仍是拆解/断言/依赖的唯一真值。无显式 tracker 时默认本地 .scratch 逐票文件；外部发布单独授权。"

  wayfinder:
    modes:
      standalone:
        required: ["destination", "huge", "multi_session", "fog"]
        optional: ["known_frontier"]
      workflow:
        required: ["destination", "huge", "multi_session", "fog"]
        optional: ["parent_plan_context"]
      internal:
        required: ["caller", "huge_and_multi_session_and_fog", "condition_evidence", "authority_record_sha256", "inherited_authority", "authority_effect_intersection"]
        optional: ["parent_u_id"]
    quality_gates: ["three_predicates_all_true", "plan_agent_is_only_planning_truth", "no_execution_authority"]
    notes: "三谓词是 conjunction；任一为 false 即回普通 Plan Agent/direct execution。"

  implement:
    modes:
      standalone:
        required: ["gated_tech_spec", "gated_task_plan"]
        optional: ["current_handoff"]
      workflow:
        required: ["gated_tech_spec", "gated_task_plan"]
        optional: ["selected_engineering_delivery_preset"]
      internal:
        required: ["caller", "approved_u_ids", "task_plan_sha256", "condition_evidence", "authority_record_sha256", "inherited_authority", "authority_effect_intersection"]
        optional: ["original_u_id"]
    quality_gates: ["task_plan_sha_frozen_before_compile", "exact_u_ids_human_confirmed", "plan_agent_compiles", "orchestrator_executes", "graph_optional"]
    notes: "preset selection is routing metadata, never authority；standalone 不读 optional graph。"

  code-hygiene:
    modes:
      standalone:
        required: ["scope_or_mode"]
        optional: ["target_paths", "entry_mode", "session_log_paths", "existing_checker_wiring", "package_manager", "existing_hook_owner"]
      workflow:
        required: []
        optional: ["target_paths", "entry_mode", "session_log_paths", "existing_checker_wiring"]
    entry_modes:
      environment-retro:
        required: ["session_log_paths"]
        optional: ["existing_checker_wiring"]
    recipes:
      pre-commit-setup: "explicit requested setup; inspect actual package manager and existing hook owner before proposal; installation and writes require their own scope"
    quality_gates: ["verification_iron_law", "high_confidence_apply_only", "luca_guards_preserved", "clean_tree_for_apply"]
    notes: "工程域代码约束 skill（非设计）。Iron Law 完成前验证 + 8 清理算子 + 模式 D 改动评审（基线三选一 WORKTREE_DIFF/BASE+HEAD_SHA/FILE_SET，不要求干净树；纪律见 routing-chain-check R4）。Mode D 唯一审查 owner 以 quality-gate/MR-004 peak 冷上下文严格串行，前票真实 completed/同次 accepted 后再派，缺 Spec 显式 NOT_RUN。environment-retro 查真实会话日志与已有 checker/CI 接线，只给严重度与可验证建议；产品复盘仍归 retro，不自动改 Hook/memory。"

  code-review:
    modes:
      standalone:
        required: ["code_change_scope_or_fixed_point"]
        optional: ["spec_source"]
      workflow:
        required: ["code_change_scope_or_fixed_point"]
        optional: ["spec_source", "tech_spec_handoff", "task_plan_artifact"]
    quality_gates: ["fixed_scope_resolves", "non_empty_change_set", "standards_spec_context_isolation", "serial_completed_and_same_invocation_accepted", "separate_axis_reporting", "read_only_review"]
    notes: "用户可见代码审查 facade。WORKTREE_DIFF/BASE+HEAD/FILE_SET 三选一；底层权威为 code-hygiene Mode D + routing-chain-check R4。无 spec 时 Spec 轴显式 NOT RUN，不伪造。"

  codebase-design:
    modes:
      standalone:
        required: ["module_or_interface_problem"]
        optional: ["target_paths", "caller_examples"]
      workflow:
        required: ["module_or_interface_problem"]
        optional: ["architecture_brief", "tech_spec_artifact", "target_paths"]
    quality_gates: ["stable_vocabulary", "depth_and_deletion_test", "real_seam", "interface_is_test_surface", "no_forced_workflow_node"]
    notes: "工程模块设计共享原语；可 standalone，也可由 code-recon/tech-spec/实现任务内部调用。无固定产物、无 workflow 状态所有权。"

  code-recon:
    modes:
      standalone:
        required: ["target_codebase_path"]
        optional: ["design_intent", "scope_paths", "entry_mode", "direction", "report_path"]
      workflow:
        required: []
        optional: ["design_intent", "scope_paths", "entry_mode", "direction", "report_path"]
    entry_modes:
      brief:
        required: ["target_codebase_path"]
        optional: ["design_intent", "scope_paths"]
      architecture-opportunities:
        required: ["target_codebase_path"]
        optional: ["direction", "scope_paths", "report_path"]
        write_requirements: ["canonical_report_path", "real_report_preimage", "exact_report_write_authority"]
    quality_gates: ["size_probe_decision", "serial_cold_native_recon", "same_invocation_completed_accepted", "verified_vs_inferred_audit", "architecture_brief_written_when_brief", "offline_html_report_when_architecture_opportunities", "correct_deletion_and_real_friction_evidence", "real_choice_before_grilling_design", "native_first_no_forced_mcp"]
    notes: "Brownfield 同 key：默认 brief 的固定五维队列和原 architecture_brief 下游保持；architecture-opportunities 只显式选择，有方向沿方向、无方向用真实 churn，不猜 hotspot。全部 recon 峰值1，前票真实 completed/accepted 再派；report_path 可选但写前必须批准精确 canonical 落点（默认仅建议 OS temp），离线 HTML 不套产品 UI 门。entry_mode 不是 Workflow mode；输出权限不授予代码、词汇、ADR或memory写权。"

  muse-req-triage:
    modes:
      standalone:
        required: ["candidate_requirements_or_raw_corpus"]
        optional: []
    quality_gates: ["gate1_human_decision", "no_rice_fabrication", "brainstorm_phase15_firewall"]
    notes: "standalone：接收原始语料或结构化候选，忠实提取并计算信号；accept/defer/reject 均须用户裁决。accept 项可格式化为话题字符串交给 /brainstorm，保留其置信度防火墙。"

  insight-synthesis:
    modes:
      standalone:
        required: ["primary_qualitative_data"]
        optional: ["research_question"]
      workflow:
        required: ["primary_qualitative_data"]
        optional: ["research_question"]
    quality_gates: ["observation_interpretation_split", "theme_confirmation_gate", "no_confidence_fabrication"]
    notes: "研究段第三对象角度（内部一手定性）。数据一律用户提供、skill 不自采。单 agent 六步：编码→亲和聚类→用户确认主题(AskUserQuestion 卡点)→解读跃迁；observation 带原文引用、interpretation 带置信度，两层永不混。"

  research-kit:
    modes:
      standalone:
        required: ["research_question_or_hypothesis"]
        optional: ["prd_outstanding_questions", "target_audience", "entry_mode", "recipient", "need_back", "output_path", "decision_owner", "resume_target"]
      workflow:
        required: ["research_question_or_hypothesis"]
        optional: ["prd_outstanding_questions", "target_audience", "entry_mode", "recipient", "need_back", "output_path", "decision_owner", "resume_target"]
    entry_modes:
      decision-questionnaire:
        replaces_normal_required: ["research_question_or_hypothesis"]
        required: ["recipient", "need_back", "output_path", "decision_owner"]
        optional: ["from_to_context", "deadline_and_effort", "resume_target"]
    quality_gates: ["non_leading_question_check", "every_item_maps_to_research_question", "send_role_expertise_relationship_before_subject_when_questionnaire", "need_back_decision_coverage", "single_idea_answer_stubs", "importance_themes_anything_else", "actual_original_owner_return", "no_automatic_send_or_synthesis"]
    notes: "一手研究工具设计（采集之前）。三不产：不产发现/不产解读/不采集——kit 武装 luca 去采集，insight-synthesis 消化采回的数据，中间是人工步骤。产出 docs/research/research-kit-<topic>-<date>.md。仅显式 decision-questionnaire 切同 key 分支，以 recipient/need_back/output_path 为必需输入，不先逼问发送者欠缺的 subject 知识；缺任一真实问并不写，四原模式及其下游保持，真实回复回原 decision_owner，不自动 insight-synthesis 或发送。"

  ux-writing:
    modes:
      standalone:
        required: ["product_context_or_copy_to_review"]
        optional: ["prd_artifact", "ux_brainstorm_artifact", "screenshots"]
      workflow:
        required: ["prd_artifact"]
        optional: ["ux_brainstorm_artifact"]
    quality_gates: ["semantic_verbatim_layer_split", "verbatim_never_enters_packet"]
    notes: "内容与语言设计，双相位：相位1 语义规范 pre-brief（产 voice-copy-spec，design-brief Step 1.0b 继承）；相位2 评审改写 standalone。逐字层仅 html-prototype 本地路径，永不进 OD 编译。"

governance_tools:
  compare:
    modes:
      standalone:
        required: ["comparison_targets"]
        optional: ["skill_name"]
      workflow:
        required: []
        optional: ["skill_name", "artifact_versions"]
    quality_gates: ["both_files_read", "structured_diff", "read_only"]
    notes: "方案/版本/截图对比。只读，不修改文件。输入为两个完整路径，或 skill 名称自动取最新两个版本。"

  ux-audit:
    modes:
      standalone:
        required: ["screenshot_or_page_reference"]
        optional: ["business_context"]
      workflow:
        required: []
        optional: ["prototype_output", "current_page_context"]
  redteam:
    modes:
      standalone:
        required: ["target_artifacts_or_problem"]
        optional: ["docs_context"]
      workflow:
        required: []
        optional: ["docs_artifacts", "observability_recent"]
  evals:
    modes:
      standalone:
        required: ["target_artifacts"]
        optional: ["workflow_state"]
      workflow:
        required: []
        optional: ["workflow_state", "observability_recent"]
  retro:
    modes:
      standalone:
        required: ["completed_decision_or_project"]
        optional: ["review_artifacts"]
      workflow:
        required: []
        optional: ["design_brief", "handoff_review", "ux_audit"]

