version: 1
description: >
  Universal routing map.
  Authoritative keyword and invoke reference for route-guard.mjs.
  Project context and complexity gates run before framework flows and skills.
  Sections: project context markers, framework flows, project skills (luca_gstack), and built-in skills.

project_context:
  old_project_triggers: [老项目, 已有项目, 已有的项目, 旧项目, 继续项目, 上次那个项目, 接着上次, 上次的项目, 之前那个项目, 之前的项目, 之前那个]
  new_project_triggers: [新项目, 新需求, 新功能, 我想做一个需求, 我想做一个项目]
  current_project_triggers: [当前项目, 这个项目, 本项目]

# ── luca_gstack framework flows ──────────────────────────────────────────────
# 顶层治理流程不是 skill：命中后先选择流程模式，再由流程内部调用 research/review skill。
framework_flows:

  framework_evolution:
    invoke: "framework-evolution"
    scope: "framework_meta"
    weight: 10
    triggers: [自我成长, 自我成长流程, 自我演进, 自进化, 框架演进, framework evolution, framework-evolution, framework-evolution-scout]

  engineering_delivery:
    invoke: "engineering-delivery"
    weight: 10
    # 只收用户明确选择该 preset 的完整短语；提及、询问、评审不是选择。
    # route-guard 再以纯函数检查否定/疑问语境，因为 loader 只能表达字面触发。
    triggers: [选择engineering-delivery preset, 启用engineering-delivery preset, 按engineering-delivery preset执行, 选择工程交付preset, 启用工程交付preset, 按工程交付preset执行]

# ── luca_gstack project skills ───────────────────────────────────────────────
project_skills:

  auto:
    invoke: "/auto"
    weight: 10
    # 2026-09-02 职责审计：撤裸拉丁 auto。它是全系统最高权重(10)，误命中代价最大；
    # 裸首 token "auto" 仍由 slashless command alias 直呼（实测保留），故召回零损失。
    triggers: [全流程, 自动做, 一键, 帮我全部, 端到端, 完整设计, 全套方案, 全套功能设计, 完整功能设计, 全部搞定, 整套做]

  handoff:
    invoke: "/handoff"
    weight: 8
    # 只收显式“跨 session 接手”意图；禁用裸 交接/handoff 词条，避免撞项目 handoff、
    # handoff-protocol 与 workflow handoff。裸首 token 由 slashless command 接线处理。
    triggers: [会话交接, 生成交接文档, 生成一份交接文档, 当前会话交给下个agent, 当前会话交给下一个agent, 当前会话交给下个session, 当前会话交给下一个session, 这个会话交给下个agent, 这个会话交给下一个agent, 这个会话交给下个session, 这个会话交给下一个session, 新session接手当前会话, 新session接手这个会话, session handoff]

  wait_what:
    invoke: "/wait-what"
    weight: 8
    # 上游 explicit-only：/$/裸首 token 由 direct/command loader 接线；只保留一个明确调用短语，
    # 不收「没听懂/换个说法/讲清楚」等泛词，避免劫持普通对话延续。
    triggers: [显式调用wait-what]

  writing_for_agents:
    invoke: "/writing-for-agents"
    weight: 8
    # 上游 model-invoked 范围只覆盖 skill/AGENTS.md/CLAUDE.md 写改；其余 agent-facing
    # 文档靠显式按名调用，避免劫持 tech-spec、task-plan、to-tickets 与普通「写文档」。
    triggers: [writing-for-agents, 新增skill, 新建skill, 创建skill, 修改skill, 编辑skill, 修改AGENTS.md, 编辑AGENTS.md, 修改CLAUDE.md, 编辑CLAUDE.md]

  idea:
    invoke: "/idea"
    weight: 6
    # 仅限"已有原始语料忠实结构化"场景；新想法/方向探索一律走 /brainstorm
    triggers: [会议纪要, 会议语料, 语音稿, 语音转文字, 转文字稿, 原始语料, 讨论记录, 语料转需求, 整理这段记录, 梳理这段记录]

  brainstorm:
    invoke: "/brainstorm"
    weight: 6
    triggers: [PRD, 需求文档, 产品需求, brainstorm, 写PRD, 需求梳理, 有个想法, 原始想法, 功能方向, 一个功能, 需求分析, 需求确认, 分析需求, 想梳理, 梳理需求]

  superpowers-brainstorming:
    invoke: "superpowers:brainstorming"
    # 2026-09-02 职责审计 6→7：`轻量prd`⊃`prd`、`简单需求梳理`⊃`需求梳理`(均 brainstorm w6)，
    # 等权 ⇒ 恒 MULTI，CLAUDE.md「快速梳理/轻量PRD → superpowers」这条映射在路由层从未解析成功。
    weight: 7
    triggers: [快速梳理, 轻量PRD, quick brainstorm, 简单需求梳理, superpowers brainstorm]

  deepresearch:
    invoke: "/deepresearch"
    weight: 6
    triggers: [深度研究, 调研, research, 深入研究, 全面调研, 多agent研究]
  quick_research:
    skill: quick-research
    invoke: "/quick-research"
    hint: "→ /quick-research（轻量研究：单 agent 后台查 primary source，落盘单文件；发散题升 /deepresearch）"
    # 2026-09-02 职责审计 6→7：等权时 shadow 规则失效（`调研` ⊂ `快速调研`），恒落 MULTI；
    # 升 7 后长词遮蔽短词，实测转 SINGLE。同类记忆 SC-20260811-001。
    weight: 7
    # 刻意窄词——"查一下"太宽会劫持日常问答；宽表述靠语义兜底
    triggers: [快速调研, 轻量研究, 查文档确认, 查一下资料, 查下官方文档, 帮我查证]

  ux_research:
    invoke: "/ux-research"
    weight: 7
    triggers: [UX研究, 竞品分析, 设计调研, 用户研究, 体验分析, UX调研]

  ux_brainstorm:
    invoke: "/ux-brainstorm"
    weight: 7
    triggers: [设计方案, UI方案, 设计brainstorm, 界面方案, UX方案]

  design_brief:
    invoke: "/design-brief"
    weight: 6
    triggers: [轻量交互, 原型决策, design brief, 方案落地, 交互文档, 落地方案, 方案细化]

  html_prototype:
    invoke: "/html-prototype"
    weight: 7
    triggers: [做个原型, 生成HTML, HTML原型, prototype, 快速原型, 原型界面, 本地原型]

  ux_audit:
    invoke: "/ux-audit"
    weight: 7
    # 2026-07-31 撤四个零对象泛词（评审/挑毛病/有什么问题/给建议）：它们把**任何**评审意图硬映射到
    #   这个强制截图的页面 skill（实测 `评审代码`/`帮我评审一下刚才那份计划` 全 SINGLE 落此，
    #   EP-20260714-075 实录误报）。撤后落 STOP → route-guard 评审轴提示钉 → routing-chain-check R4
    #   按评审对象分流（页面对象仍回本 skill）。保留的复合词全部含"页面/UX/体验"对象信息。
    triggers: [UX问题, 页面评审, 体验评审, UX评审, 评审这个页面, 页面有什么问题, 页面挑毛病]

  figma_layer:
    invoke: "/figma-layer"
    weight: 5
    # 2026-09-02 职责审计：撤裸词 Figma/figma，补 CJK 复合词保召回。依据 SC-20260610-001——
    # 本 skill 只适用「已有 HTML 原型一比一还原到 Figma」，裸词把一切 Figma 话题
    # （"figma MCP 怎么配"/独立设计写入）都判成 SINGLE，属结构性误命中。
    triggers: [保险层, figma保险层, 推到figma, 推到Figma, 同步到figma, 同步到Figma, 还原到figma, 还原到Figma, figma保险]

  # figma_demo / compare / magicpath 2026-07-03 移出一级路由（全量搭建 review P2-6，
  # framework-audit/2026-07-03-full-review.md）：近30天 episodic skills_used 零调用，
  # 降级为隐藏 skill（磁盘目录/命令逻辑零删除，仅撤销 /office 展示+关键词触发+slash
  # command 入口；仍可被 open-design/design-brief/html-prototype 等内部 Skill 工具按
  # 名 dispatch，如 open-design 的界面产出备选链）。见 CLAUDE.md「隐藏/高级 skill」。

  open_design:
    invoke: "/open-design"
    weight: 8
    # 这里只列「Open Design / OD」产品名提及，作为粗匹配粗网（与 design_brief「交互文档」/
    # figma_layer「figma」隔离；禁用裸 "od"——substring 会误中 product/model/method）。
    # 【单点交接】"把刚产出的 md 给 OD" 不在此写死交接措辞：它是【语义识别】，由 Claude 按
    # CLAUDE.md「单点交接到 OD」规则结合上下文理解意图后路由（用户要求：结合语义，不靠词表）。
    triggers: [Open Design, open design, opendesign, OpenDesign, OD生成, OD出图, OD设计, OD原型, 用OD做]

  tech_spec:
    invoke: "/tech-spec"
    weight: 7
    triggers: [工程规格, 技术文档, tech spec, engineering spec, 技术合同, 工程合同, 开发规格, 技术规格]

  task_plan:
    invoke: "/task-plan"
    weight: 7
    triggers: [任务编排, 任务计划, 开发计划, task plan, 拆任务, 任务拆解, 编排任务, 开发编排, 任务分解]

  # Engineering-delivery 六项 canonical 的 semantic SSOT。direct 由同名 command/alias；
  # semantic 只取下列触发；internal 由 Plan Agent / Orchestrator 按 canonical SKILL 合同 dispatch。
  # internal 只继承父任务 authority，routing 命中本身不增加 path/Git/network/external effect。
  grilling:
    invoke: "/grilling"
    weight: 8
    # 决策压力测试必须含「逐个/一次一个/问到底」或明确 grill 语义；普通澄清与事实检索不命中。
    triggers: [grilling, grill me, 逐个拷问, 一次只问一个决定, 一次一个问题盘问, 把这个决定问到底, 对这个方案逐项盘问, 逐个逼问尚未决定的关键取舍]

  diagnosing-bugs:
    invoke: "/diagnosing-bugs"
    weight: 8
    # 自然语言异常主路由；刻意不收「测试失败/写测试」等 TDD red 泛词。
    triggers: [diagnosing-bugs, diagnose bug, 意外失败, 未知回归, 回归故障, 性能回归, 偶发故障, flaky bug, debug这个报错, 找出这个bug根因, 排查这个异常报错, 诊断这个具体bug, 排查这个性能回归]

  resolving-merge-conflicts:
    invoke: "/resolving-merge-conflicts"
    weight: 8
    # 只收真实 Git operation 形态；文件里有冲突标记、分支分歧、未来可能冲突均不命中。
    triggers: [resolving-merge-conflicts, 当前merge冲突, 当前合并冲突, 当前rebase冲突, 当前cherry-pick冲突, 当前revert冲突, 解决当前Git冲突, 处理这个真实进行中的Git冲突]

  to-spec:
    invoke: "/to-spec"
    weight: 8
    # 已解决工程讨论的 synthesis；开放产品/UI 决策仍由其原 owner 处理。
    triggers: [to-spec, conversation to spec, 把已确认的工程讨论整理成规格, 把刚才定下的工程约束整理成技术规格, 将已解决的工程讨论转成tech spec, 根据刚才讨论直接形成spec不要重做访谈]

  to-tickets:
    invoke: "/to-tickets"
    weight: 8
    # 上游 explicit-only：只收同名显式调用；泛「拆任务/ticket/工单」仍归 task-plan 或业务语义。
    triggers: [to-tickets]

  wayfinder:
    invoke: "/wayfinder"
    weight: 8
    # 完整 huge AND multi-session AND fog 由 route-guard 的窄 conjunction 检查表达；
    # 此处只保留显式按名，避免绕过 complexity 将自动建议降成 SINGLE_SKILL。
    triggers: [wayfinder]

  implement:
    invoke: "/implement"
    weight: 8
    # 只接已过 gate/已冻结计划；普通「实现一个功能」仍先走 Plan complexity。
    triggers: [implement, 执行已批准U-ID, 开始实现已批准任务, 落地已冻结task-plan, 按已批准任务计划实现, 按这个批准的spec执行, 按这个批准的task-plan执行, 按这个批准的U-ID执行]

  code_hygiene:
    invoke: "/code-hygiene"
    weight: 6
    # 工程域代码约束：Iron Law + 8 清理算子。代码 review 触发词归专用 code-review facade，
    # facade 再复用本 skill Mode D，避免两个 project skill 等权命中。
    triggers: [代码清理, 清理代码, 死代码, 删死代码, 代码去重, 弱类型, 代码质量, 代码体检, 工程体检, 完成前验证, cleanup, code-hygiene, 清理冗余]

  code_review:
    invoke: "/code-review"
    weight: 8
    # 固定代码对象 + 审查动作；不收裸 review/评审，避免劫持 UX、文档、方案和普通复查。
    # `preview` 不含任何完整触发项，保留 2026-07-31 的子串防回归边界。
    triggers: [代码审查, 代码评审, 评审代码, 代码review, code review, 审查这个PR, 评审这个PR, review当前改动, review这个分支, 评审这个分支, review since]

  codebase_design:
    invoke: "/codebase-design"
    weight: 7
    # 纯工程模块对象；刻意不收裸“接口设计/架构设计”，避免劫持产品/UX 设计管线。
    triggers: [codebase-design, 深模块, 浅模块, 模块深度, 模块边界, seam设计, 模块seam, 模块拆分方案, 接口可测性, 深化模块]

  code_recon:
    invoke: "/code-recon"
    weight: 6
    # Brownfield 正门（非设计 skill）：现有代码 → 架构 brief → 喂设计管线。触发全为复合短语，
    # 语义锁「理解/读懂现有代码结构」，与 code_hygiene(清理/死代码)、systematic-debugging(调试/找bug)、
    # deepresearch(联网调研) 隔离；不含裸"代码"单字避免广撞。
    triggers: [理解现有代码, 读懂代码库, 读懂现有代码, 摸清代码结构, 现有代码结构, 基于现有代码, 逆向现有代码, 代码结构梳理, 读一下这个代码库, 理解这个代码库, brownfield]

  muse_loop_orchestrate:
    invoke: "/muse-loop-orchestrate"
    weight: 7
    # muse 专属（需求→原型自治 Loop 编排器）。触发短语全部为复合词，
    # 不含裸"需求"/"原型"单字——避免撞 brainstorm(需求)/html-prototype·design-brief·
    # magicpath·open-design(原型) 的现有词条。不缩写成"loop"，避免撞内置 loop 定时调度 skill。
    triggers: [muse loop, muse自进化循环, 需求到原型闭环, 跑一下muse loop]

  muse_req_triage:
    invoke: "/muse-req-triage"
    weight: 6
    # muse 专属。/brainstorm 一次只吃一个输入(md路径/单个话题字符串)，
    # 缺一道"批量候选需求先筛一遍再决定投入哪条"的便宜前置筛选——本条补这个缺口，
    # 不与 brainstorm/idea 竞争同一场景。复合触发短语，避免裸"需求"单字。
    triggers: [候选需求批量筛选, 需求清单先筛一遍, 一堆需求要不要做, 批量需求triage, 需求batch筛选]

  insight_synthesis:
    invoke: "/insight-synthesis"
    weight: 6
    # 一手定性综合：用户提供的访谈/工单/回访 → observation(原文引用)+interpretation(置信度)两层。
    # 研究段第三"对象角度"（内部一手）。与 idea 划界=忠实vs解读；与 muse-req-triage 靠意图消歧(筛/综合)。
    # 复合触发短语，避免裸"用户"单字（撞 ux-research）。
    triggers: [访谈综合, 访谈洞察, 工单综合, 定性综合, 一手资料提炼洞察, 把访谈变成洞察, 区分观察与解读, 亲和图]

  research_kit:
    invoke: "/research-kit"
    weight: 6
    # 一手研究工具设计（2026-07-21）：假设→采集工具（访谈提纲/问卷/测试计划/卡片分类法）。三不产：不产发现/不产解读/不采集。
    # 故意不收裸"访谈/问卷/可用性测试"——裸访谈与 insight_synthesis 复合词 substring 撞（等权 tie→MULTI）、裸词太泛。
    # "卡片分类"收窄为"卡片分类法/开放式卡片分类"——裸词兼是 UI 布局措辞（"列表按卡片分类展示"会误发）。
    triggers: [访谈提纲, 访谈脚本, 问卷设计, 可用性测试计划, 卡片分类法, 开放式卡片分类]

  ux_writing:
    invoke: "/ux-writing"
    weight: 6
    # 内容与语言设计（2026-07-21）：voice/tone 规范 + 微文案系统 + 界面文案评审改写。双相位：语义规范 pre-brief / 逐字评审 standalone。
    # 故意不收裸"文案/copy/tone"——通用词劫持无关 prompt（copy this file 类）。
    # 已知误触边："错误文案"在排障语境可能命中（"页面上错误文案显示 undefined"）——回归 prompt 已登记，误发率可接受（该语境多半也确是文案问题）。
    triggers: [微文案, 界面文案, UX文案, 空态文案, 错误文案, 文案规范]

# ── Built-in Claude Code skills (globally installed) ─────────────────────────
builtin_skills:

  web_access:
    skill: web-access
    hint: "→ 建议使用内置 skill: web-access（联网搜索/网页抓取）"
    weight: 9
    # 2026-07-13 fable review 遗留修复 + 同日复发修复：≤3 字裸动词短语必子串误撞复合词——
    # '搜索'撞"搜索功能"、'查一下'撞"审查一下/检查一下/排查一下"、'找找'撞"找找原因"（均实测）。
    # 一律意图锚定形；裸祈使（"查一下天气"）落 STOP 由语义契约兜底。
    triggers: [搜索一下, 帮我搜索, 网上搜, 帮我查一下, 上网, 联网, 网页, 抓取, 爬取, google, 搜一下, 查资料]

  agent_browser:
    skill: agent-browser
    hint: "→ 建议使用内置 skill: agent-browser（浏览器截图/交互）"
    # 2026-09-02 职责审计 7→9：本条的 `访问网页`/`打开网页` 内含 web_access(w9) 的 `网页`，
    # 而 shadow 规则只保护"短词属低权"方向 ⇒ 这两个词是死信，恒落 SINGLE web-access
    # （CLAUDE.md:352「看看竞品/截图 → agent-browser」与 appendix「侧栏交付面」以其 SINGLE 命中为前提）。
    # 升至同权后转 MULTI（安全歧义），符合本文件"never silently drop an equal-weight candidate"的既定意图。
    weight: 9
    # 2026-07-30 侧栏交付面：app 内嵌 session（mcp__muse__* 可见）下，"打开网页"类词若语义为
