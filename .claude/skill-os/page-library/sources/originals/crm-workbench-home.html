<!doctype html>
<!--
  纷享销客 CRM 应用壳层原型。
  基于 OpenDesign Web Prototype seed 的 token、reset、layout、button、card 与交互状态类扩展。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>纷享销客 · CRM 工作台</title>
  <style>
    :root {
      --bg: oklch(95.72% 0.0034 247.9);
      --surface: oklch(100% 0 90);
      --fg: oklch(22.65% 0.0186 266.2);
      --muted: oklch(66.94% 0.014 266.7);
      --border: oklch(90.95% 0.01 267.4);
      --accent: oklch(73.19% 0.1858 53);

      --accent-soft: color-mix(in oklch, var(--accent) 13%, transparent);
      --fg-soft: color-mix(in oklch, var(--fg) 6%, transparent);
      --font-display: Arial, Tahoma, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-body: Arial, Tahoma, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --fs-h1: clamp(44px, 6vw, 76px);
      --fs-h2: clamp(32px, 4vw, 48px);
      --fs-h3: 22px;
      --fs-lead: 19px;
      --fs-body: 16px;
      --fs-meta: 13px;
      --gap-xs: 8px;
      --gap-sm: 12px;
      --gap-md: 20px;
      --gap-lg: 32px;
      --gap-xl: 56px;
      --gap-2xl: 96px;
      --container: 1120px;
      --gutter: 32px;
      --radius: 8px;
      --radius-lg: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { height: 100%; -webkit-text-size-adjust: 100%; }
    body {
      min-width: 0;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.5;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    img, svg { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button, textarea, input { font: inherit; }
    button { cursor: pointer; }
    p { text-wrap: pretty; }
    h1, h2, h3, h4 { text-wrap: balance; }
    h1, h2, h3, h4 { font-family: var(--font-display); }
    button:focus-visible,
    a:focus-visible,
    textarea:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    [hidden] { display: none !important; }

    .container { max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter); }
    .section { padding-block: clamp(48px, 8vw, var(--gap-2xl)); }
    .section + .section { border-top: 1px solid var(--border); }
    .stack { display: flex; flex-direction: column; }
    .stack > * + * { margin-top: var(--gap-md); }
    .row { display: flex; align-items: center; gap: var(--gap-md); }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--gap-md); }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap-lg); }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap-lg); }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap-md); }
    .grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: var(--gap-xl); align-items: start; }
    .grid-1-2 { display: grid; grid-template-columns: 1fr 2fr; gap: var(--gap-xl); align-items: start; }
    .h1, h1 { font-size: var(--fs-h1); line-height: 1.04; letter-spacing: -0.02em; margin: 0; }
    .h2, h2 { font-size: var(--fs-h2); line-height: 1.1; letter-spacing: -0.015em; margin: 0; }
    .h3, h3 { font-size: var(--fs-h3); font-weight: 600; line-height: 1.3; margin: 0; }
    .lead { max-width: 60ch; margin: 0; color: var(--muted); font-size: var(--fs-lead); }
    .eyebrow { margin: 0 0 var(--gap-md); color: var(--accent); font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    .meta { color: var(--muted); font-family: var(--font-mono); font-size: var(--fs-meta); }
    .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .topnav { position: sticky; top: 0; z-index: 10; background: color-mix(in oklch, var(--bg) 92%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
    .topnav-inner { display: flex; align-items: center; justify-content: space-between; padding-block: 14px; }
    .topnav .logo { font-family: var(--font-display); font-size: 19px; font-weight: 600; }
    .topnav nav { display: flex; gap: var(--gap-lg); }
    .topnav nav a { color: var(--muted); font-size: 14px; }
    .topnav nav a:hover { color: var(--fg); }
    .pagefoot { padding-block: var(--gap-xl); color: var(--muted); font-size: 13px; border-top: 1px solid var(--border); }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border: 1px solid transparent; border-radius: var(--radius); font-size: 15px; font-weight: 500; transition: transform .05s ease, background .15s ease, border-color .15s ease; }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
    .btn-primary:hover { background: color-mix(in oklch, var(--accent) 88%, black); color: var(--surface); }
    .btn-secondary { background: transparent; color: var(--fg); border-color: var(--border); }
    .btn-secondary:hover { border-color: var(--fg); color: var(--fg); }
    .btn-ghost { background: transparent; color: var(--fg); border-color: transparent; padding-inline: 8px; }
    .btn-ghost:hover { background: var(--fg-soft); color: var(--fg); }
    .btn-arrow::after { content: "→"; transition: transform .15s ease; }
    .btn-arrow:hover::after { transform: translateX(2px); }
    .card { padding: 28px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
    .card-flat { padding: 0; background: transparent; border: 0; }
    .card-rule { padding: 24px 0 0; background: transparent; border: 0; border-top: 1px solid var(--fg); border-radius: 0; }
    .feature .feature-mark { display: grid; width: 36px; height: 36px; margin-bottom: var(--gap-md); place-items: center; color: var(--accent); border: 1px solid var(--border); border-radius: 10px; }
    .feature .feature-mark svg { width: 18px; height: 18px; }
    .feature h3 { margin-bottom: 6px; }
    .feature p { margin: 0; color: var(--muted); font-size: 15px; }
    .stat .stat-num { color: var(--accent); font-family: var(--font-display); font-size: clamp(56px, 8vw, 96px); font-weight: 600; line-height: .95; }
    .stat .stat-label { max-width: 24ch; margin-top: 8px; color: var(--muted); font-size: 14px; }
    .stat .stat-unit { margin-left: 2px; font-size: .5em; opacity: .7; }
    .quote { max-width: 28ch; font-family: var(--font-display); font-size: clamp(24px, 2.6vw, 32px); line-height: 1.32; }
    .quote-author { margin-top: var(--gap-md); color: var(--muted); font-size: 14px; }
    .quote-mark { margin-bottom: -28px; color: var(--accent); font-family: var(--font-display); font-size: 140px; line-height: .7; opacity: .18; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; color: var(--accent); background: var(--accent-soft); border-radius: 999px; font-family: var(--font-mono); font-size: 11px; }
    .tag { display: inline-flex; align-items: center; padding: 4px 10px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; font-size: 12px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { color: var(--muted); font-size: 13px; }
    .input, .textarea { width: 100%; padding: 11px 14px; color: var(--fg); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); font: inherit; font-size: 15px; }
    .input:focus, .textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
    .textarea { min-height: 96px; resize: vertical; }
    .ds-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .ds-table th, .ds-table td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); }
    .ds-table th { color: var(--muted); font-family: var(--font-mono); font-size: 12px; font-weight: 500; }
    .ds-table tbody tr:hover { background: var(--fg-soft); }
    .ds-table .num-col { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .ph-img { display: grid; aspect-ratio: 16 / 10; place-items: center; color: var(--muted); background: color-mix(in oklch, var(--surface) 88%, var(--accent-soft)); border: 1px solid var(--border); border-radius: var(--radius-lg); font-family: var(--font-mono); font-size: 12px; }
    .ph-img.square { aspect-ratio: 1; }
    .ph-img.portrait { aspect-ratio: 3 / 4; }
    .ph-img.wide { aspect-ratio: 16 / 9; }
    .rule { margin: 0; border: 0; border-top: 1px solid var(--border); }
    .rule-strong { margin: 0; border: 0; border-top: 1px solid var(--fg); }
    .hero { padding-block: clamp(80px, 12vw, 160px); }
    .hero-center { max-width: 32ch; margin-inline: auto; text-align: center; }
    .hero h1 { margin-bottom: var(--gap-md); }
    .hero .lead { margin-bottom: var(--gap-lg); }
    .hero-cta { display: inline-flex; flex-wrap: wrap; gap: var(--gap-sm); }
    .hero-center .hero-cta { justify-content: center; }
    .hero-split { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: var(--gap-2xl); }
    .log-row { display: grid; grid-template-columns: 120px 1fr 100px; align-items: baseline; gap: var(--gap-lg); padding: 22px 0; border-top: 1px solid var(--border); }
    .log-row .pull { text-align: right; }

    .svg-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .fx-svg { width: 1em; height: 1em; flex: 0 0 auto; overflow: visible; fill: currentColor; }
    .app-root { height: 100%; background: var(--bg); }
    .top-header {
      position: relative;
      z-index: 700;
      display: flex;
      height: 48px;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: var(--bg);
    }
    .enterprise { display: flex; min-width: 0; align-items: center; gap: 7px; }
    .enterprise-mark { display: grid; width: 21px; height: 21px; place-items: center; color: var(--accent); }
    .enterprise-mark img { width: 19px; height: 21px; object-fit: contain; }
    .enterprise-name { max-width: 360px; overflow: hidden; color: var(--fg); font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
    .top-tools { display: flex; min-width: 0; align-items: center; gap: 8px; }
    .global-search { display: flex; width: clamp(240px, 22vw, 330px); height: 28px; align-items: center; color: var(--muted); background: var(--surface); border-radius: 4px; }
    .search-scope { display: flex; height: 100%; align-items: center; gap: 4px; padding: 0 10px; color: var(--fg); border-right: 1px solid var(--border); font-size: 12px; }
    .global-search input { min-width: 0; height: 100%; flex: 1; padding: 0 8px; color: var(--fg); background: transparent; border: 0; outline: 0; font-size: 12px; }
    .global-search input::placeholder { color: var(--muted); }
    .global-search .fx-svg { width: 14px; height: 14px; margin-right: 8px; }
    .tool-button { display: grid; width: 30px; height: 30px; padding: 0; place-items: center; color: var(--fg); background: transparent; border: 0; border-radius: 5px; }
    .tool-button:hover { color: var(--fg); background: var(--fg-soft); }
    .tool-button .fx-svg { width: 18px; height: 18px; }
    .tool-button img { width: 18px; height: 18px; }
    .tool-divider { width: 1px; height: 18px; background: var(--border); }
    .agent-line { padding: 1px; background: linear-gradient(95.65deg, rgb(0, 153, 255) 19.61%, rgb(112, 145, 255) 41.16%, rgb(162, 116, 255) 48.59%, rgb(190, 100, 255)); border-radius: 6px; }
    .agent-trigger { display: flex; height: 26px; align-items: center; gap: 5px; padding: 3px 10px; color: rgb(84, 44, 184); background: var(--surface); border: 0; border-radius: 5px; font-size: 13px; line-height: 19px; }
    .agent-trigger:hover { color: rgb(84, 44, 184); background: color-mix(in oklch, var(--surface) 96%, var(--fg)); }
    .agent-trigger .fx-svg { width: 13px; height: 13px; }
    .avatar { width: 32px; height: 32px; overflow: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: 50%; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    .app-shell { display: grid; height: calc(100% - 48px); grid-template-columns: 64px 192px minmax(0, 1fr); }
    .global-rail { position: relative; z-index: 30; min-height: 0; background: var(--bg); }
    .global-nav { height: 100%; overflow: hidden auto; scrollbar-width: none; }
    .global-nav::-webkit-scrollbar { display: none; }
    .global-nav-list { display: flex; min-height: 100%; flex-direction: column; gap: 8px; margin: 0; padding: 12px 4px; list-style: none; }
    .global-nav-item { position: relative; display: flex; width: 56px; min-height: 52px; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 4px 2px; color: var(--fg); background: transparent; border: 0; border-radius: 6px; font-size: 11px; line-height: 15px; }
    .global-nav-item:hover { color: var(--fg); background: var(--fg-soft); }
    .global-nav-item.active { color: var(--accent); background: var(--surface); }
    .global-nav-item .fx-svg { width: 18px; height: 18px; }
    .global-nav-list > li:nth-child(-n + 7) .nav-icon-line { fill-rule: evenodd; clip-rule: evenodd; }
    .global-nav-item .nav-icon-fill { display: none; }
    .global-nav-item.active .nav-icon-line { display: none; }
    .global-nav-item.active .nav-icon-fill { display: block; }
    .nav-badge { position: absolute; top: 1px; left: 35px; min-width: 20px; padding: 0 4px; color: var(--surface); background: color-mix(in oklch, var(--accent) 78%, red); border: 1px solid var(--surface); border-radius: 9px; font-family: var(--font-mono); font-size: 9px; line-height: 14px; text-align: center; }
    .global-nav-spacer { flex: 1; }

    .crm-sidebar { display: flex; min-height: 0; flex-direction: column; overflow: hidden; background: var(--surface); border-radius: 8px; }
    .crm-header { flex: 0 0 auto; padding: 12px 12px 8px; }
    .crm-title-row { display: flex; height: 28px; align-items: center; justify-content: space-between; }
    .crm-title { display: flex; min-width: 0; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; }
    .crm-title .fx-svg { width: 10px; height: 10px; color: var(--muted); }
    .crm-search-row { display: grid; grid-template-columns: 1fr 28px; gap: 6px; margin-top: 8px; }
    .crm-search { display: flex; height: 28px; align-items: center; gap: 6px; padding: 0 8px; color: var(--muted); border: 1px solid var(--border); border-radius: 5px; }
    .crm-search .fx-svg { width: 13px; height: 13px; }
    .crm-search input { width: 100%; min-width: 0; padding: 0; color: var(--fg); background: transparent; border: 0; outline: 0; font-size: 12px; }
    .crm-search input::placeholder { color: var(--muted); }
    .add-menu { display: grid; width: 28px; height: 28px; padding: 0; place-items: center; color: var(--fg); background: var(--surface); border: 1px solid var(--border); border-radius: 5px; }
    .add-menu:hover { color: var(--fg); background: var(--fg-soft); border-color: var(--fg); }
    .add-menu .fx-svg { width: 14px; height: 14px; }
    .crm-menu { min-height: 0; flex: 1; overflow: hidden auto; padding: 0 6px 12px 12px; scrollbar-color: var(--border) transparent; scrollbar-width: thin; }
    .crm-menu-list { margin: 0; padding: 0; list-style: none; }
    .crm-menu-item { position: relative; display: flex; width: 100%; height: 36px; align-items: center; gap: 8px; padding: 0 10px 0 8px; overflow: hidden; color: var(--fg); background: transparent; border: 0; border-radius: 6px; font-size: 13px; text-align: left; }
    .crm-menu-item:hover { color: var(--fg); background: var(--fg-soft); }
    .crm-menu-item.active { color: var(--fg); background: color-mix(in oklch, var(--accent) 12%, var(--surface)); }
    .crm-menu-item .menu-icon { width: 16px; height: 16px; flex: 0 0 auto; }
    .crm-menu-item .menu-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .crm-menu-item .menu-count { margin-left: auto; color: color-mix(in oklch, var(--accent) 70%, red); font-family: var(--font-mono); font-size: 11px; }
    .menu-icon.home { color: var(--accent); }
    .menu-icon.todo { color: rgb(48, 199, 118); }
    .menu-icon.remind { color: var(--accent); }
    .menu-icon.flag { color: rgb(115, 65, 222); }
    .menu-icon.feedback { color: rgb(255, 74, 102); }
    .menu-icon.image { color: rgb(24, 157, 255); }
    .menu-icon.dependency { color: rgb(12, 108, 255); }
    .group-dot { display: grid; width: 16px; height: 16px; flex: 0 0 auto; place-items: center; color: var(--muted); }
    .group-dot svg { width: 16px; height: 16px; }
    .crm-collapse { display: flex; height: 28px; flex: 0 0 auto; align-items: center; justify-content: flex-end; padding: 0 12px; color: var(--muted); border-top: 1px solid var(--border); }
    .crm-collapse button { display: grid; width: 28px; height: 28px; padding: 0; place-items: center; color: inherit; background: transparent; border: 0; border-radius: 4px; }
    .crm-collapse button:hover { color: var(--fg); background: var(--fg-soft); }
    .crm-collapse .fx-svg { width: 14px; height: 14px; transform: rotate(90deg); }

    .workspace-column { min-width: 0; height: 100%; padding: 0 12px 12px 20px; transition: margin-right .22s ease; }
    .workspace-tabs { display: flex; height: 40px; align-items: center; padding: 0 14px; background: var(--surface); border-radius: 8px; }
    .workspace-tab { display: inline-flex; height: 28px; align-items: center; color: var(--accent); font-size: 13px; font-weight: 500; }
    .workspace-card { height: calc(100% - 52px); margin-top: 12px; padding: 0; background: var(--surface); border: 0; border-radius: 8px; }
    .app-root.agent-open .workspace-column { margin-right: 375px; }

    .agent-panel { position: fixed; top: 48px; right: 0; z-index: 650; display: flex; width: 375px; height: calc(100% - 48px); flex-direction: column; overflow: hidden; background: var(--surface); border-radius: 8px 0 0; transform: translateX(102%); transition: transform .22s ease; }
    .app-root.agent-open .agent-panel { transform: translateX(0); }
    .agent-panel.floating { top: 60px; right: 12px; height: calc(100% - 72px); border: 1px solid var(--border); border-radius: 10px; }
    .agent-header { display: flex; height: 48px; flex: 0 0 auto; align-items: center; justify-content: space-between; padding: 0 16px; }
    .agent-header-group { display: flex; align-items: center; gap: 8px; }
    .agent-icon-button { display: grid; width: 24px; height: 24px; padding: 0; place-items: center; color: var(--fg); background: transparent; border: 0; border-radius: 5px; }
    .agent-icon-button:hover { color: var(--fg); background: var(--fg-soft); }
    .agent-icon-button .fx-svg { width: 16px; height: 16px; }
    .agent-popout-svg { width: 16px; height: 16px; fill: currentColor; }
    .agent-main { position: relative; min-height: 0; flex: 1; overflow: hidden; background: var(--surface); }
    .agent-guidance { position: absolute; inset: 0; overflow: auto; padding: 58px 16px 148px; scrollbar-width: thin; }
    .agent-hero { display: flex; flex-direction: column; align-items: center; }
    .robot { position: relative; width: 122px; height: 122px; }
    .robot img { position: absolute; inset: 0; width: 122px; height: 122px; }
    .robot .robot-hand { transform-origin: 67% 50%; animation: agent-wave 3.2s ease-in-out infinite; }
    @keyframes agent-wave { 0%, 76%, 100% { transform: rotate(0deg); } 82% { transform: rotate(4deg); } 88% { transform: rotate(-3deg); } 94% { transform: rotate(2deg); } }
    .welcome-title { margin-top: 8px; color: transparent; background: linear-gradient(90deg, rgb(24, 28, 37) 56.09%, rgb(150, 118, 255) 64.21%, rgb(190, 100, 254) 70.31%, rgb(225, 87, 203) 75.78%, rgb(239, 87, 148) 82.32%, rgb(253, 104, 63) 89.34%, rgb(254, 124, 43) 95.27%, rgb(255, 161, 11) 100.03%); background-clip: text; -webkit-background-clip: text; font-family: var(--font-display); font-size: 22px; font-weight: 400; line-height: 30px; white-space: nowrap; }
    .agent-quick-actions { display: grid; width: 100%; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 32px; }
    .agent-quick { display: flex; min-width: 0; height: 36px; align-items: center; justify-content: center; gap: 8px; padding: 0 10px; overflow: hidden; color: var(--fg); background: transparent; border: 1px solid var(--border); border-radius: 30px; font-size: 13px; white-space: nowrap; }
    .agent-quick:hover { color: var(--fg); background: var(--fg-soft); border-color: color-mix(in oklch, var(--border) 55%, var(--fg)); }
    .agent-quick .fx-svg { width: 16px; height: 16px; }
    .agent-quick.sales .fx-svg { color: rgb(12, 108, 255); }
    .agent-quick.onsite .fx-svg { color: rgb(48, 199, 118); }
    .agent-quick.online .fx-svg { color: rgb(150, 118, 255); }
    .continue-chat { display: flex; height: 30px; align-items: center; gap: 3px; margin-top: 8px; padding: 0 6px; color: var(--muted); background: transparent; border: 0; border-radius: 5px; font-size: 13px; }
    .continue-chat:hover { color: var(--fg); background: var(--fg-soft); }
    .continue-chat .fx-svg { width: 12px; height: 12px; }
    .chat-log { display: flex; flex-direction: column; gap: 14px; padding: 14px 0 0; }
    .chat-bubble { max-width: 86%; padding: 10px 12px; color: var(--fg); background: var(--fg-soft); border-radius: 12px 12px 12px 3px; font-size: 13px; line-height: 1.55; }
    .chat-bubble.user { align-self: flex-end; color: var(--surface); background: var(--fg); border-radius: 12px 12px 3px 12px; }
    .chat-bubble.assistant { align-self: flex-start; }

    .session-drawer { position: absolute; inset: 0 auto 0 0; z-index: 8; width: 286px; padding: 16px; background: var(--surface); border-right: 1px solid var(--border); transform: translateX(-102%); transition: transform .2s ease; }
    .session-drawer.open { transform: translateX(0); }
    .session-header { display: flex; height: 32px; align-items: center; justify-content: space-between; font-weight: 600; }
    .session-list { display: flex; flex-direction: column; gap: 4px; margin: 14px 0 0; padding: 0; list-style: none; }
    .session-row { display: flex; align-items: center; gap: 4px; }
    .session-item { min-width: 0; min-height: 44px; flex: 1; padding: 7px 10px; color: var(--fg); background: transparent; border: 0; border-radius: 6px; font-size: 13px; text-align: left; }
    .session-item:hover { color: var(--fg); background: var(--fg-soft); }
    .session-item.active { background: var(--accent-soft); }
    .session-title, .session-time { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .session-time { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .session-delete { display: grid; width: 28px; height: 28px; flex: 0 0 auto; padding: 0; place-items: center; color: var(--muted); background: transparent; border: 0; border-radius: 5px; }
    .session-delete:hover { color: var(--fg); background: var(--fg-soft); }
    .session-delete .fx-svg { width: 13px; height: 13px; }
    .session-empty { padding: 12px 10px; color: var(--muted); font-size: 12px; }

    .composer { position: absolute; right: 12px; bottom: 12px; left: 12px; z-index: 6; height: 118px; padding: 12px; background: var(--surface); border: 1px solid transparent; border-radius: 16px; box-shadow: color-mix(in oklch, var(--fg) 2%, transparent) 0 2px 4px, color-mix(in oklch, var(--fg) 4%, transparent) 0 4px 16px, color-mix(in oklch, var(--fg) 8%, transparent) 0 8px 32px; }
    .composer textarea { display: block; width: 100%; height: 48px; padding: 0; resize: none; color: var(--fg); background: transparent; border: 0; outline: 0; font-size: 14px; line-height: 22px; }
    .composer textarea::placeholder { color: var(--muted); }
    .composer-toolbar { display: flex; height: 44px; align-items: center; justify-content: space-between; }
    .composer-left, .composer-right { display: flex; align-items: center; gap: 3px; }
    .composer-control { display: flex; height: 32px; align-items: center; gap: 5px; padding: 0 6px; color: var(--fg); background: transparent; border: 0; border-radius: 6px; font-size: 12px; }
    .composer-control:hover { color: var(--fg); background: var(--fg-soft); }
    .composer-control .fx-svg { width: 16px; height: 16px; }
    .composer-control .arrow { width: 10px; height: 10px; color: var(--muted); }
    .deepseek-logo { width: 16px; height: 16px; object-fit: contain; }
    .model-label { display: block; max-width: 102px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .composer-separator { width: 1px; height: 14px; background: var(--border); }
    .send-button { display: grid; width: 32px; height: 32px; padding: 0; place-items: center; color: var(--surface); background: linear-gradient(135deg, rgb(150, 118, 255), rgb(190, 100, 254)); border: 0; border-radius: 50%; }
    .send-button:hover:not(:disabled) { color: var(--surface); filter: brightness(.92); }
    .send-button:disabled { cursor: default; opacity: .25; }
    .send-button .fx-svg { width: 17px; height: 17px; transform: rotate(-90deg); }
    .model-menu { position: absolute; bottom: 58px; left: 48px; z-index: 10; width: 200px; padding: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: color-mix(in oklch, var(--fg) 12%, transparent) 0 8px 24px; }
    .model-option { display: flex; width: 100%; height: 36px; align-items: center; gap: 8px; padding: 0 8px; color: var(--fg); background: transparent; border: 0; border-radius: 5px; font-size: 12px; text-align: left; }
    .model-option:hover { color: var(--fg); background: var(--fg-soft); }
    .model-option.active { background: var(--accent-soft); }
    .data-popover { position: fixed; z-index: 850; width: 180px; padding: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: color-mix(in oklch, var(--fg) 10%, transparent) 0 8px 24px; }
    .data-action { display: flex; width: 100%; height: 36px; align-items: center; gap: 8px; padding: 0 10px; color: var(--fg); background: transparent; border: 0; border-radius: 5px; font-size: 12px; text-align: left; }
    .data-action:hover { color: var(--fg); background: var(--fg-soft); }
    .data-action .fx-svg { width: 15px; height: 15px; color: var(--muted); }
    .data-popover-rule { height: 1px; margin: 5px 4px; background: var(--border); }

    .dialog-backdrop { position: fixed; inset: 0; z-index: 950; display: grid; padding: 16px; place-items: center; background: color-mix(in oklch, var(--fg) 34%, transparent); }
    .fx-dialog-shell { width: min(480px, calc(100vw - 32px)); max-height: min(680px, calc(100vh - 32px)); overflow: hidden auto; background: var(--surface); border-radius: 8px; box-shadow: color-mix(in oklch, var(--fg) 18%, transparent) 0 6px 24px; }
    .fx-dialog-header { display: flex; height: 48px; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--border); }
    .fx-dialog-header h2 { margin: 0; font-size: 15px; font-weight: 600; }
    .fx-dialog-close { display: grid; width: 28px; height: 28px; padding: 0; place-items: center; color: var(--muted); background: transparent; border: 0; border-radius: 5px; }
    .fx-dialog-close:hover { color: var(--fg); background: var(--fg-soft); }
    .fx-dialog-close .fx-svg { width: 14px; height: 14px; }
    .fx-dialog-body { padding: 20px 24px 16px; }
    .fx-form-field + .fx-form-field { margin-top: 16px; }
    .fx-fieldset { margin-inline: 0; padding: 0; border: 0; }
    .fx-form-label { display: block; margin-bottom: 6px; color: var(--fg); font-size: 13px; }
    .required-mark { margin-left: 2px; color: color-mix(in oklch, var(--accent) 72%, red); }
    .fx-input-shell input { width: 100%; height: 32px; padding: 0 10px; color: var(--fg); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; outline: 0; font-size: 13px; }
    .fx-input-shell input:hover { border-color: color-mix(in oklch, var(--border) 50%, var(--fg)); }
    .fx-input-shell input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .icon-choice-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .icon-option { position: relative; display: block; }
    .icon-option input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .icon-preview { display: grid; width: 44px; height: 36px; place-items: center; color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
    .icon-preview .fx-svg { width: 17px; height: 17px; }
    .icon-option input:checked + .icon-preview { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); }
    .icon-option input:focus-visible + .icon-preview { outline: 2px solid var(--accent); outline-offset: 2px; }
    .menu-manager { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
    .menu-manager-title { margin-bottom: 8px; color: var(--muted); font-size: 12px; }
    .custom-menu-list { display: flex; max-height: 152px; flex-direction: column; gap: 4px; margin: 0; padding: 0; overflow: auto; list-style: none; }
    .custom-menu-row { display: flex; min-height: 36px; align-items: center; gap: 8px; padding: 0 8px; background: var(--fg-soft); border-radius: 6px; }
    .custom-menu-row .fx-svg { width: 15px; height: 15px; color: var(--muted); }
    .custom-menu-name { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .custom-menu-delete { height: 28px; padding: 0 6px; color: color-mix(in oklch, var(--accent) 70%, red); background: transparent; border: 0; border-radius: 4px; font-size: 12px; }
    .custom-menu-delete:hover { color: var(--surface); background: color-mix(in oklch, var(--accent) 70%, red); }
    .custom-menu-empty { padding: 8px 0; color: var(--muted); font-size: 12px; }
    .fx-dialog-footer { display: flex; height: 56px; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 16px; border-top: 1px solid var(--border); }
    .fx-btn { display: inline-flex; min-width: 64px; height: 28px; align-items: center; justify-content: center; padding: 0 12px; color: var(--fg); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
    .fx-btn:hover { color: var(--fg); background: var(--fg-soft); border-color: color-mix(in oklch, var(--border) 45%, var(--fg)); }
    .fx-btn-primary { color: var(--surface); background: var(--accent); border-color: var(--accent); }
    .fx-btn-primary:hover { color: var(--surface); background: color-mix(in oklch, var(--accent) 88%, black); border-color: color-mix(in oklch, var(--accent) 88%, black); }
    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 1000; max-width: 320px; padding: 10px 14px; color: var(--surface); background: var(--fg); border-radius: 8px; box-shadow: color-mix(in oklch, var(--fg) 18%, transparent) 0 8px 24px; font-size: 13px; opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity .16s ease, transform .16s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 1180px) {
      .global-search { width: 220px; }
      .top-tools .optional-tool { display: none; }
      .app-root.agent-open .workspace-column { margin-right: 0; }
    }
    @media (max-width: 920px) {
      body { overflow: auto; }
      .grid-2, .grid-3, .grid-4, .grid-2-1, .grid-1-2, .hero-split { grid-template-columns: 1fr; }
      .top-header { position: sticky; top: 0; }
      .enterprise-name { max-width: 180px; }
      .global-search, .top-tools .tool-divider, .top-tools .optional-tool { display: none; }
      .tool-button { width: 44px; height: 44px; }
      .app-shell { min-height: calc(100vh - 48px); grid-template-columns: 56px minmax(0, 1fr); }
      .global-nav-item { width: 48px; min-height: 52px; }
      .crm-sidebar { display: none; }
      .workspace-column { grid-column: 2; padding: 0 8px 8px; }
      .agent-panel { width: min(100%, 375px); }
      .agent-icon-button { width: 44px; height: 44px; }
      .welcome-title { font-size: 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

  <script>
    (() => {
      const STORAGE_KEY = "fx-crm-prototype-state-v1";
      const EXPORT_SCHEMA = "fxiaoke-crm-prototype";
      const STATE_VERSION = 1;
      const DEFAULT_MODEL = "Deepseek-V4-Flash";
      const ALLOWED_MODELS = ["Deepseek-V4-Flash", "通用智能模型"];
      const ALLOWED_ICONS = ["home", "todo", "flag", "dependency"];

      const appRoot = document.getElementById("appRoot");
      const panel = document.getElementById("agentPanel");
      const openAgent = document.getElementById("openAgent");
      const railAgent = document.getElementById("railAgent");
      const closeAgent = document.getElementById("closeAgent");
      const agentMenu = document.getElementById("agentMenu");
      const sessionDrawer = document.getElementById("sessionDrawer");
      const sessionList = document.getElementById("sessionList");
      const closeSessions = document.getElementById("closeSessions");
      const popoutAgent = document.getElementById("popoutAgent");
      const newConversation = document.getElementById("newConversation");
      const continueChat = document.getElementById("continueChat");
      const agentHero = document.getElementById("agentHero");
      const agentGuidance = document.getElementById("agentGuidance");
      const chatLog = document.getElementById("chatLog");
      const composer = document.getElementById("composer");
      const input = document.getElementById("agentInput");
      const sendMessage = document.getElementById("sendMessage");
      const modelSelector = document.getElementById("modelSelector");
      const modelMenu = document.getElementById("modelMenu");
      const agentAttachment = document.getElementById("agentAttachment");
      const agentVoice = document.getElementById("agentVoice");
      const activeTab = document.getElementById("activeTab");
      const workspaceCard = document.getElementById("workspaceCard");
      const crmMenuList = document.getElementById("crmMenuList");
      const crmSearch = document.getElementById("crmSearch");
      const addMenu = document.getElementById("addMenu");
      const menuDialog = document.getElementById("menuDialog");
      const menuConfigForm = document.getElementById("menuConfigForm");
      const menuName = document.getElementById("menuName");
      const closeMenuDialogButton = document.getElementById("closeMenuDialog");
      const cancelMenuDialog = document.getElementById("cancelMenuDialog");
      const customMenuList = document.getElementById("customMenuList");
      const dataMenuButton = document.getElementById("dataMenuButton");
      const dataPopover = document.getElementById("dataPopover");
      const exportDataButton = document.getElementById("exportData");
      const importDataButton = document.getElementById("importData");
      const importDataFile = document.getElementById("importDataFile");
      const downloadHtmlButton = document.getElementById("downloadHtml");
      const toast = document.getElementById("toast");
      let toastTimer;
      let dialogReturnFocus = null;

      function createId(prefix) {
        const id = window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
        return prefix + "-" + id;
      }

      function safeString(value, maxLength) {
        return typeof value === "string" ? value.trim().slice(0, maxLength) : "";
      }

      function safeDate(value) {
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? new Date().toISOString() : date.toISOString();
      }

      function defaultState() {
        return {
          version: STATE_VERSION,
          customMenus: [],
          activeMenu: "首页",
          agent: {
            model: DEFAULT_MODEL,
            activeSessionId: null,
            sessions: [],
            panelOpen: false,
            floating: false
          }
        };
      }

      function sanitizeState(source) {
        const clean = defaultState();
        if (!source || typeof source !== "object") return clean;
        const seenNames = new Set();
        const seenIds = new Set();
        if (Array.isArray(source.customMenus)) {
          source.customMenus.slice(0, 30).forEach((item) => {
            if (!item || typeof item !== "object") return;
            const name = safeString(item.name, 20);
            let id = safeString(item.id, 72).replace(/[^a-zA-Z0-9_-]/g, "");
            if (!id) id = createId("menu");
            if (!name || seenNames.has(name) || seenIds.has(id)) return;
            seenNames.add(name);
            seenIds.add(id);
            clean.customMenus.push({
              id,
              name,
              icon: ALLOWED_ICONS.includes(item.icon) ? item.icon : "home"
            });
          });
        }
        clean.activeMenu = safeString(source.activeMenu, 40) || "首页";
        const rawAgent = source.agent && typeof source.agent === "object" ? source.agent : {};
        clean.agent.model = ALLOWED_MODELS.includes(rawAgent.model) ? rawAgent.model : DEFAULT_MODEL;
        clean.agent.panelOpen = Boolean(rawAgent.panelOpen);
        clean.agent.floating = Boolean(rawAgent.floating);
        if (Array.isArray(rawAgent.sessions)) {
          rawAgent.sessions.slice(0, 50).forEach((item) => {
            if (!item || typeof item !== "object") return;
            const messages = Array.isArray(item.messages) ? item.messages.slice(0, 200).map((message) => {
              if (!message || typeof message !== "object") return null;
              const role = message.role === "assistant" ? "assistant" : message.role === "user" ? "user" : "";
              const text = safeString(message.text, 4000);
              return role && text ? { role, text, time: safeDate(message.time) } : null;
            }).filter(Boolean) : [];
            if (!messages.length) return;
            const id = safeString(item.id, 72).replace(/[^a-zA-Z0-9_-]/g, "") || createId("session");
            clean.agent.sessions.push({
              id,
              title: safeString(item.title, 36) || "新会话",
              createdAt: safeDate(item.createdAt),
              updatedAt: safeDate(item.updatedAt),
              messages
            });
          });
        }
        const requestedSession = safeString(rawAgent.activeSessionId, 72);
        clean.agent.activeSessionId = clean.agent.sessions.some((session) => session.id === requestedSession) ? requestedSession : null;
        return clean;
      }

      function loadState() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored) return sanitizeState(JSON.parse(stored));
        } catch (error) {
          console.warn("无法读取本机原型数据", error);
        }
        const clean = defaultState();
        try {
          clean.agent.panelOpen = localStorage.getItem("fx-agent-panel-open") === "1";
        } catch (error) {
          console.warn("无法读取旧版面板状态", error);
        }
        return clean;
      }

      let state = loadState();

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
      }

      function saveState(reportError = false) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          return true;
        } catch (error) {
          console.warn("无法保存本机原型数据", error);
          if (reportError) showToast("保存失败：浏览器存储空间不足");
          return false;
        }
      }

      function makeSvg(icon, className) {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("class", className || "fx-svg");
        svg.setAttribute("aria-hidden", "true");
        const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
        use.setAttribute("href", "#fx-" + icon);
        svg.appendChild(use);
        return svg;
      }

      function getMenuButtons() {
        return Array.from(crmMenuList.querySelectorAll(".crm-menu-item"));
      }

      function applyMenuSearch() {
        const query = crmSearch.value.trim().toLowerCase();
        Array.from(crmMenuList.children).forEach((row) => {
          row.hidden = Boolean(query) && !row.textContent.trim().toLowerCase().includes(query);
        });
      }

      function selectMenu(name, persist = true) {
        const buttons = getMenuButtons();
        const target = buttons.find((button) => button.dataset.menu === name) || buttons[0];
        if (!target) return;
        buttons.forEach((button) => button.classList.toggle("active", button === target));
        state.activeMenu = target.dataset.menu;
        activeTab.textContent = state.activeMenu;
        workspaceCard.setAttribute("aria-label", state.activeMenu + "菜单内容承载区域");
        if (persist) saveState();
      }

      function renderCustomMenuManager() {
        customMenuList.replaceChildren();
        if (!state.customMenus.length) {
          const empty = document.createElement("li");
          empty.className = "custom-menu-empty";
          empty.textContent = "暂无自定义菜单";
          customMenuList.appendChild(empty);
          return;
        }
        state.customMenus.forEach((menu) => {
          const row = document.createElement("li");
          row.className = "custom-menu-row";
          row.appendChild(makeSvg(menu.icon));
          const name = document.createElement("span");
          name.className = "custom-menu-name";
          name.textContent = menu.name;
          row.appendChild(name);
          const remove = document.createElement("button");
          remove.className = "custom-menu-delete";
          remove.type = "button";
          remove.dataset.deleteMenu = menu.id;
          remove.textContent = "删除";
          remove.setAttribute("aria-label", "删除菜单" + menu.name);
          row.appendChild(remove);
          customMenuList.appendChild(row);
        });
      }

      function renderCustomMenus() {
        crmMenuList.querySelectorAll("[data-custom-row]").forEach((row) => row.remove());
        state.customMenus.forEach((menu) => {
          const row = document.createElement("li");
          row.dataset.customRow = menu.id;
          const button = document.createElement("button");
          button.className = "crm-menu-item";
          button.type = "button";
          button.dataset.menu = menu.name;
          button.dataset.customId = menu.id;
          button.setAttribute("data-od-id", "crm-custom-" + menu.id);
          button.appendChild(makeSvg(menu.icon, "fx-svg menu-icon custom"));
          const text = document.createElement("span");
          text.className = "menu-text";
          text.textContent = menu.name;
          button.appendChild(text);
          row.appendChild(button);
          crmMenuList.appendChild(row);
        });
        renderCustomMenuManager();
        selectMenu(state.activeMenu, false);
        applyMenuSearch();
      }

      function openMenuConfig() {
        closeDataPopover();
        dialogReturnFocus = document.activeElement;
        menuConfigForm.reset();
        renderCustomMenuManager();
        menuDialog.hidden = false;
        setTimeout(() => menuName.focus(), 0);
      }

      function closeMenuConfig(returnFocus = true) {
        menuDialog.hidden = true;
        if (returnFocus && dialogReturnFocus && typeof dialogReturnFocus.focus === "function") dialogReturnFocus.focus();
      }

      function setAgent(open, returnFocus = false, persist = true) {
        appRoot.classList.toggle("agent-open", open);
        panel.setAttribute("aria-hidden", String(!open));
        panel.inert = !open;
        openAgent.setAttribute("aria-expanded", String(open));
        state.agent.panelOpen = open;
        if (persist) saveState();
        if (open) setTimeout(() => input.focus(), 230);
        if (!open) {
          closeSessionDrawer();
          modelMenu.hidden = true;
          modelSelector.setAttribute("aria-expanded", "false");
          if (returnFocus) openAgent.focus();
        }
      }

      function openSessionDrawer() {
        renderSessionList();
        sessionDrawer.classList.add("open");
        sessionDrawer.setAttribute("aria-hidden", "false");
        agentMenu.setAttribute("aria-expanded", "true");
      }

      function closeSessionDrawer() {
        sessionDrawer.classList.remove("open");
        sessionDrawer.setAttribute("aria-hidden", "true");
        agentMenu.setAttribute("aria-expanded", "false");
      }

      function getActiveSession() {
        return state.agent.sessions.find((session) => session.id === state.agent.activeSessionId) || null;
      }

      function getLatestSession() {
        return state.agent.sessions.slice().sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt))[0] || null;
      }

      function formatSessionTime(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        const today = new Date();
        const sameDay = date.toDateString() === today.toDateString();
        return new Intl.DateTimeFormat("zh-CN", sameDay ? { hour: "2-digit", minute: "2-digit" } : { month: "2-digit", day: "2-digit" }).format(date);
      }

      function renderSessionList() {
        sessionList.replaceChildren();
        const sessions = state.agent.sessions.slice().sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
        if (!sessions.length) {
          const empty = document.createElement("li");
          empty.className = "session-empty";
          empty.textContent = "暂无会话";
          sessionList.appendChild(empty);
        } else {
          sessions.forEach((session) => {
            const row = document.createElement("li");
            row.className = "session-row";
            const choose = document.createElement("button");
            choose.type = "button";
            choose.className = "session-item" + (session.id === state.agent.activeSessionId ? " active" : "");
            choose.dataset.sessionId = session.id;
            choose.setAttribute("data-od-id", "agent-session-" + session.id);
            const title = document.createElement("span");
            title.className = "session-title";
            title.textContent = session.title;
            const time = document.createElement("span");
            time.className = "session-time";
            time.textContent = formatSessionTime(session.updatedAt);
            choose.append(title, time);
            const remove = document.createElement("button");
            remove.type = "button";
            remove.className = "session-delete";
            remove.dataset.deleteSession = session.id;
            remove.setAttribute("aria-label", "删除会话" + session.title);
            remove.appendChild(makeSvg("close"));
            row.append(choose, remove);
            sessionList.appendChild(row);
          });
        }
        continueChat.hidden = !sessions.length;
      }

      function addBubble(message) {
        const bubble = document.createElement("div");
        bubble.className = "chat-bubble " + message.role;
        bubble.textContent = message.text;
        chatLog.appendChild(bubble);
      }

      function renderConversation() {
        chatLog.replaceChildren();
        const session = getActiveSession();
        agentHero.hidden = Boolean(session);
        if (session) session.messages.forEach(addBubble);
        sendMessage.disabled = !input.value.trim();
        requestAnimationFrame(() => {
          agentGuidance.scrollTop = agentGuidance.scrollHeight;
        });
      }

      function startNewConversation() {
        state.agent.activeSessionId = null;
        input.value = "";
        saveState();
        renderConversation();
        renderSessionList();
        closeSessionDrawer();
        input.focus();
      }

      function activateSession(id) {
        if (!state.agent.sessions.some((session) => session.id === id)) return;
        state.agent.activeSessionId = id;
        saveState();
        renderConversation();
        renderSessionList();
        closeSessionDrawer();
        input.focus();
      }

      function resumeLatestConversation() {
        const session = getActiveSession() || getLatestSession();
        if (!session) {
          showToast("暂无可继续的会话");
          return;
        }
        activateSession(session.id);
      }

      function titleFromMessage(message) {
        return message.length > 18 ? message.slice(0, 18) + "…" : message;
      }

      function sendAgentMessage(text) {
        const message = safeString(text, 4000);
        if (!message) return;
        let session = getActiveSession();
        const now = new Date().toISOString();
        if (!session) {
          session = {
            id: createId("session"),
            title: titleFromMessage(message),
            createdAt: now,
            updatedAt: now,
            messages: []
          };
          state.agent.sessions.push(session);
          state.agent.activeSessionId = session.id;
        }
        session.messages.push({ role: "user", text: message, time: now });
        session.updatedAt = now;
        input.value = "";
        saveState(true);
        renderConversation();
        renderSessionList();
        const sessionId = session.id;
        setTimeout(() => {
          const target = state.agent.sessions.find((item) => item.id === sessionId);
          if (!target) return;
          const replyTime = new Date().toISOString();
          target.messages.push({
            role: "assistant",
            text: "这是本地原型回复：消息已保存到当前会话。接入真实 Agent 服务后，可在这里返回业务结果。",
            time: replyTime
          });
          target.updatedAt = replyTime;
          saveState();
          renderSessionList();
          if (state.agent.activeSessionId === sessionId) renderConversation();
        }, 420);
      }

      function applyAgentState() {
        document.querySelectorAll(".model-option").forEach((option) => option.classList.toggle("active", option.dataset.model === state.agent.model));
        modelSelector.querySelector(".model-label").textContent = state.agent.model;
        panel.classList.toggle("floating", state.agent.floating);
        popoutAgent.setAttribute("aria-pressed", String(state.agent.floating));
        popoutAgent.title = state.agent.floating ? "贴靠侧边" : "小窗展示";
        setAgent(state.agent.panelOpen, false, false);
        renderSessionList();
        renderConversation();
      }

      function openDataPopover() {
        const rect = dataMenuButton.getBoundingClientRect();
        dataPopover.style.top = Math.round(rect.bottom + 6) + "px";
        dataPopover.style.left = Math.round(Math.min(window.innerWidth - 188, Math.max(8, rect.right - 180))) + "px";
        dataPopover.hidden = false;
        dataMenuButton.setAttribute("aria-expanded", "true");
      }

      function closeDataPopover() {
        dataPopover.hidden = true;
        dataMenuButton.setAttribute("aria-expanded", "false");
      }

      function downloadBlob(content, type, filename) {
        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
      }

      function exportPrototypeData() {
        const payload = {
          schema: EXPORT_SCHEMA,
          version: STATE_VERSION,
          exportedAt: new Date().toISOString(),
          data: state
        };
        const date = new Date().toISOString().slice(0, 10);
        downloadBlob(JSON.stringify(payload, null, 2), "application/json;charset=utf-8", "fxiaoke-crm-data-" + date + ".json");
        closeDataPopover();
        showToast("原型数据已导出");
      }

      async function importPrototypeData(file) {
        try {
          const parsed = JSON.parse(await file.text());
          if (!parsed || parsed.schema !== EXPORT_SCHEMA || Number(parsed.version) !== STATE_VERSION || !parsed.data) throw new Error("invalid");
          state = sanitizeState(parsed.data);
          saveState(true);
          renderCustomMenus();
          applyAgentState();
          closeDataPopover();
          showToast("原型数据已导入");
        } catch (error) {
          console.warn("原型数据导入失败", error);
          showToast("导入失败：请选择本原型导出的 JSON 文件");
        } finally {
          importDataFile.value = "";
        }
      }

      async function downloadCurrentHtml() {
        closeDataPopover();
        try {
          let html;
          if (location.protocol === "http:" || location.protocol === "https:") {
            const response = await fetch(location.href, { cache: "no-store" });
            if (!response.ok) throw new Error("download");
            html = await response.text();
          } else {
            html = "<!doctype html>\n" + document.documentElement.outerHTML;
          }
          downloadBlob(html, "text/html;charset=utf-8", "fxiaoke-crm-shell.html");
          showToast("单文件 HTML 已下载");
        } catch (error) {
          console.warn("HTML 下载失败", error);
          showToast("HTML 下载失败，请重试");
        }
      }

      openAgent.addEventListener("click", () => setAgent(!appRoot.classList.contains("agent-open")));
      railAgent.addEventListener("click", () => setAgent(true));
      closeAgent.addEventListener("click", () => setAgent(false, true));
      agentMenu.addEventListener("click", () => sessionDrawer.classList.contains("open") ? closeSessionDrawer() : openSessionDrawer());
      closeSessions.addEventListener("click", closeSessionDrawer);
      newConversation.addEventListener("click", startNewConversation);
      continueChat.addEventListener("click", resumeLatestConversation);
      popoutAgent.addEventListener("click", () => {
        state.agent.floating = !state.agent.floating;
        panel.classList.toggle("floating", state.agent.floating);
        popoutAgent.setAttribute("aria-pressed", String(state.agent.floating));
        popoutAgent.title = state.agent.floating ? "贴靠侧边" : "小窗展示";
        saveState();
      });

      sessionList.addEventListener("click", (event) => {
        const remove = event.target.closest("[data-delete-session]");
        if (remove) {
          const session = state.agent.sessions.find((item) => item.id === remove.dataset.deleteSession);
          if (!session || !confirm("确定删除会话“" + session.title + "”吗？")) return;
          state.agent.sessions = state.agent.sessions.filter((item) => item.id !== session.id);
          if (state.agent.activeSessionId === session.id) state.agent.activeSessionId = null;
          saveState();
          renderSessionList();
          renderConversation();
          showToast("会话已删除");
          return;
        }
        const choose = event.target.closest("[data-session-id]");
        if (choose) activateSession(choose.dataset.sessionId);
      });

      document.querySelectorAll(".agent-quick").forEach((button) => {
        button.addEventListener("click", () => sendAgentMessage(button.dataset.prompt));
      });

      input.addEventListener("input", () => {
        sendMessage.disabled = !input.value.trim();
      });
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
          event.preventDefault();
          composer.requestSubmit();
        }
      });
      composer.addEventListener("submit", (event) => {
        event.preventDefault();
        sendAgentMessage(input.value);
      });
      agentAttachment.addEventListener("click", () => showToast("附件能力可在接入 Agent 服务后启用"));
      agentVoice.addEventListener("click", () => showToast("语音能力可在接入 Agent 服务后启用"));

      modelSelector.addEventListener("click", (event) => {
        event.stopPropagation();
        modelMenu.hidden = !modelMenu.hidden;
        modelSelector.setAttribute("aria-expanded", String(!modelMenu.hidden));
      });
      modelMenu.addEventListener("click", (event) => {
        const option = event.target.closest("[data-model]");
        if (!option) return;
        state.agent.model = option.dataset.model;
        document.querySelectorAll(".model-option").forEach((item) => item.classList.toggle("active", item === option));
        modelSelector.querySelector(".model-label").textContent = state.agent.model;
        modelMenu.hidden = true;
        modelSelector.setAttribute("aria-expanded", "false");
        saveState();
        showToast("已切换至" + state.agent.model);
      });

      crmMenuList.addEventListener("click", (event) => {
        const item = event.target.closest(".crm-menu-item");
        if (item) selectMenu(item.dataset.menu);
      });
      crmSearch.addEventListener("input", applyMenuSearch);
      addMenu.addEventListener("click", openMenuConfig);
      closeMenuDialogButton.addEventListener("click", () => closeMenuConfig());
      cancelMenuDialog.addEventListener("click", () => closeMenuConfig());
      menuDialog.addEventListener("click", (event) => {
        if (event.target === menuDialog) closeMenuConfig();
      });
      menuConfigForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const name = safeString(menuName.value, 20);
        const iconInput = menuConfigForm.querySelector('input[name="menuIcon"]:checked');
        if (!name) {
          menuName.focus();
          showToast("请输入菜单名称");
          return;
        }
        if (getMenuButtons().some((button) => button.dataset.menu === name)) {
          menuName.focus();
          showToast("菜单名称已存在");
          return;
        }
        const menu = { id: createId("menu"), name, icon: iconInput ? iconInput.value : "home" };
        state.customMenus.push(menu);
        state.activeMenu = menu.name;
        saveState(true);
        renderCustomMenus();
        closeMenuConfig();
        showToast("菜单已添加");
      });
      customMenuList.addEventListener("click", (event) => {
        const remove = event.target.closest("[data-delete-menu]");
        if (!remove) return;
        const menu = state.customMenus.find((item) => item.id === remove.dataset.deleteMenu);
        if (!menu || !confirm("确定删除菜单“" + menu.name + "”吗？")) return;
        state.customMenus = state.customMenus.filter((item) => item.id !== menu.id);
        if (state.activeMenu === menu.name) state.activeMenu = "首页";
        saveState();
        renderCustomMenus();
        showToast("菜单已删除");
      });

      dataMenuButton.addEventListener("click", (event) => {
        event.stopPropagation();
        dataPopover.hidden ? openDataPopover() : closeDataPopover();
      });
      exportDataButton.addEventListener("click", exportPrototypeData);
      importDataButton.addEventListener("click", () => importDataFile.click());
      importDataFile.addEventListener("change", () => {
        const file = importDataFile.files && importDataFile.files[0];
        if (file) importPrototypeData(file);
      });
      downloadHtmlButton.addEventListener("click", downloadCurrentHtml);

      document.querySelectorAll(".global-nav-item:not(#railAgent)").forEach((item) => {
        item.addEventListener("click", () => {
          if (item.dataset.nav !== "CRM") showToast(item.dataset.nav + "入口为壳层演示");
        });
      });

      document.addEventListener("click", (event) => {
        if (!modelMenu.hidden && !modelMenu.contains(event.target) && !modelSelector.contains(event.target)) {
          modelMenu.hidden = true;
          modelSelector.setAttribute("aria-expanded", "false");
        }
        if (!dataPopover.hidden && !dataPopover.contains(event.target) && !dataMenuButton.contains(event.target)) closeDataPopover();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        if (!menuDialog.hidden) closeMenuConfig();
        else if (!dataPopover.hidden) closeDataPopover();
        else if (!modelMenu.hidden) {
          modelMenu.hidden = true;
          modelSelector.setAttribute("aria-expanded", "false");
          modelSelector.focus();
        } else if (sessionDrawer.classList.contains("open")) closeSessionDrawer();
        else if (appRoot.classList.contains("agent-open")) setAgent(false, true);
      });
      window.addEventListener("resize", closeDataPopover);

      renderCustomMenus();
      applyAgentState();
      saveState();
    })();
  </script>
</body>
</html>
