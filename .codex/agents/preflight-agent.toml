name = "preflight-agent"
description = "Pre-flight check agent — validates preconditions before a skill starts. Called before any skill_execution or standalone skill invocation. Returns PASS or FAIL with specific missing items and fix suggestions."

# 纯机械前置检查，只读。
sandbox_mode = "read-only"

