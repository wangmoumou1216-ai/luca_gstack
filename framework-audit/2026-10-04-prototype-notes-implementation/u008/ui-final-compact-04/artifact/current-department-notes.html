ata-formfp]'):key==='dataDepts'?document.querySelector('[data-formdp]'):null);\n  el?.focus();el?.scrollIntoView({block:'center',behavior:window.matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});\n }\n});\ndocument.addEventListener('keydown',e=>{\n if(e.key==='Tab'&&(S.drawer||S.dialog)){\n  const active=S.dialog?document.querySelector('.dialog-card'):document.getElementById('drawer');if(!active)return;\n  const items=[...active.querySelectorAll('button:not(:disabled),input:not(:disabled),[data-choice]:not(:disabled),textarea:not(:disabled),a[href],[contenteditable=\"true\"],[tabindex]:not([tabindex=\"-1\"])')].filter(el=>!el.closest('[inert]')&&el.getClientRects().length);\n  if(!items.length){e.preventDefault();active.focus();return}\n  const first=items[0],last=items[items.length-1];\n  if(e.shiftKey&&(document.activeElement===first||!active.contains(document.activeElement))){e.preventDefault();last.focus()}\n  else if(!e.shiftKey&&(document.activeElement===last||!active.contains(document.activeElement))){e.preventDefault();first.focus()}\n }\n const tab=e.target.closest('[role=\"tab\"][data-tab]');\n if(tab&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){\n  const tabs=[...document.querySelectorAll('[role=\"tab\"][data-tab]')],i=tabs.indexOf(tab);\n  const index=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;\n  const key=tabs[index].dataset.tab;e.preventDefault();tabs[index].click();document.querySelector('[data-tab=\"'+key+'\"]')?.focus();\n }\n const tool=e.target.closest('[data-tool]');\n if(tool&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){\n  const tools=[...tool.closest('.editor-toolbar').querySelectorAll('[data-tool]')],i=tools.indexOf(tool);\n  const index=e.key==='Home'?0:e.key==='End'?tools.length-1:(i+(e.key==='ArrowRight'?1:-1)+tools.length)%tools.length;\n  e.preventDefault();tools[index].focus();\n }\n});\n$('toast').addEventListener('mouseenter',()= (perms.indexOf(NAVNAME[S.nav])\u003c0){\n  const first=S.nav==='dashboard'?null:PERMS.find(p=>perms.indexOf(p)>=0);\n  const key=Object.keys(NAVNAME).find(k=>NAVNAME[k]===first)||'dashboard';\n  S.nav=key;S.tab=key==='dashboard'?S.tab||'reports':S.tab;S.drawer=null;S.form=null;S.dialog=null;\n }\n document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.nav===S.nav));\n $('app').innerHTML=\n  S.nav==='dashboard'?(S.loading?skeleton():dashboard()):\n  S.nav==='reports'?(S.reportMode==='edit'?editor():reportsPage()):\n  S.nav==='projects'?(S.loading?skeleton():projectsPage()):\n  S.nav==='follows'?(S.loading?skeleton():followsPage()):\n  S.nav==='tasks'?(S.loading?skeleton():tasksPage()):\n  S.nav==='people'?peoplePage():departmentsPage();\n enhanceApp();renderOverlay();\n}\nfunction skeleton(){\n return `\u003cdiv class=\"pagehead\">\u003cdiv>\u003cp class=\"eyebrow\">LOADING STATE\u003c/p>\u003ch1>正在载入部门数据\u003c/h1>\u003cp>加载态：骨架占位保持布局高度，不改变结构、不出现无出口的无限动效。\u003c/p>\u003c/div>\u003c/div>\n \u003cdiv class=\"skel-card\">\u003cdiv class=\"skeleton\" style=\"width:34%;height:16px\">\u003c/div>\u003cdiv class=\"skeleton\" style=\"width:88%\">\u003c/div>\u003cdiv class=\"skeleton\" style=\"width:74%\">\u003c/div>\u003cdiv class=\"skeleton\" style=\"width:52%\">\u003c/div>\u003c/div>\n \u003cdiv class=\"skel-card\" style=\"margin-top:12px\">\u003cdiv class=\"skeleton\" style=\"width:28%;height:16px\">\u003c/div>\u003cdiv class=\"skeleton\" style=\"width:80%\">\u003c/div>\u003cdiv class=\"skeleton\" style=\"width:66%\">\u003c/div>\u003c/div>`;\n}\nfunction sessionView(){\n const reason=S.sessionReason||'人员被停用、被删除或密码轮换后，既有会话必须失效。';\n return `\u003cdiv class=\"pagehead\">\u003cdiv>\u003cp class=\"eyebrow\">SESSION STATE\u003c/p>\u003ch1>会话已失效\u003c/h1>\u003cp>${esc(reason)}已输入内容保留，不静默清空。\u003c/p>\u003c/div>\u003c/div>\n \u003cdiv class=\"notice danger\">会话状态：\u003cstrong>已失效\u003c/strong>（原因：${esc(reason)}）你在此前页面中输入的内容仍保留在当前浏览器；正式实现需服务端校验并恢复未提交草稿。\u003c/div>\n \u003cdiv class=\"panel\">\u003ch2>登录校验\u003c/h2>\n  \u003cp class=\"meta\" style=\"margin:8px 0 8px\">登录必须逐项通过：\u003cstrong>① 人员档案存在 → ② 手机号 + 密码校验通过 → ③ 账号为「启用」状态\u003c/strong>。停用人员即使密码正确也不得登录。\u003c/p>\n  \u003cdiv class=\"filterbar\" style=\"margin:0 0 12px;padding:0;border:0\">\n   \u003cdiv class=\"control grow\">\u003clabel for=\"login-person\">选择登录人员\u003c/label>${choice({id:`login-person`,className:`input`,filter:`loginPerson`,bindings:{\"filter\":`loginPerson`}},opts(D.people,S.loginPerson||logUser))}\u003c/div>\n   \u003cdiv class=\"control\" style=\"align-self:flex-end\">\u003cbutton class=\"btn primary\" data-action=\"relogin-do\">尝试登录\u003c/button>\u003c/div>\n  \u003c/div>\n  \u003cp class=\"meta\" style=\"margin:0 0 12px\">当前人员状态：${D.accounts.map(a=>esc(a.name)+' '+(a.status==='启用'?tag('启用','good'):tag('停用','high'))).join('　')}\u003c/p>\n  \u003cdiv class=\"actions\">${act('登录规则说明','relogin')}${act('返回演示首页','demo-home')}\u003c/div>\n \u003c/div>`;\n}\n/* ============================== 工作台 ============================== */\nfunction scopeBar(){\n const TS=D.tasks.filter(inScope);\n const todo=TS.filter(t=>t.status!=='已完成').length;\n const overdue=TS.filter(t=>t.due\u003ctoday()&&t.status!=='已完成').length;\n return `\u003cdiv class=\"statstrip\" aria-label=\"部门数据概览\">\n \u003cdiv class=\"stat od-stat\">\u003cspan class=\"stat-label\">部门项目\u003c/span>\u003cdiv class=\"stat-value od-nowrap\">\u003cstrong>${D.projects.filter(inScope).length}\u003c/strong>\u003csmall>个\u003c/small>\u003c/div>\u003cspan class=\"stat-caption\" aria-hidden=\"true\">\u003c/span>\u003c/div>\n \u003cdiv class=\"stat od-stat\">\u003cspan class=\"stat-label\">待办任务\u003c/span>\u003cdiv class=\"stat-value od-nowrap\">\u003cstrong>${todo}\u003c/strong>\u003c/div>\u003cspan class=\"stat-caption\">未开始 + 进行中\u003c/span>\u003c/div>\n \u003cdiv class=\"stat od-stat${overdue?' is-alert':''}\">\u003cspan class=\"stat-label\">逾期事项\u003c/span>\u003cdiv class=\"stat-value od-nowrap\">\u003cstrong>${overdue}\u003c/strong>\u003c/div>\u003cspan class=\"stat-caption\">按截止日期\u003c/span>\u003c/div>\n \u003cdiv class=\"stat od-stat\">\u003cspan class=\"stat-label\">已提交周报\u003c/span>\u003cdiv class=\"stat-value od-nowrap\">\u003cstrong>${D.reports.filter(inScope).length}\u003c/strong>\u003csmall>份\u003c/small>\u003c/div>\u003cspan class=\"stat-caption\" aria-hidden=\"true\">\u003c/span>\u003c/div>\u003c/div>`;\n}\nfunction dashboard(){\n return `\u003cdiv class=\"pagehead\">\u003cdiv>\u003cp class=\"eyebrow\">DEPARTMENT WORKSPACE\u003c/p>\u003ch1>部门工作台\u003c/h1>\u003cp>按工作周查看周报、项目支持与全部任务；三看板共享筛选条件与返回上下文。\u003c/p>\u003c/div>\n \u003cdiv class=\"actions\">${act('新建周报','new-report','primary')}${act('刷新视图','refresh')}${act(S.scope==='dept'?'切换到我的视角':'切换到部门视角','scope-toggle')}\u003c/div>\u003c/div>\n ${scopeBar()}\n \u003cdiv class=\"tabs\" role=\"tablist\">${[['reports','工作周报看板'],['projects','项目支持看板'],['tasks','任务清单看板']].map(([k,v])=>`\u003cbutton class=\"tab${S.tab===k?' active':''}\" role=\"tab\" id=\"tab-${k}\" aria-controls=\"board-${k}\" aria-selected=\"${S.tab===k}\" data-tab=\"${k}\">${v}\u003c/button>`).join('')}\u003c/div>\n \u003csection class=\"board-panel\" id=\"board-${S.tab}\" role=\"tabpanel\" aria-labelledby=\"tab-${S.tab}\" tabindex=\"-1\">${S.tab==='reports'?reportBoard():S.tab==='projects'?projectBoard():taskBoard()}\u003c/section>`;\n}\nfunction reportBoard(){\n const list=D.reports.filter(r=>inScope(r)&&(S.rPerson==='all'||r.person===S.rPerson)&&(S.week==='all'||r.week===+S.week)&&(S.rStatus==='all'||r.status===S.rStatus)&&(!S.rQ||[r.topic,r.done,r.advance,r.risk,r.next,r.person].join(' ').includes(S.rQ)))\n  .sort((a,b)=>b.end.localeCompare(a.end)||b.created.localeCompare(a.created));\n return `\u003cdiv class=\"filterbar light-filters\" role=\"search\">\n \u003cdiv class=\"control\">\u003clabel for=\"f-week\">工作周\u003c/label>${choice({id:`f-week`,className:`input`,filter:`week`,bindings:{\"filter\":`week`}},opts(['all','39','38'],S.week,{all:'全部工作周',39:'第39周 · 09/21–09/27',38:'第38周 · 09/14–09/20'}))}\u003c/div>\n \u003cdiv class=\"control\">\u003clabel for=\"f-rp\">周报人员\u003c/label>${choice({id:`f-rp`,className:`input`,filter:`rPerson`,bindings:{\"filter\":`rPerson`}},opts(['all',...D.people],S.rPerson,{all:'所有人员'}))}\u003c/div>\n \u003cdiv class=\"control\">\u003clabel for=\"f-rs\">提交状态\u003c/label>${choice({id:`f-rs`,className:`input`,filter:`rStatus`,bindings:{\"filter\":`rStatus`}},opts(['all','草稿','已提交'],S.rStatus,{all:'全部状态'}))}\u003c/div>\n ${boardSearchControl('f-rq','rQ','内容搜索','搜索最终汇报内容或人员')}\n \u003c/div>\n \u003cdiv class=\"section-title\">\u003ch2>最终汇报 · ${list.length} 份\u003c/h2>\u003cspan class=\"hint\">工作周倒序 · 同周按创建日期倒序 · 连续滚动查看\u003c/span>\u003c/div>\n \u003cdiv class=\"reports\">${list.length?list.map(r=>`\n  \u003carticle class=\"report\" aria-labelledby=\"report-title-${esc(r.id)}\">\n   \u003cdiv class=\"report-head\">\n    \u003cdiv class=\"report-identity\">\n     \u003ch3 class=\"report-title\" id=\"report-title-${esc(r.id)}\">${esc(r.topic)}\u003c/h3>\n     \u003cdiv class=\"report-context od-cluster\">\u003cspan class=\"report-author\">${esc(r.person)}\u003c/span>\u003cspan class=\"od-nowrap\">第 ${r.week} 周\u003c/span>\u003cspan class=\"od-nowrap\">${r.start} — ${r.end}\u003c/span>${tag(r.status,r.status==='已提交'?'good':'')}\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"row-actions report-actions\">${act('查看周报','open-report:'+esc(r.id),'small')}\u003c/div>\n   \u003c/div>\n   \u003cdiv class=\"report-main\">\n    \u003cdl class=\"report-facts od-stack\">\n     \u003cdiv class=\"report-fact od-row-top\">\u003cdt class=\"od-fixed\">完成事项\u003c/dt>\u003cdd class=\"od-fill\">${esc(r.done)}\u003c/dd>\u003c/div>\n     \u003cdiv class=\"report-fact od-row-top\">\u003cdt class=\"od-fixed\">关键进展\u003c/dt>\u003cdd class=\"od-fill\">${esc(r.advance)}\u003c/dd>\u003c/div>\n     \u003cdiv class=\"report-fact od-row-top\">\u003cdt class=\"od-fixed\">问题风险\u003c/dt>\u003cdd class=\"od-fill\">${esc(r.risk)}\u003c/dd>\u003c/div>\n     \u003cdiv class=\"report-fact od-row-top\">\u003cdt class=\"od-fixed\">下一步动作\u003c/dt>\u003cdd class=\"od-fill\">${esc(r.next)}\u003c/dd>\u003c/div>\n    \u003c/dl>\n   \u003c/div>\n   \u003cfooter class=\"report-footer\">\n    \u003cdetails class=\"report-details\">\n     \u003csummary>\u003cspan>记录信息\u003c/span>${icon('chevron')}\u003c/summary>\n     \u003cdiv class=\"od-stack report-detail-content\">\n      \u003cp class=\"meta\">更新 ${r.updated}\u003c/p>\n      \u003cp class=\"meta\">${esc(r.no)} · 创建人 ${esc(r.createdBy)} · 创建部门 ${esc(r.createdDept)}\u003c/p>\n      \u003cp class=\"src-note\">来源说明：本卡为最终汇报快照，仅呈现整合结果；数据获取区与手工填写区原文不在看板展示。\u003c/p>\n     \u003c/div>\n    \u003c/details>\n    ${act('删除','delete-report:'+esc(r.id),'small danger report-delete')}\n   \u003c/footer>\n  \u003c/article>`).join(''):emptyBlock('没有符合条件的周报','可调整人员、工作周或搜索关键词后重试。','清空筛选','reset-reports')}\u003c/div>`;\n}\nfunction recordMeta(parts){\n return `\u003cdetails class=\"record-meta\">\u003csummary>\u003cspan>记录信息\u003c/span>${icon('chevron')}\u003c/summary>\u003cdiv class=\"record-meta-body od-stack\">${parts.map(content=>'\u003cp>'+content+'\u003c/p>').join('')}\u003c/div>\u003c/details>`;\n}\nfunction recordText(value,shortLimit=48){\n const text=String(value??'');\n if(text.length\u003c=shortLimit)return `\u003cp class=\"record-body\">${esc(text)}\u003c/p>`;\n return `\u003cdetails class=\"record-text\">\u003csummary>\u003cspan class=\"record-preview od-clamp-2\">${esc(text)}\u003c/span>\u003cspan class=\"record-expand\">\u003cspan class=\"record-open\">展开全文\u003c/span>\u003cspan class=\"record-close\">收起全文\u003c/span>${icon('chevron')}\u003c/span>\u003c/summary>\u003cp class=\"record-full\">${esc(text)}\u003c/p>\u003c/details>`;\n}\nfunction projectRow(p){\n const f=lastFollow(p.name);\n const progress=p.override!==null\n  ? `\u003cstrong>${p.override}%\u003c/strong>\u003cdiv class=\"progress\">\u003cb style=\"width:${p.override}%\">\u003c/b>\u003c/div>\u003cspan class=\"cell-sub\">${tag('人工修正','mid')} 系统计算 ${p.computed}%\u003c/span>`\n  : p.computed!==null\n   ? `\u003cstrong>${p.computed}%\u003c/strong>\u003cdiv class=\"progress\">\u003cb style=\"width:${p.computed}%\">\u003c/b>\u003c/div>\u003cspan class=\"cell-sub\">末级任务计算\u003c/span>`\n   : `\u003cspan class=\"cell-sub\" style=\"color:var(--text-2);margin:0 0 4px\">暂无可计算进度\u003c/span>\u003cspan class=\"cell-sub\" style=\"margin:0\">无有效末级任务，不显示 0%\u003c/span>`;\n return `\u003ctr>\n  \u003ctd>\u003cbutton class=\"link-btn record-title od-clamp-2\" data-action=\"open-project:${esc(p.id)}\">${esc(p.name)}\u003c/button>\n   \u003cspan class=\"record-secondary\">${esc(p.cat)} · 负责人 ${esc(p.owner)}\u003c/span>\n   ${recordMeta([esc(p.no),'创建 '+esc(p.created),'创建人 '+esc(p.createdBy)+' · 创建部门 '+esc(p.createdDept)])}\u003c/td>\n  \u003ctd>\u003cdiv class=\"record-stack od-field\">${tag(p.stage)}\u003cdiv class=\"record-progress\">${progress}\u003c/div>\u003c/div>\u003c/td>\n  \u003ctd class=\"record-note\">\u003cdiv class=\"record-stack od-field\">\u003cspan class=\"record-owner\">${f?esc(f.person):'—'}\u003c/span>${recordText(f?f.content:'暂无项目跟进')}\u003c/div>\u003c/td>\n  \u003ctd>\u003cspan class=\"record-date od-nowrap\">${f?f.date:'—'}\u003c/span>\u003c/td>\n  \u003ctd class=\"record-actions\">\u003cdiv class=\"row-actions\">${act('＋ 项目跟进','open-follow:'+esc(p.name),'small')}${act('删除','delete-project:'+esc(p.id),'small danger')}\u003c/div>\u003c/td>\u003c/tr>`;\n}\nfunction projectBoard(){\n const list=D.projects.filter(p=>inScope(p)&&(!S.pQ||p.name.includes(S.pQ))&&(S.pStage==='all'||p.stage===S.pStage))\n  .sort((a,b)=>((lastFollow(b.name)||{}).date||'').localeCompare((lastFollow(a.name)||{}).date||''));\n return `\u003cdiv class=\"filterbar light-filters\" role=\"search\">\n \u003cdiv class=\"control\">\u003clabel for=\"f-ps\">项目阶段\u003c/label>${choice({id:`f-ps`,className:`input`,filter:`pStage`,bindings:{\"filter\":`pStage`}},opts(['all',...stageNames()],S.pStage,{all:'全部阶段'}))}\u003c/div>\n ${act('填写项目跟进','add-follow')}${boardSearchControl('f-pq','pQ','项目名称','输入项目名称关键词检索')}\u003c/div>\n \u003cdiv class=\"section-title\">\u003ch2>项目清单 · ${list.length} 个\u003c/h2>\u003cspan class=\"hint\">按最近跟进日期倒序；无跟进日期的项目置底\u003c/span>\u003c/div>\n ${list.length?`\u003cdiv class=\"table-wrap record-table record-projects\">\u003ctable>\u003ccolgroup>\u003ccol class=\"col-primary\">\u003ccol class=\"col-state\">\u003ccol class=\"col-note\">\u003ccol class=\"col-date\">\u003ccol class=\"col-actions\">\u003c/colgroup>\u003cthead>\u003ctr>\u003cth>项目名称\u003c/th>\u003cth>项目阶段 / 当前进度\u003c/th>\u003cth>跟进人员 / 最后跟进内容\u003c/th>\u003cth>最近跟进日期\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${list.map(projectRow).join('')}\u003c/tbody>\u003c/table>\u003c/div>`\n :emptyBlock('没有匹配的项目','可调整项目名称关键词或项目阶段；也可直接新建项目。','清空筛选','reset-projects')}`;\n}\nfunction taskBoard(){\n const rank={高:0,中:1,低:2};\n const list=D.tasks.filter(t=>inScope(t)&&(S.tOwner==='all'||t.owner===S.tOwner)&&(S.tPri==='all'||t.priority===S.tPri)&&(S.tStatus==='all'||t.status===S.tStatus))\n  .sort((a,b)=>rank[a.priority]-rank[b.priority]||a.due.localeCompare(b.due)||b.created.localeCompare(a.created));\n return `\u003cdiv class=\"filterbar light-filters\" role=\"search\">\n \u003cdiv class=\"control\">\u003clabel for=\"f-to\">任务负责人\u003c/label>${choice({id:`f-to`,className:`input`,filter:`tOwner`,bindings:{\"filter\":`tOwner`}},opts(['all',...D.people],S.tOwner,{all:'全部负责人'}))}\u003c/div>\n \u003cdiv class=\"control\">\u003clabel for=\"f-tp\">优先级\u003c/label>${choice({id:`f-tp`,className:`input`,filter:`tPri`,bindings:{\"filter\":`tPri`}},opts(['all','高','中','低'],S.tPri,{all:'全部优先级'}))}\u003c/div>\n \u003cdiv class=\"control\">\u003clabel for=\"f-ts\">任务状态\u003c/label>${choice({id:`f-ts`,className:`input`,filter:`tStatus`,bindings:{\"filter\":`tStatus`}},opts(['all','未开始','进行中','已完成'],S.tStatus,{all:'全部状态'}))}\u003c/div>\n ${act('填写任务进度','add-progress')}\u003c/div>\n \u003cdiv class=\"section-title\">\u003ch2>任务清单 · ${list.length} 项\u003c/h2>\u003cspan class=\"hint\">优先级 高 → 中 → 低；同级按截止日期升序，再按创建日期倒序\u003c/span>\u003c/div>\n ${list.length?`\u003cdiv class=\"table-wrap record-table directory-table record-tasks\">\u003ctable>\u003ccolgroup>\u003ccol class=\"col-primary\">\u003ccol class=\"col-state\">\u003ccol class=\"col-related\">\u003ccol class=\"col-note\">\u003ccol class=\"col-date\">\u003ccol class=\"col-actions\">\u003c/colgroup>\u003cthead>\u003ctr>\u003cth>创建日期｜任务名称\u003c/th>\u003cth>状态 / 优先级\u003c/th>\u003cth>负责人 / 关联项目\u003c/th>\u003cth>最新任务进度\u003c/th>\u003cth>截止日期\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n ${list.map(t=>`\u003ctr>\n  \u003ctd>\u003cdiv class=\"record-name od-row-top\">\u003cspan class=\"date-prefix od-nowrap\">${t.created}｜\u003c/span>\u003cbutton class=\"link-btn record-title od-clamp-2\" data-action=\"open-task:${esc(t.id)}\">${esc(t.name)}\u003c/button>\u003c/div>\n   ${recordMeta([esc(t.no)+' · '+t.level+' 级任务'+(t.path!=='—'?' · '+esc(t.path):''),'创建人 '+esc(t.createdBy)+' · 创建部门 '+esc(t.createdDept)])}\u003c/td>\n  \u003ctd>\u003cdiv class=\"record-stack od-field\">${tag(t.status,t.status==='已完成'?'good':t.status==='进行中'?'status-progress':'')}${tag(t.priority+'优先级',prClass(t.priority))}\u003c/div>\u003c/td>\n  \u003ctd>\u003cdiv class=\"record-stack od-field\">\u003cspan class=\"record-owner\">${esc(t.owner)}\u003c/span>\u003cspan class=\"record-secondary\">${esc(t.project)}\u003c/span>\u003c/div>\u003c/td>\n  \u003ctd class=\"record-note\">${recordText((lastProgress(t.name)||{}).content||t.latest,24)}\u003c/td>\n  \u003ctd>\u003cspan class=\"record-date od-nowrap\">${t.due}\u003c/span>${t.due\u003ctoday()&&t.status!=='已完成'?'\u003cspan class=\"cell-sub\">'+tag('已逾期','high')+'\u003c/span>':''}\u003c/td>\n  \u003ctd class=\"record-actions directory-actions-cell\">\u003cdiv class=\"row-actions directory-row-actions\">${act('＋ 任务进度','open-progress:'+esc(t.name),'small')}\u003cdetails class=\"directory-more\">\u003csummary aria-label=\"${esc(t.name)}的更多操作\">\u003cspan>更多\u003c/span>${icon('chevron')}\u003c/summary>\u003cdiv class=\"directory-more-actions od-stack\">${act('删除','delete-task:'+esc(t.id),'small danger')}\u003c/div>\u003c/details>\u003c/div>\u003c/td>\u003c/tr>`).join('')}\n \u003c/tbody>\u003c/table>\u003c/div>`:emptyBlock('没有符合条件的任务','可调整负责人、优先级或任务状态。','清空筛选','reset-tasks')}`;\n}\nfunction emptyBlock(title,desc,btnLabel,btnAct){\n return `\u003cdiv class=\"empty\">\u003cstrong>${title}\u003c/strong>${desc}\u003cdiv style=\"margin-top:12px\">${act(btnLabel,btnAct,'small')}\u003c/div>\u003c/div>`;\n}\n/* ============================== 工作汇报 ============================== */\nfunction reportsPage(){\n return `\u003cdiv class=\"pagehead\">\u003cdiv>\u003cp class=\"eyebrow\">WEEKLY REPORTS\u003c/p>\u003ch1>工作汇报\u003c/h1>\u003cp>每人每个工作周一份有效周报；查看状态只展示最终汇报快照，编辑状态保留数据获取区与手工填写区。\u003c/p>\u003c/div>\n \u003cdiv class=\"actions\">${act('新建本周周报','new-report','primary')}${act('历史周报说明','history-hint')}\u003c/div>\u003c/div>\n \u003cdiv class=\"notice\">周报状态：草稿 / 已提交 / 退回修改 / 已归档。保存草稿不触发 AI 生成，也不拆分创建项目或任务数据。\u003c/div>\n ${reportBoard()}`;\n}\nfunction editor(){\n const r=S.report,b=r.batch;\n return `\u003cdiv class=\"pagehead\">\u003cdiv>\u003cp class=\"eyebrow\">WEEKLY REPORT / ${r.status==='已提交'?'查看模式':'编辑模式'}\u003c/p>\u003ch1>${r.status==='已提交'?'查看本周周报':'填写工作周报'}\u003c/h1>\n \u003cp>填写人固定为 ${r.person}。数据获取只进入周报；AI 建议须经人工确认后才可能写回正式对象。\u003c/p>\u003c/div>\n \u003cdiv class=\"actions\">${act('返回周报列表','report-list')}\u003c/div>\u003c/div>\n \u003cdiv class=\"notice\">编辑状态始终保留 \u003cstrong>数据获取区\u003c/strong>、\u003cstrong>手工填写区\u003c/strong>、\u003cstrong>最终汇报区\u003c/strong>；工作台与看板只展示最终汇报区。\u003c/div>\n \u003cdiv class=\"editor-grid\">\u003cdiv class=\"editor-stack\">\n  \u003csection class=\"panel\">\n   \u003cdiv class=\"panel-head\">\u003cdiv>\u003ch2>工作周\u003c/h2>\u003cp>开始日期 / 结束日期 / 第几周。页面统一使用「创建日期」，不再展示业务日期与创建时间。\u003c/p>\u003c/div>${tag(r.status,r.status==='已提交'?'good':'')}\u003c/div>\n   \u003cdiv class=\"fieldrow\">\n    \u003cdiv class=\"field\">\u003clabel for=\"w-start\">开始日期\u003c/label>\u003cinput type=\"date\" class=\"input\" id=\"w-start\" data-rf=\"start\" value=\"${esc(r.start)}\">\u003c/div>\n    \u003cdiv class=\"field\">\u003clabel for=\"w-end\">结束日期\u003c/label>\u003cinput type=\"date\" class=\"input\" id=\"w-end\" data-rf=\"end\" value=\"${esc(r.end)}\">\u003c/div>\n    \u003cdiv class=\"field\">\u003clabel for=\"w-num\">第几周\u003c/label>\u003cinput type=\"number\" class=\"input\" id=\"w-num\" min=\"1\" max=\"53\" data-rf=\"week\" value=\"${r.week}\">\u003c/div>\n   \u003c/div>\n   \u003cdiv class=\"meta\" style=\"margin-top:8px\">周报填写人：${r.person}　/　创建日期：${r.created?'\u003cstrong>'+r.created+'\u003c/strong>':'首次成功保存后生成'}　/　保存状态：\u003cspan id=\"save-state\" aria-live=\"polite\">${esc(r.save)}\u003c/span>\u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"panel\">\n   \u003cdiv class=\"panel-head\">\u003cdiv>\u003ch2>01　数据获取\u003c/h2>\u003cp>拉取已有项目跟进与任务进度。\u003cstrong>只写入本份周报，不写回任何正式对象\u003c/strong>，且不触发 AI。\u003c/p>\u003c/div>${tag('来源：已存在业务数据','sync')}\u003c/div>\n   \u003cdiv class=\"filterbar\" style=\"margin:0 0 12px;padding:0;border:0\">\n    \u003cdiv class=\"control\">\u003clabel for=\"sync-person\">同步筛选人员\u003c/label>${choice({id:`sync-person`,className:`input`,filter:`syncPerson`,bindings:{\"filter\":`syncPerson`}},opts(D.people,S.report.syncPerson))}\u003c/div>\n    \u003cdiv class=\"control\" style=\"align-self:flex-end\">\u003cbutton class=\"btn primary\" data-action=\"sync\" id=\"sync-btn\">同步数据\u003c/button>\u003c/div>\n   \u003c/div>\n   \u003cp class=\"meta\" style=\"margin:0 0 8px\">身份区分：周报填写人 = 阳阳　/　同步筛选人员 = \u003cspan id=\"syncwho\">${S.report.syncPerson}\u003c/span>（只决定查询范围）　/　同步操作人 = 阳阳　/　原记录人员见每行。\u003c/p>\n   \u003cdiv id=\"sources\">${sourcesHtml()}\u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"panel\">\n   \u003cdiv class=\"panel-head\">\u003cdiv>\u003ch2>02　手工填写\u003c/h2>\u003cp>用户主动录入内容，\u003cstrong>是唯一参与 AI 生成的区域\u003c/strong>。支持文字、列表、表格、截图、附件、链接与 @关联。\u003c/p>\u003c/div>${tag('人工录入')}\u003c/div>\n   \u003cdiv class=\"field\">\u003clabel for=\"manual\">本周工作内容\u003c/label>${richEditor('manual',r.manual,'输入本周完成事项、关键进展、问题风险；可用工具栏插入示例内容……')}\u003c/div>\n   \u003cinput type=\"file\" id=\"file-input\" class=\"sr-only\" aria-label=\"添加图片或文档附件\">\n   \u003cdiv class=\"attach\" id=\"attach\">${r.attach.map(a=>tag(a.name+' · '+a.status)).join('')}\u003c/div>\n   \u003cdiv class=\"field\" style=\"margin-top:16px\">\u003clabel for=\"next\">下周工作计划\u003c/label>${richEditor('next',r.next,'填写下周计划与预期交付……')}\u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"panel\">\n   \u003cdiv class=\"panel-head\">\u003cdiv>\u003ch2>03　最终汇报\u003c/h2>\u003cp>整合数据获取与手工填写，形成结构化快照；可编辑表达，\u003cstrong>不改写任何来源原文\u003c/strong>。\u003c/p>\u003c/div>${tag('汇报快照')}\u003c/div>\n   \u003cdiv id=\"final-area\">${finalHtml()}\u003c/div>\n   \u003cdiv class=\"actions\" style=\"margin-top:12px\">${act('生成最终汇报','make-final')}\u003c/div>\n  \u003c/section>\n\n  \u003cdiv class=\"footer-actions\">\n   \u003cspan class=\"meta\">演示环境：保存与提交只更新当前浏览器内存，刷新后重置。\u003c/span>\n   \u003cdiv class=\"actions\">${act('保存草稿','save-draft')}${act('AI生成','generate-ai')}${act('提交周报','submit-report','primary')}\u003c/div>\n  \u003c/div>\n \u003c/div>\n\n \u003caside class=\"side-sticky\">\n  \u003cdiv class=\"panel\">\n   \u003cdiv class=\"panel-head\" style=\"margin-bottom:8px\">\u003cdiv>\u003ch2 style=\"font-size:var(--fs-body)\">AI 生成批次\u003c/h2>\u003cp>仅处理手工填写区\u003c/p>\u003c/div>${tag(b?b.status:'尚未生成',b?(b.status==='失败'?'high':b.status==='已提交'?'good':'ai'):'')}\u003c/div>\n   \u003cdiv id=\"ai-summary\">${batchSummary()}\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"panel\">\n   \u003ch2 style=\"font-size:var(--fs-body);margin-bottom:8px\">写回边界（常驻可见）\u003c/h2>\n   \u003cdiv class=\"kv\">\u003cstrong>同步数据\u003c/strong>\u003cspan class=\"meta\">只改当前周报，不创建、不修改正式对象\u003c/span>\u003c/div>\n   \u003cdiv class=\"kv\">\u003cstrong>AI 生成\u003c/strong>\u003cspan class=\"meta\">先出可编辑表格，不直接写回\u003c/span>\u003c/div>\n   \u003cdiv class=\"kv\">\u003cstrong>提交生成结果\u003c/strong>\u003cspan class=\"meta\">确认后才拆分创建项目跟进 / 任务进度\u003c/span>\u003c/div>\n   \u003cdiv class=\"kv\">\u003cstrong>提交周报\u003c/strong>\u003cspan class=\"meta\">只保存最终汇报快照，不重复写回\u003c/span>\u003c/div>\n  \u003c/div>\n \u003c/aside>\u003c/div>`;\n}\nfunction richEditor(id,html,ph){\n const tools=[['bold','加粗'],['list','无序列表'],['table','简单表格'],['mention','@关联项目或任务'],['link','链接'],['image','图片'],['file','附件']];\n return `\u003cdiv class=\"editor-surface\">\u003cdiv class=\"editor-toolbar\" role=\"toolbar\" aria-label=\"${id==='manual'?'本周工作内容':'下周工作计划'}格式工具\">\n ${tools.map(([k,t])=>`\u003cbutton type=\"button\" data-tool=\"${k}:${id}\"${k==='bold'||k==='list'?' aria-pressed=\"false\"':''} title=\"${t}\" aria-label=\"${t}\">${icon(k)}\u003c/button>`).join('')}\u003c/div>\n \u003cdiv class=\"richbox\" id=\"${id}\" role=\"textbox\" aria-multiline=\"true\" aria-label=\"${id==='manual'?'本周工作内容':'下周工作计划'}\" contenteditable=\"true\" data-placeholder=\"${esc(ph)}\">${html}\u003c/div>\u003c/div>`;\n}\nfunction sourcesHtml(){\n const s=S.report.sources;\n if(!s.length)return emptyBlock('尚未同步业务记录','选择工作周与同步筛选人员后点击「同步数据」。同步结果只进入本份周报。','了解同步规则','sync-rule');\n return s.map((x,i)=>`\u003cdiv class=\"src-row\">\n  \u003cdiv>${tag(x.type,x.type==='项目跟进'?'sync':'low')}\u003cspan class=\"src-id\">${esc(x.no)}\u003c/span>\u003c/div>\n  \u003cdiv>\u003cstrong>${esc(x.project)}\u003c/strong>\n   \u003cspan class=\"cell-sub\">原记录人员：${esc(x.person)} · 原创建日期：${x.date} · \u003cbutton class=\"link-btn\" data-action=\"source-open:${esc(x.no)}\">查看原记录\u003c/button>\u003c/span>\n   \u003clabel class=\"sr-only\" for=\"src-${i}\">仅在周报内整理同步内容\u003c/label>\n   \u003ctextarea class=\"input\" id=\"src-${i}\" data-src=\"${i}\" rows=\"2\" aria-label=\"仅在周报内整理同步内容\">${esc(x.text)}\u003c/textarea>\n  \u003c/div>\n  \u003cspan>${tag('不回写','sync')}\u003c/span>\u003c/div>`).join('');\n}\nfunction finalHtml(){\n const f=S.report.final;\n if(!f)return emptyBlock('尚未生成最终汇报','同步已有数据或填写本周内容后，点击「生成最终汇报」。提交周报前必须完成此步。','了解最终汇报规则','final-rule');\n return `\u003cdiv class=\"final-preview\">\n  \u003cdiv class=\"field\">\u003clabel for=\"ft-topic\">工作主题 / 项目　·　来源：混合整理\u003c/label>\u003cinput class=\"input\" id=\"ft-topic\" data-ff=\"topic\" value=\"${esc(f.topic)}\">\u003c/div>\n  \u003cdiv class=\"field\" style=\"margin-top:8px\">\u003clabel for=\"ft-done\">完成事项 / 关键进展　·　来源：数据获取 + 手工填写\u003c/label>\u003ctextarea class=\"input\" id=\"ft-done\" data-ff=\"done\">${esc(f.done)}\u003c/textarea>\u003c/div>\n  \u003cdiv class=\"field\" style=\"margin-top:8px\">\u003clabel for=\"ft-risk\">问题风险　·　来源：手工填写\u003c/label>\u003ctextarea class=\"input\" id=\"ft-risk\" data-ff=\"risk\">${esc(f.risk)}\u003c/textarea>\u003c/div>\n  \u003cdiv class=\"field\" style=\"margin-top:8px\">\u003clabel for=\"ft-next\">下一步动作　·　来源：手工填写\u003c/label>\u003ctextarea class=\"input\" id=\"ft-next\" data-ff=\"next\">${esc(f.next)}\u003c/textarea>\u003c/div>\n  \u003cdiv class=\"src-note\">来源说明：同步记录 ${S.report.sources.length} 条 ｜ 手工内容版本 v${S.report.version} ｜ 编辑本区不反向改写任一来源。\u003c/div>\n \u003c/div>`;\n}\nfunction batchSummary(){\n const b=S.report.batch;\n if(!b)return `\u003cp class=\"meta\">填写本周工作内容后点击「AI生成」。生成结果先以可编辑表格呈现，不会直接写回。\u003c/p>`;\n const steps=['草稿','生成中','待提交','提交中','已提交'];\n const cur=b.status==='失败'?'待提交':b.status;\n return `\u003cdiv class=\"batch-status\">${steps.map((s,i)=>`\u003cspan class=\"step ${s===cur?(b.status==='失败'?'fail':'now'):(steps.indexOf(cur)>i?'done':'')}\">${s}\u003c/span>${i\u003csteps.length-1?'\u003cspan class=\"arrow\">'+icon('forward')+'\u003c/span>':''}`).join('')}\u003c/div>\n ${b.status==='失败'?'\u003cp class=\"meta\" style=\"color:var(--danger);font-weight:650\">当前状态：失败（已保留错误行与原因，原批次可修正重试）\u003c/p>':''}\n \u003cp class=\"meta\">批次号 ${esc(b.id)} ｜ 内容版本 v${b.version}\u003cbr>项目跟进 ${b.projRows.length} 行 ｜ 任务进度 ${b.taskRows.length} 行\u003c/p>\n \u003cdiv class=\"actions\" style=\"margin-top:8px\">${act(b.status==='已提交'?'查看已提交批次':'查看并编辑生成结果','view-ai','small primary')}\u003c/div>\n \u003cp class=\"meta\" style=\"margin-top:8px\">幂等键：周报 ID + 内容版本号 + 批次号。已提交批次只读，重复提交被拦截。\u003c/p>`;\n}\n/* ============================== 项目 / 任务 / 人员 ============================== */\nfunction projectsPage(){\n return `\u003cdiv class=\"pagehead\">\u003cdiv>\u003cp class=\"eyebrow\">PROJECT MANAGEMENT\u003c/p>\u003ch1>项目管理\u003c/h1>\u003cp>项目阶段、项目档案与项目跟进。跟进记录的统一查询在左侧「项目跟进查询」独立菜单中完成。\u003c/p>\u003c/div>\n \u003cdiv class=\"actions\">${act('管理项目阶段','manage-stages')}${act('填写项目跟进','add-follow')}${act('新建项目','add-project','primary')}\u003c/div>\u003c/div>\n \u003cdiv class=\"notice\">项目进度同时保存「系统计算值」与「人工修正值」：人工修正优先展示，但必须填写修正原因并记录修正人、时间与前后数值。\u003c/div>\n ${projectBoard()}`;\n}\n/* 项目跟进查询：跨项目统一查询，四字段模糊筛选（项目名称 / 跟进日期区间 / 跟进人员 / 跟进内容） */\nfunction followsPage(){\n const list=D.follows.filter(f=>inScope(f)&&\n  (!S.fQ||f.project.includes(S.fQ))&&\n  (!S.fContent||f.content.includes(S.fContent))&&\n  (S.fPerson==='all'||f.person===S.fPerson)&&\n  (!S.fFrom||f.date>=S.fFrom)&&(!S.fTo||f.date\u003c=S.fTo))\n  .sort((a,b)=>b.date.localeCompare(a.date)||b.no.localeCompare(a.no));\n const filtered=!!(S.fQ||S.fContent||S.fFrom||S.fTo||S.fPerson!=='all');\n return `\u003cdiv class=\"pagehead\">\u003cdiv>\u003cp class=\"eyebrow\">PROJECT FOLLOW QUERY\u003c/p>\u003ch1>项目跟进查询\u003c/h1>\u003cp>跨项目统一查询全部项目跟进。支持项目名称、跟进日期、跟进人员、跟进内容四项组合模糊筛选，任一条件留空即不参与过滤。\u003c/p>\u003c/div>\n \u003cdiv class=\"actions\">${act('填写项目跟进','add-follow','primary')}\u003c/div>\u003c/div>\n \u003cdiv class=\"filterbar light-filters\" role=\"search\">\n  ${followDateControl()}\n  \u003cdiv class=\"control\">\u003clabel for=\"q-person\">跟进人员\u003c/label>${choice({id:`q-person`,className:`input`,filter:`fPerson`,bindings:{\"filter\":`fPerson`}},opts(['all',...D.people],S.fPerson,{all:'全部人员'}))}\u003c/div>\n  ${filtered?act('清空筛选','reset-follows','small'):''}\n  ${boardSearchControl('q-proj','fQ','项目名称（模糊）','如：客群',[{id:'q-content',key:'fContent',label:'跟进内容（模糊）',placeholder:'如：评审'}])}\u003c/div>\n \u003cdiv class=\"section-title\">\u003ch2>跟进记录 · ${list.length} 条\u003c/h2>\u003cspan class=\"hint\">按跟进日期倒序；同一项目的多条跟进独立成行，不做合并\u003c/span>\u003c/div>\n ${list.length?`\u003cdiv class=\"table-wrap record-table record-follows\">\u003ctable>\u003ccolgroup>\u003ccol class=\"col-primary\">\u003ccol class=\"col-date\">\u003ccol class=\"col-note\">\u003ccol class=\"col-actions\">\u003c/colgroup>\u003cthead>\u003ctr>\u003cth>项目名称 / 单据编号\u003c/th>\u003cth>跟进日期 / 跟进人员\u003c/th>\u003cth>跟进内容\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n ${list.map(f=>`\u003ctr>\n  \u003ctd>\u003cbutton class=\"link-btn record-title od-clamp-2\" data-action=\"project-by-name:${esc(f.project)}\">${esc(f.project)}\u003c/button>\n   \u003cspan class=\"record-number\">${esc(f.no)}\u003c/span>\n   ${recordMeta(['创建人 '+esc(f.createdBy)+' · 创建部门 '+esc(f.createdDept)])}\u003c/td>\n  \u003ctd>\u003cdiv class=\"record-stack od-field\">\u003cspan class=\"record-date od-nowrap\">${f.date}\u003c/span>\u003cspan class=\"record-owner\">${esc(f.person)}\u003c/span>\u003c/div>\u003c/td>\n  \u003ctd class=\"record-note\">${recordText(f.content)}\u003c/td>\n  \u003ctd class=\"record-actions\">\u003cdiv class=\"row-actions\">${act('＋ 再填一条','open-follow:'+esc(f.project),'small')}${act('删除','delete-follow:'+esc(f.no),'small danger')}\u003c/div>\u003c/td>\u003c/tr>`).join('')}\n \u003c/tbody>\u003c/table>\u003c/div>`:emptyBlock('没有符合条件的跟进记录','可放宽项目名称、日期区间或跟进人员条件；也可直接填写一条新的项目跟进。','清空筛选','reset-follows')}`;\n}\nfunction tasksPage(){\n return `\u003cdiv class=\"pagehead\">\u003cdiv>\u003cp class=\"eyebrow\">TASK MANAGEMENT\u003c/p>\u003ch1>任务管理\u003c/h1>\u003cp>最多三级任务结构，三级为最小执行单元；进度记录保留历史、不可覆盖。\u003c/p>\u003c/div>\n \u003cdiv class=\"actions\">${act('任务分类','task-categories')}${act('填写任务进度','add-progress')}${act('新建任务','add-task','primary')}\u003c/div>\u003c/div>\n \u003cdiv class=\"notice\">任务列表展示格式为 \u003cstrong>创建日期｜任务名称\u003c/strong>；创建日期不是任务名称文本的一部分，编辑名称不影响创建日期。\u003c/div>\n ${taskBoard()}`;\n}\nfunction peoplePage(){\n const list=D.accounts.filter(a=>(!S.personQ||[a.name,a.phone,a.dept,a.no].join(' ').includes(S.personQ)));\n return `\u003cdiv class=\"pagehead\">\u003cdiv>\u003cp class=\"eyebrow\">TEAM DIRECTORY\u003c/p>\u003ch1>人员档案\u003c/h1>\u003cp>档案维护姓名、手机号、设置密码、归属部门（必填）与权限。账号支持停用 / 启用，\u003cstrong>停用后不可登录\u003c/strong>。\u003c/p>\u003c/div>\n \u003cdiv class=\"actions\">${act('新增人员','add-person','primary')}\u003c/div>\u003c/div>\n \u003cdiv class=\"filterbar light-filters\" role=\"search\">${boardSearchControl('f-personq','personQ','人员搜索','按姓名 / 手机号 / 归属部门 / 单据编号搜索')}\u003c/div>\n \u003cdiv class=\"section-title\">\u003ch2>部门人员 · ${list.length} 人\u003c/h2>\u003cspan class=\"hint\">手机号脱敏展示；密码密文展示且不可查看；停用人员不可登录\u003c/span>\u003c/div>\n \u003cdiv class=\"table-wrap directory-table\">\u003ctable>\u003ccolgroup>\u003ccol class=\"col-directory-person\">\u003ccol class=\"col-directory-dept\">\u003ccol class=\"col-directory-state\">\u003ccol class=\"col-directory-permissions\">\u003ccol class=\"col-directory-account\">\u003ccol class=\"col-directory-actions\">\u003c/colgroup>\u003cthead>\u003ctr>\u003cth>人员\u003c/th>\u003cth>归属部门\u003c/th>\u003cth>状态\u003c/th>\u003cth>权限\u003c/th>\u003cth>账号信息\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n ${list.map(a=>`\u003ctr>\n  \u003ctd>\u003cdiv class=\"directory-name od-cluster\">\u003cspan class=\"directory-person\">${esc(a.name)}\u003c/span>${a.name===curUser()?'\u003cspan class=\"directory-current\">当前登录\u003c/span>':''}\u003c/div>\u003cspan class=\"directory-phone od-nowrap\">${esc(a.phone)}\u003c/span>\u003c/td>\n  \u003ctd>${esc(a.dept)}\u003c/td>\n  \u003ctd>${a.status==='启用'?tag('启用','good'):tag('停用','high')}\u003c/td>\n  \u003ctd>\u003cdetails class=\"record-meta directory-permission-detail\">\u003csummary>\u003cspan>${a.funcPerms.length===PERMS.length?'全部功能':a.funcPerms.length?a.funcPerms.length+' 项功能':'无功能权限'}\u003c/span>${icon('chevron')}\u003c/summary>\u003cdiv class=\"record-meta-body od-stack\">\u003cp>功能：${a.funcPerms.length===PERMS.length?'全部功能':esc(a.funcPerms.join('、')||'无')}\u003c/p>\u003cp>数据：${esc(a.dataDepts.join('、')||'无')}\u003c/p>\u003c/div>\u003c/details>\u003cspan class=\"directory-secondary\">数据：${a.dataDepts.length?a.dataDepts.length+' 个部门':'无'}\u003c/span>\u003c/td>\n  \u003ctd>\u003cspan class=\"directory-password${a.pwdSet?'':' is-unset'}\">${a.pwdSet?'已加密存储':'未设置'}\u003c/span>${recordMeta([esc(a.no),'密码：•••••••• · '+(a.pwdSet?'已加密存储':'未设置'),'创建人 '+esc(a.createdBy),'创建部门 '+esc(a.createdDept)])}\u003c/td>\n  \u003ctd class=\"directory-actions-cell\">\u003cdiv class=\"row-actions directory-row-actions\">${act('编辑','edit-person:'+esc(a.name),'small')}\u003cdetails class=\"directory-more\">\u003csummary>\u003cspan>更多\u003c/span>${icon('chevron')}\u003c/summary>\u003cdiv class=\"directory-more-actions od-stack\">${act('重置密码','reset-pwd:'+esc(a.name),'small')}${a.status==='启用'?act('停用','toggle-person:'+esc(a.name),'small danger'):act('启用','toggle-person:'+esc(a.name),'small')}${act('删除','delete-person:'+esc(a.name),'small danger')}\u003c/div>\u003c/details>\u003c/div>\u003c/td>\u003c/tr>`).join('')}\n \u003c/tbody>\u003c/table>\u003c/div>`;\n}\nfunction departmentsPage(){\n const list=D.depts.filter(d=>(!S.dQ||[d.name,d.code,d.no].join(' ').includes(S.dQ)));\n return `\u003cdiv class=\"pagehead\">\u003cdiv>\u003cp class=\"eyebrow\">DEPARTMENTS\u003c/p>\u003ch1>部门档案\u003c/h1>\u003cp>部门是组织归属与数据权限的载体：人员档案必须归属一个部门；所有新增业务数据都会记录「创建部门」。\u003c/p>\u003c/div>\n \u003cdiv class=\"actions\">${act('新增部门','add-dept','primary')}\u003c/div>\u003c/div>\n \u003cdiv class=\"notice\">部门编码全局唯一、部门名称不可重复。\u003cstrong>已被人员或业务数据引用的部门不可直接删除\u003c/strong>，需先转移归属；批量删除需逐项校验并返回成功 / 失败明细。\u003c/div>\n \u003cdiv class=\"filterbar light-filters\" role=\"search\">${boardSearchControl('f-dq','dQ','部门搜索','按部门名称 / 部门编码 / 单据编号搜索')}\u003c/div>\n \u003cdiv class=\"section-title\">\u003ch2>部门档案 · ${list.length} 个\u003c/h2>\u003cspan class=\"hint\">按部门编码升序；在编人数与业务数据量为实时统计\u003c/span>\u003c/div>\n \u003cdiv class=\"table-wrap directory-table directory-departments\">\u003ctable>\u003ccolgroup>\u003ccol class=\"col-directory-name\">\u003ccol class=\"col-directory-count\">\u003ccol class=\"col-directory-count\">\u003ccol class=\"col-directory-account\">\u003ccol class=\"col-directory-actions\">\u003c/colgroup>\u003cthead>\u003ctr>\u003cth>部门\u003c/th>\u003cth>在编人数\u003c/th>\u003cth>业务数据\u003c/th>\u003cth>记录信息\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n ${list.map(d=>{const ppl=D.accounts.filter(a=>a.dept===d.name).length;const biz=D.projects.filter(p=>p.createdDept===d.name).length+D.tasks.filter(t=>t.createdDept===d.name).length+D.reports.filter(r=>r.createdDept===d.name).length;\n  return `\u003ctr>\n  \u003ctd>\u003cdiv class=\"directory-name od-field\">\u003cspan class=\"directory-title\">${esc(d.name)}\u003c/span>\u003cspan class=\"directory-secondary\">编码 ${esc(d.code)}\u003c/span>\u003c/div>\u003c/td>\n  \u003ctd>\u003cspan class=\"od-nowrap\">${ppl} 人\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"od-nowrap\">${biz} 条\u003c/span>\u003c/td>\n  \u003ctd>${recordMeta(['单据编号 '+esc(d.no),'备注 '+esc(d.note),'创建人 '+esc(d.createdBy),'创建部门 '+esc(d.createdDept)])}\u003c/td>\n  \u003ctd class=\"directory-actions-cell\">\u003cdiv class=\"row-actions directory-row-actions\">${act('编辑','edit-dept:'+esc(d.no),'small')}\u003cdetails class=\"directory-more\">\u003csummary aria-label=\"${esc(d.name)}的更多操作\">\u003cspan>更多\u003c/span>${icon('chevron')}\u003c/summary>\u003cdiv class=\"directory-more-actions od-stack\">${act('删除','delete-dept:'+esc(d.no),'small danger')}\u003c/div>\u003c/details>\u003c/div>\u003c/td>\u003c/tr>`}).join('')}\n \u003c/tbody>\u003c/table>\u003c/div>`;\n}\n/* ============================== 新增 / 编辑表单（左侧滑出） ==============================\n   写操作统一从左侧滑出，详情查看从右侧滑出：左右分工让「填写」与「查看」在空间上可区分，\n   避免在同一方向层叠时用户误以为新抽屉是上一层详情的延续。\n   表单宽度与详情一致（约屏幕 1/2），保证两列/三列表单不被压窄。\n   ====================================================================================== */\nconst FORM_META={\n 'new-project':{eyebrow:'PROJECT · 新建',title:'新建项目',ok:'创建项目',note:'创建日期默认当前日期，保存后不支持修改；单据编号按「年/月/日 + 四位流水」在保存时自动生成并校验唯一。'},\n 'edit-project':{eyebrow:'PROJECT · 编辑',title:'编辑项目',ok:'保存项目',note:'创建日期与单据编号不支持修改；修改项目名称会同步更新关联任务与项目跟进的引用。'},\n 'new-task':{eyebrow:'TASK · 新建',title:'新建任务',ok:'创建任务',note:'最多三级任务结构，三级为最小执行单元。'},\n 'edit-task':{eyebrow:'TASK · 编辑',title:'编辑任务',ok:'保存任务',note:'调整层级前需校验是否超过三级；创建日期与单据编号不受编辑影响。'},\n 'new-follow':{eyebrow:'项目跟进 · 新建',title:'填写项目跟进',ok:'提交跟进',note:'提交后自动更新该项目的最近跟进日期与最后跟进内容。'},\n 'new-progress':{eyebrow:'任务进度 · 新建',title:'填写任务进度',ok:'提交进度',note:'每次提交形成一条历史记录，不覆盖上一条。'},\n 'new-person':{eyebrow:'人员档案 · 新增',title:'新增人员',ok:'新增人员',note:'归属部门为必填；权限默认全部勾选（默认全部权限），可按人裁剪功能与数据权限。'},\n 'edit-person':{eyebrow:'人员档案 · 编辑',title:'编辑人员',ok:'保存人员',note:'归属部门为必填；设置密码留空表示本次不修改密码。'},\n 'new-dept':{eyebrow:'部门档案 · 新增',title:'新增部门',ok:'新增部门',note:'部门编码全局唯一；部门名称不可重复。'},\n 'edit-dept':{eyebrow:'部门档案 · 编辑',title:'编辑部门',ok:'保存部门',note:'部门编码修改后，历史数据中的创建部门快照不回溯改写。'},\n 'new-cat':{eyebrow:'任务分类 · 新增',title:'新增任务分类',ok:'新增分类',note:'分类名称唯一；已被任务使用的分类不可删除。'},\n 'edit-cat':{eyebrow:'任务分类 · 编辑',title:'编辑任务分类',ok:'保存分类',note:'修改名称会同步更新关联任务的分类引用。'},\n 'new-stage':{eyebrow:'项目阶段 · 新增',title:'新增项目阶段',ok:'新增阶段',note:'阶段名称唯一；已被项目使用的阶段不可删除。'},\n 'edit-stage':{eyebrow:'项目阶段 · 编辑',title:'编辑项目阶段',ok:'保存阶段',note:'修改名称会同步更新关联项目的阶段引用。'}\n};\nconst fErr=n=>{const e=S.form&&S.form.errors&&S.form.errors[n];return e?'\u003cp class=\"err\" id=\"form-error-'+n+'\" data-field-error=\"'+n+'\">'+icon('warning')+'\u003cspan>'+esc(e)+'\u003c/span>\u003c/p>':''};\nconst fBad=n=>S.form&&S.form.errors&&S.form.errors[n]?' bad':'';\nfunction openForm(type,id){\n snapshot();\n UI.formOrigin=S.drawer&&S.drawer.type!=='form'?{...S.drawer}:null;\n S.form={type:type,id:id||null,mode:/^edit-/.test(type)?'edit':'create',draft:draftOf(type,id),errors:{}};\n saveScroll();\n S.drawer={type:'form',side:'left'};\n S.dialog=null;\n renderOverlay();\n}\nfunction closeForm(){S.form=null;S.drawer=UI.formOrigin;S.dialog=null;UI.formOrigin=null;restoreScroll();render()}\nfunction draftOf(type,id){\n if(type==='new-project'||type==='edit-project'){\n  const p=id?D.projects.find(x=>x.id===id):null;\n  return p?{no:p.no,name:p.name,cat:p.cat,stage:p.stage,owner:p.owner,created:p.created,createdBy:p.createdBy,createdDept:p.createdDept,followText:''}\n   :{no:billNo('PJ',D.projects),name:'',cat:'项目支持',stage:(D.stages[0]||{}).name||'',owner:curUser(),created:today(),createdBy:curUser(),createdDept:curDept(),followText:''};\n }\n if(type==='new-task'||type==='edit-task'){\n  const x=id?D.tasks.find(v=>v.id===id):null;\n  return x?{no:x.no,name:x.name,level:String(x.level),parent:'',cat:x.path==='—'?(catNames()[0]||''):x.path,owner:x.owner,partners:x.partners.slice(),priority:x.priority,project:x.project,due:x.due,created:x.created,createdBy:x.createdBy,createdDept:x.createdDept,progressText:''}\n   :{no:billNo('TK',D.tasks),name:'',level:'1',parent:'',cat:catNames()[0]||'',owner:curUser(),partners:[],priority:'中',project:(D.projects[0]||{}).name||'',due:'2026-10-10',created:today(),createdBy:curUser(),createdDept:curDept(),progressText:''};\n }\n if(type==='new-follow')return {no:billNo('FO',D.follows),project:id||(D.projects[0]||{}).name||'',date:today(),person:curUser(),createdBy:curUser(),createdDept:curDept(),content:''};\n if(type==='new-progress')return {no:billNo('PR',D.progresses),task:id||(D.tasks[0]||{}).name||'',date:today(),person:curUser(),status:'进行中',createdBy:curUser(),createdDept:curDept(),content:''};\n if(type==='new-person')return {no:billNo('PS',D.accounts),name:'',phone:'',pwd:'',pwd2:'',pwdSet:false,dept:(D.depts[0]||{}).name||'',status:'启用',funcPerms:PERMS.slice(),dataDepts:deptNames(),createdBy:curUser(),createdDept:curDept()};\n if(type==='edit-person'){\n  const a=D.accounts.find(x=>x.name===id);\n  return a?{no:a.no,name:a.name,phone:a.raw||'',pwd:'',pwd2:'',pwdSet:a.pwdSet,dept:a.dept,status:a.status,funcPerms:a.funcPerms.slice(),dataDepts:a.dataDepts.slice(),createdBy:a.createdBy,createdDept:a.createdDept}\n   :{no:billNo('PS',D.accounts),name:'',phone:'',pwd:'',pwd2:'',pwdSet:false,dept:(D.depts[0]||{}).name||'',status:'启用',funcPerms:PERMS.slice(),dataDepts:deptNames(),createdBy:curUser(),createdDept:curDept()};\n }\n if(type==='new-dept')return {no:billNo('DP',D.depts),code:'',name:'',note:'',status:'启用',createdBy:curUser(),createdDept:curDept()};\n if(type==='edit-dept'){\n  const x=D.depts.find(v=>v.no===id);\n  return x?{no:x.no,code:x.code,name:x.name,note:x.note,status:x.status,createdBy:x.createdBy,createdDept:x.createdDept}\n   :{no:billNo('DP',D.depts),code:'',name:'',note:'',status:'启用',createdBy:curUser(),createdDept:curDept()};\n }\n if(type==='new-cat')return {no:billNo('TC',D.taskCats),name:'',code:'',sort:String(D.taskCats.length+1),createdBy:curUser(),createdDept:curDept()};\n if(type==='edit-cat'){\n  const x=D.taskCats.find(v=>v.no===id);\n  return x?{no:x.no,name:x.name,code:x.code,sort:String(x.sort),createdBy:x.createdBy,createdDept:x.createdDept}\n   :{no:billNo('TC',D.taskCats),name:'',code:'',sort:String(D.taskCats.length+1),createdBy:curUser(),createdDept:curDept()};\n }\n if(type==='new-stage')return {no:billNo('ST',D.stages),name:'',sort:String(D.stages.length+1),createdBy:curUser(),createdDept:curDept()};\n if(type==='edit-stage'){\n  const x=D.stages.find(v=>v.no===id);\n  return x?{no:x.no,name:x.name,sort:String(x.sort),createdBy:x.createdBy,createdDept:x.createdDept}\n   :{no:billNo('ST',D.stages),name:'',sort:String(D.stages.length+1),createdBy:curUser(),createdDept:curDept()};\n }\n return {};\n}\nfunction formDrawer(){\n const f=S.form;if(!f)return '';\n const m=FORM_META[f.type]||{eyebrow:'FORM',title:'表单',ok:'保存',note:''};\n const n=Object.keys(f.errors||{}).length;\n const body=f.type==='new-project'||f.type==='edit-project'?formProject()\n  :f.type==='new-task'||f.type==='edit-task'?formTask()\n  :f.type==='new-follow'?formFollow()\n  :f.type==='new-progress'?formProgress()\n  :f.type==='new-person'||f.type==='edit-person'?formPerson()\n  :f.type==='new-dept'||f.type==='edit-dept'?formDept()\n  :f.type==='new-cat'||f.type==='edit-cat'?formCat():formStage();\n return drawerHead(m.eyebrow,m.title,'\u003cspan class=\"drawer-side\">'+icon('back')+'左侧滑出 · 写操作\u003c/span>')\n +`\u003cdiv class=\"drawer-body\">\n  ${n?'\u003cdiv class=\"notice danger\" role=\"alert\">\u003cstrong>有 '+n+' 个字段需要修正\u003c/strong>：原因已标在对应字段下方，修正后再次保存即可。\u003c/div>':'\u003cdiv class=\"notice\">'+esc(m.note)+'\u003c/div>'}\n  ${body}\n \u003c/div>\n \u003cdiv class=\"drawer-foot\">${act('取消','form-cancel')}${act(m.ok,'form-submit','primary')}\u003c/div>`;\n}\nfunction formProject(){\n const d=S.form.draft,edit=S.form.mode==='edit';\n return `\u003cdiv class=\"form-grid\">\n \u003cdiv class=\"span2\">\u003clabel for=\"fp-name\">项目名称 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  \u003cinput class=\"input${fBad('name')}\" id=\"fp-name\" data-formf=\"name\" value=\"${esc(d.name)}\" maxlength=\"60\" placeholder=\"例如：ICT 客群需求梳理\" autocomplete=\"off\">${fErr('name')}\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">项目名称需唯一；重名时请直接编辑已有项目，不做静默合并。\u003c/p>\u003c/div>\n \u003cdiv>\u003clabel for=\"fp-cat\">项目分类 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  ${choice({id:`fp-cat`,className:`input${fBad('cat')}`,field:`cat`,bindings:{\"formf\":`cat`}},opts(['项目支持','产品建设','战区共建'],d.cat))}${fErr('cat')}\u003c/div>\n \u003cdiv>\u003clabel for=\"fp-stage\">项目阶段 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  \u003cdiv style=\"display:flex;gap:8px\">${choice({id:`fp-stage`,className:`input${fBad('stage')}`,field:`stage`,bindings:{\"formf\":`stage`}},opts(stageNames(),d.stage))}\n   \u003cbutton type=\"button\" class=\"btn\" data-action=\"quick-add-stage\">新建阶段\u003c/button>\u003c/div>${fErr('stage')}\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">阶段为单选；可在下拉内直接新建阶段档案并回填当前项目。\u003c/p>\u003c/div>\n \u003cdiv>\u003clabel for=\"fp-owner\">项目负责人 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  ${choice({id:`fp-owner`,className:`input${fBad('owner')}`,field:`owner`,bindings:{\"formf\":`owner`}},opts(D.people,d.owner))}\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">默认当前登录人员 ${curUser()}，支持修改。\u003c/p>${fErr('owner')}\u003c/div>\n \u003cdiv>\u003clabel for=\"fp-no\">单据编号\u003c/label>\n  \u003cinput class=\"input readonly\" id=\"fp-no\" value=\"${esc(d.no)}\" readonly aria-readonly=\"true\">\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">按「年/月/日 + 四位当日流水」生成，\u003cstrong>唯一且不可修改\u003c/strong>；删除记录后编号随之释放。\u003c/p>\u003c/div>\n \u003cdiv>\u003clabel for=\"fp-created\">创建日期\u003c/label>\n  \u003cinput class=\"input readonly\" id=\"fp-created\" value=\"${esc(d.created)}\" readonly aria-readonly=\"true\">\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">默认当前日期，\u003cstrong>不支持修改\u003c/strong>；编辑不影响原创建日期。\u003c/p>\u003c/div>\n \u003cdiv>\u003clabel for=\"fp-createdby\">创建人 / 创建部门\u003c/label>\n  \u003cinput class=\"input readonly\" id=\"fp-createdby\" value=\"${esc(d.createdBy)} · ${esc(d.createdDept)}\" readonly aria-readonly=\"true\">\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">系统自动记录，随单据永久保留。\u003c/p>\u003c/div>\n \u003cdiv class=\"span2\">\u003clabel for=\"fp-follow\">${edit?'新增项目跟进（可选）':'初始项目跟进（可选）'}\u003c/label>\n  \u003ctextarea class=\"input${fBad('followText')}\" id=\"fp-follow\" data-formf=\"followText\" rows=\"3\" placeholder=\"填写后将同步创建一条项目跟进，并更新该项目的最近跟进日期与最后跟进内容\">${esc(d.followText)}\u003c/textarea>${fErr('followText')}\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">项目跟进与项目档案分离保存；不填写则不创建跟进记录。\u003c/p>\u003c/div>\n \u003c/div>\n \u003cdiv class=\"sec\">\u003ch3>提交后会发生什么\u003c/h3>\n  \u003cdiv class=\"kv\">\u003cstrong>项目档案\u003c/strong>\u003cspan class=\"meta\">写入名称、分类、阶段、负责人；创建日期取首次保存日期，后续编辑不改变\u003c/span>\u003c/div>\n  \u003cdiv class=\"kv\">\u003cstrong>项目跟进\u003c/strong>\u003cspan class=\"meta\">仅在填写了跟进内容时创建 1 条，单据编号由系统按「年/月/日 + 四位流水」自动生成\u003c/span>\u003c/div>\n  \u003cdiv class=\"kv\">\u003cstrong>不会发生\u003c/strong>\u003cspan class=\"meta\">不自动创建任务、不触发 AI 生成、不写回任何周报\u003c/span>\u003c/div>\n \u003c/div>`;\n}\nfunction formTask(){\n const d=S.form.draft,edit=S.form.mode==='edit',lv=Number(d.level);\n const parents=D.tasks.filter(t=>t.level\u003c3&&t.id!==S.form.id);\n const parentOpts=[{value:'',label:'— 不指定上级 —',selected:!d.parent},...parents.map(t=>({value:t.name,label:t.created+'｜'+t.name+'（'+t.level+' 级）',selected:t.name===d.parent}))];\n return `\u003cdiv class=\"form-grid\">\n \u003cdiv class=\"span2\">\u003clabel for=\"ft-name\">任务名称 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  \u003cinput class=\"input${fBad('name')}\" id=\"ft-name\" data-formf=\"name\" value=\"${esc(d.name)}\" maxlength=\"60\" placeholder=\"例如：整理 ICT 客群访谈结论\" autocomplete=\"off\">${fErr('name')}\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">列表展示为 \u003cstrong>创建日期｜任务名称\u003c/strong>；创建日期是独立字段，不属于名称文本。\u003c/p>\u003c/div>\n \u003cdiv>\u003clabel for=\"ft-level\">任务层级 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  ${choice({id:`ft-level`,className:`input${fBad('level')}`,field:`level`,bindings:{\"formf\":`level`}},opts(['1','2','3'],d.level,{1:'1 级任务',2:'2 级任务（可再分一层）',3:'3 级任务 · 最小执行单元'}))}${fErr('level')}\u003c/div>\n \u003cdiv>\u003clabel for=\"ft-parent\">上级任务${lv>1?' \u003cspan class=\"req\">*\u003c/span>':''}\u003c/label>\n  ${choice({id:`ft-parent`,className:`input${fBad('parent')}`,field:`parent`,bindings:{\"formf\":`parent`},disabled:lv===1},parentOpts)}${fErr('parent')}\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">${lv===1?'一级任务无上级，选择器已禁用。':'仅可选择 1、2 级任务作为上级，避免超过三级。'}\u003c/p>\u003c/div>\n \u003cdiv>\u003clabel for=\"ft-cat\">任务分类 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  ${choice({id:`ft-cat`,className:`input${fBad('cat')}`,field:`cat`,bindings:{\"formf\":`cat`}},opts(catNames(),d.cat))}${fErr('cat')}\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">分类档案在「任务管理 → 任务分类」中维护（新增 / 编辑 / 删除）。\u003c/p>\u003c/div>\n \u003cdiv>\u003clabel for=\"ft-owner\">主负责人 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  ${choice({id:`ft-owner`,className:`input${fBad('owner')}`,field:`owner`,bindings:{\"formf\":`owner`}},opts(D.people,d.owner))}${fErr('owner')}\u003c/div>\n \u003cdiv class=\"span2\">\u003clabel id=\"ft-partners-l\">协作者（可多选，不参与负责人判定）\u003c/label>\n  \u003cdiv class=\"checks\" role=\"group\" aria-labelledby=\"ft-partners-l\">\n   ${D.people.map(p=>'\u003clabel>\u003cinput type=\"checkbox\" data-formp=\"'+esc(p)+'\"'+(d.partners.includes(p)?' checked':'')+'>'+esc(p)+'\u003c/label>').join('')}\n  \u003c/div>\u003c/div>\n \u003cdiv>\u003clabel for=\"ft-pri\">优先级 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  ${choice({id:`ft-pri`,className:`input${fBad('priority')}`,field:`priority`,bindings:{\"formf\":`priority`}},opts(['高','中','低'],d.priority))}\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">默认「中」；清单按 高 → 中 → 低 排序。\u003c/p>${fErr('priority')}\u003c/div>\n \u003cdiv>\u003clabel for=\"ft-project\">关联项目 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  ${choice({id:`ft-project`,className:`input${fBad('project')}`,field:`project`,bindings:{\"formf\":`project`}},opts(D.projects.map(p=>p.name),d.project))}${fErr('project')}\u003c/div>\n \u003cdiv>\u003clabel for=\"ft-due\">截止日期 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  \u003cinput type=\"date\" class=\"input${fBad('due')}\" id=\"ft-due\" data-formf=\"due\" value=\"${esc(d.due)}\">${fErr('due')}\u003c/div>\n \u003cdiv>\u003clabel for=\"ft-no\">单据编号\u003c/label>\n  \u003cinput class=\"input readonly\" id=\"ft-no\" value=\"${esc(d.no)}\" readonly aria-readonly=\"true\">\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">按「年/月/日 + 四位当日流水」生成，\u003cstrong>唯一且不可修改\u003c/strong>。\u003c/p>\u003c/div>\n \u003cdiv>\u003clabel for=\"ft-created\">创建日期\u003c/label>\n  \u003cinput class=\"input readonly\" id=\"ft-created\" value=\"${esc(d.created)}\" readonly aria-readonly=\"true\">\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">默认当前日期，\u003cstrong>不支持修改\u003c/strong>。\u003c/p>\u003c/div>\n \u003cdiv>\u003clabel for=\"ft-createdby\">创建人 / 创建部门\u003c/label>\n  \u003cinput class=\"input readonly\" id=\"ft-createdby\" value=\"${esc(d.createdBy)} · ${esc(d.createdDept)}\" readonly aria-readonly=\"true\">\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">系统自动记录。\u003c/p>\u003c/div>\n \u003cdiv class=\"span2\">\u003clabel for=\"ft-progress\">${edit?'补充一条任务进度（可选）':'初始任务进度（可选）'}\u003c/label>\n  \u003ctextarea class=\"input\" id=\"ft-progress\" data-formf=\"progressText\" rows=\"3\" placeholder=\"填写后将追加一条任务进度记录，并更新任务的最新任务进度\">${esc(d.progressText)}\u003c/textarea>\u003c/div>\n \u003c/div>\n \u003cdiv class=\"sec\">\u003ch3>三级结构校验\u003c/h3>\n  \u003cp class=\"meta\" style=\"margin:0\">三级为最小执行单元，系统不提供四级入口；把已有任务调整为上级时，先校核其下级是否会超过三级。\u003c/p>\u003c/div>`;\n}\nfunction formFollow(){\n const d=S.form.draft;\n return `\u003cdiv class=\"form-grid\">\n \u003cdiv>\u003clabel for=\"ff-project\">关联项目 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  ${choice({id:`ff-project`,className:`input${fBad('project')}`,field:`project`,bindings:{\"formf\":`project`}},opts(D.projects.map(p=>p.name),d.project))}${fErr('project')}\u003c/div>\n \u003cdiv>\u003clabel for=\"ff-date\">跟进日期 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  \u003cinput type=\"date\" class=\"input${fBad('date')}\" id=\"ff-date\" data-formf=\"date\" value=\"${esc(d.date)}\">${fErr('date')}\u003c/div>\n \u003cdiv>\u003clabel for=\"ff-person\">跟进人员 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  ${choice({id:`ff-person`,className:`input${fBad('person')}`,field:`person`,bindings:{\"formf\":`person`}},opts(D.people,d.person))}\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">默认当前登录人员 ${curUser()}，支持代填。\u003c/p>${fErr('person')}\u003c/div>\n \u003cdiv>\u003clabel for=\"ff-no\">单据编号\u003c/label>\n  \u003cinput class=\"input readonly\" id=\"ff-no\" value=\"${esc(d.no)}\" readonly aria-readonly=\"true\">\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">按「年/月/日 + 四位当日流水」在保存时生成并校验唯一；周报同步按该编号去重，删除后编号随之释放。\u003c/p>\u003c/div>\n \u003cdiv>\u003clabel for=\"ff-createdby\">创建人 / 创建部门\u003c/label>\n  \u003cinput class=\"input readonly\" id=\"ff-createdby\" value=\"${esc(d.createdBy)} · ${esc(d.createdDept)}\" readonly aria-readonly=\"true\">\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">系统自动记录，不可修改。\u003c/p>\u003c/div>\n \u003cdiv class=\"span2\">\u003clabel for=\"ff-content\">跟进内容 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  \u003ctextarea class=\"input${fBad('content')}\" id=\"ff-content\" data-formf=\"content\" rows=\"5\" placeholder=\"填写本次项目跟进的具体内容、结论与下一步安排\">${esc(d.content)}\u003c/textarea>${fErr('content')}\u003c/div>\n \u003c/div>\n \u003cdiv class=\"sec\">\u003ch3>提交后会发生什么\u003c/h3>\n  \u003cdiv class=\"kv\">\u003cstrong>项目跟进\u003c/strong>\u003cspan class=\"meta\">新增 1 条记录，可在左侧「项目跟进查询」中按项目 / 日期 / 人员 / 内容检索\u003c/span>\u003c/div>\n  \u003cdiv class=\"kv\">\u003cstrong>项目档案\u003c/strong>\u003cspan class=\"meta\">自动更新该项目的「最近跟进日期」与「最后跟进内容」为本次记录\u003c/span>\u003c/div>\n  \u003cdiv class=\"kv\">\u003cstrong>周报同步\u003c/strong>\u003cspan class=\"meta\">进入周报「数据获取」的候选来源池；是否同步由周报填写人决定，同步动作不回写本条\u003c/span>\u003c/div>\n \u003c/div>`;\n}\nfunction formProgress(){\n const d=S.form.draft;\n const cur=D.tasks.find(t=>t.name===d.task);\n return `\u003cdiv class=\"form-grid\">\n \u003cdiv class=\"span2\">\u003clabel for=\"fpj-task\">选择任务 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  ${choice({id:`fpj-task`,className:`input${fBad('task')}`,field:`task`,bindings:{\"formf\":`task`}},opts(D.tasks.map(t=>t.name),d.task))}${fErr('task')}\n  ${cur?'\u003cp class=\"hint\" style=\"margin:4px 0 0\">当前：'+cur.created+'｜'+esc(cur.name)+' · 负责人 '+esc(cur.owner)+' · 关联项目 '+esc(cur.project)+' · 截止 '+cur.due+'\u003c/p>':''}\u003c/div>\n \u003cdiv>\u003clabel for=\"fpj-date\">跟进日期 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  \u003cinput type=\"date\" class=\"input${fBad('date')}\" id=\"fpj-date\" data-formf=\"date\" value=\"${esc(d.date)}\">${fErr('date')}\u003c/div>\n \u003cdiv>\u003clabel for=\"fpj-person\">填写人员 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  ${choice({id:`fpj-person`,className:`input${fBad('person')}`,field:`person`,bindings:{\"formf\":`person`}},opts(D.people,d.person))}\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">默认当前登录人员 ${curUser()}。\u003c/p>${fErr('person')}\u003c/div>\n \u003cdiv>\u003clabel for=\"fpj-status\">任务状态（同步更新）\u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  ${choice({id:`fpj-status`,className:`input${fBad('status')}`,field:`status`,bindings:{\"formf\":`status`}},opts(['未开始','进行中','已完成'],d.status))}\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">标记「已完成」需说明完成情况；重新打开需填写原因。\u003c/p>${fErr('status')}\u003c/div>\n \u003cdiv>\u003clabel for=\"fpj-no\">单据编号\u003c/label>\n  \u003cinput class=\"input readonly\" id=\"fpj-no\" value=\"${esc(d.no)}\" readonly aria-readonly=\"true\">\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">按「年/月/日 + 四位当日流水」在保存时生成并校验唯一；周报同步按该编号去重，删除后编号随之释放。\u003c/p>\u003c/div>\n \u003cdiv>\u003clabel for=\"fpj-createdby\">创建人 / 创建部门\u003c/label>\n  \u003cinput class=\"input readonly\" id=\"fpj-createdby\" value=\"${esc(d.createdBy)} · ${esc(d.createdDept)}\" readonly aria-readonly=\"true\">\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">系统自动记录，不可修改。\u003c/p>\u003c/div>\n \u003cdiv class=\"span2\">\u003clabel for=\"fpj-content\">进度内容 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  \u003ctextarea class=\"input${fBad('content')}\" id=\"fpj-content\" data-formf=\"content\" rows=\"5\" placeholder=\"填写本次任务推进情况、产出与阻塞\">${esc(d.content)}\u003c/textarea>${fErr('content')}\u003c/div>\n \u003c/div>\n \u003cdiv class=\"sec\">\u003ch3>提交后会发生什么\u003c/h3>\n  \u003cdiv class=\"kv\">\u003cstrong>任务进度\u003c/strong>\u003cspan class=\"meta\">追加 1 条进度记录并保留全部历史，不覆盖上一条\u003c/span>\u003c/div>\n  \u003cdiv class=\"kv\">\u003cstrong>任务档案\u003c/strong>\u003cspan class=\"meta\">「最新任务进度」与「任务状态」更新为本次内容\u003c/span>\u003c/div>\n  \u003cdiv class=\"kv\">\u003cstrong>周报同步\u003c/strong>\u003cspan class=\"meta\">进入周报「数据获取」的候选来源池，同步不回写本条\u003c/span>\u003c/div>\n \u003c/div>`;\n}\nfunction formPerson(){\n const d=S.form.draft,edit=S.form.mode==='edit';\n return `\u003cdiv class=\"form-grid\">\n \u003cdiv>\u003clabel for=\"fa-name\">人员姓名 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  \u003cinput class=\"input${fBad('name')}\" id=\"fa-name\" data-formf=\"name\" value=\"${esc(d.name)}\" maxlength=\"20\" placeholder=\"填写真实姓名\" autocomplete=\"off\">${fErr('name')}\u003c/div>\n \u003cdiv>\u003clabel for=\"fa-phone\">手机号 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  \u003cinput class=\"input${fBad('phone')}\" id=\"fa-phone\" data-formf=\"phone\" value=\"${esc(d.phone)}\" inputmode=\"numeric\" maxlength=\"11\" placeholder=\"11 位手机号，作为登录账号\" autocomplete=\"off\">${fErr('phone')}\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">手机号即登录账号，需唯一。\u003c/p>\u003c/div>\n \u003cdiv>\u003clabel for=\"fa-dept\">归属部门 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  ${choice({id:`fa-dept`,className:`input${fBad('dept')}`,field:`dept`,bindings:{\"formf\":`dept`}},opts(deptNames(),d.dept))}${fErr('dept')}\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">\u003cstrong>必填\u003c/strong>：归属部门决定该人员新增数据时记录的「创建部门」。\u003c/p>\u003c/div>\n \u003cdiv>\u003clabel for=\"fa-status\">账号状态 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  ${choice({id:`fa-status`,className:`input${fBad('status')}`,field:`status`,bindings:{\"formf\":`status`}},opts(['启用','停用'],d.status,{启用:'启用（可登录）',停用:'停用（不可登录）'}))}${fErr('status')}\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">登录时必须校验状态，\u003cstrong>停用不可登录\u003c/strong>。\u003c/p>\u003c/div>\n \u003cdiv>\u003clabel for=\"fa-pwd\">设置密码 ${edit?'（留空不修改）':'\u003cspan class=\"req\">*\u003c/span>'}\u003c/label>\n  \u003cinput type=\"password\" class=\"input${fBad('pwd')}\" id=\"fa-pwd\" data-formf=\"pwd\" value=\"${esc(d.pwd)}\" placeholder=\"${edit?'留空表示本次不修改密码':'至少 8 位，需含字母与数字'}\" autocomplete=\"new-password\">${fErr('pwd')}\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">当前密码：${d.pwdSet?'\u003cspan class=\"src-id\" style=\"margin:0\">••••••••\u003c/span> 已加密存储':'\u003cspan style=\"color:var(--warn)\">未设置\u003c/span>'}（密文展示，任何情况下不回显明文）\u003c/p>\u003c/div>\n \u003cdiv>\u003clabel for=\"fa-pwd2\">确认密码 ${edit?'':'\u003cspan class=\"req\">*\u003c/span>'}\u003c/label>\n  \u003cinput type=\"password\" class=\"input${fBad('pwd2')}\" id=\"fa-pwd2\" data-formf=\"pwd2\" value=\"${esc(d.pwd2)}\" placeholder=\"再次输入以确认\" autocomplete=\"new-password\">${fErr('pwd2')}\u003c/div>\n \u003cdiv>\u003clabel for=\"fa-no\">单据编号\u003c/label>\n  \u003cinput class=\"input readonly\" id=\"fa-no\" value=\"${esc(d.no)}\" readonly aria-readonly=\"true\">\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">按「年/月/日 + 四位当日流水」生成，唯一且不可修改。\u003c/p>\u003c/div>\n \u003cdiv>\u003clabel for=\"fa-createdby\">创建人 / 创建部门\u003c/label>\n  \u003cinput class=\"input readonly\" id=\"fa-createdby\" value=\"${esc(d.createdBy)} · ${esc(d.createdDept)}\" readonly aria-readonly=\"true\">\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">系统自动记录。\u003c/p>\u003c/div>\n \u003cdiv class=\"span2\">\u003clabel id=\"fa-func-l\">功能权限 \u003cspan class=\"req\">*\u003c/span>（默认全部勾选）\u003c/label>\n  \u003cdiv class=\"checks\" role=\"group\" aria-labelledby=\"fa-func-l\">\n   ${PERMS.map(p=>'\u003clabel>\u003cinput type=\"checkbox\" data-formfp=\"'+esc(p)+'\"'+(d.funcPerms.includes(p)?' checked':'')+'>'+esc(p)+'\u003c/label>').join('')}\n  \u003c/div>${fErr('funcPerms')}\n  \u003cp class=\"hint\" style=\"margin:8px 0 0\">新增人员默认拥有\u003cstrong>全部功能权限\u003c/strong>；按岗裁剪时取消勾选对应模块即可。\u003c/p>\u003c/div>\n \u003cdiv class=\"span2\">\u003clabel id=\"fa-data-l\">数据权限 · 可见部门范围 \u003cspan class=\"req\">*\u003c/span>（默认全部）\u003c/label>\n  \u003cdiv class=\"checks\" role=\"group\" aria-labelledby=\"fa-data-l\">\n   ${D.depts.map(x=>'\u003clabel>\u003cinput type=\"checkbox\" data-formdp=\"'+esc(x.name)+'\"'+(d.dataDepts.includes(x.name)?' checked':'')+'>'+esc(x.name)+'\u003c/label>').join('')}\n  \u003c/div>${fErr('dataDepts')}\n  \u003cp class=\"hint\" style=\"margin:8px 0 0\">数据权限按\u003cstrong>部门\u003c/strong>授予：勾选哪些部门，该人员即可查看这些部门的项目、任务、周报与人员档案。\u003c/p>\u003c/div>\n \u003c/div>\n \u003cdiv class=\"notice warn\" style=\"margin-top:16px\">\u003cstrong>安全边界\u003c/strong>：密码不落明文、不回显、不写入演示数据，界面仅以密文占位呈现；正式实现必须由服务端加盐哈希存储，并对连续失败登录做限流与临时锁定。受控重置后默认口令为 \u003cstrong>112233\u003c/strong>，并要求本人首次登录后强制修改。手机号 + 密码认证能力\u003cstrong>待 WorkBuddy 平台验证\u003c/strong>。\u003c/div>\n \u003cdiv class=\"sec\">\u003ch3>权限模型说明\u003c/h3>\n  \u003cdiv class=\"kv\">\u003cstrong>默认策略\u003c/strong>\u003cspan class=\"meta\">新增人员默认拥有全部功能权限与全部部门数据权限（默认全部权限），无需逐项授权即可开始工作\u003c/span>\u003c/div>\n  \u003cdiv class=\"kv\">\u003cstrong>功能权限\u003c/strong>\u003cspan class=\"meta\">控制可进入的模块；取消勾选后该模块入口对本人不可用\u003c/span>\u003c/div>\n  \u003cdiv class=\"kv\">\u003cstrong>数据权限\u003c/strong>\u003cspan class=\"meta\">按部门授予可见范围；未勾选的部门数据对本人不可见\u003c/span>\u003c/div>\n  \u003cdiv class=\"kv\">\u003cstrong>业务默认值\u003c/strong>\u003cspan class=\"meta\">该人员登录后，业务人员字段默认本人；创建部门取归属部门\u003c/span>\u003c/div>\n \u003c/div>`;\n}\nfunction formDept(){\n const d=S.form.draft;\n return `\u003cdiv class=\"form-grid\">\n \u003cdiv>\u003clabel for=\"fd-code\">部门编码 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  \u003cinput class=\"input${fBad('code')}\" id=\"fd-code\" data-formf=\"code\" value=\"${esc(d.code)}\" maxlength=\"20\" placeholder=\"例如：D-ICT\" autocomplete=\"off\">${fErr('code')}\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">全局唯一，建议使用大写字母、数字与连字符。\u003c/p>\u003c/div>\n \u003cdiv>\u003clabel for=\"fd-name\">部门名称 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  \u003cinput class=\"input${fBad('name')}\" id=\"fd-name\" data-formf=\"name\" value=\"${esc(d.name)}\" maxlength=\"30\" placeholder=\"例如：ICT 行业部\" autocomplete=\"off\">${fErr('name')}\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">不可重复；作为人员归属与数据权限的取值来源。\u003c/p>\u003c/div>\n \u003cdiv>\u003clabel for=\"fd-status\">状态 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  ${choice({id:`fd-status`,className:`input${fBad('status')}`,field:`status`,bindings:{\"formf\":`status`}},opts(['启用','停用'],d.status))}${fErr('status')}\u003c/div>\n \u003cdiv>\u003clabel for=\"fd-no\">单据编号\u003c/label>\n  \u003cinput class=\"input readonly\" id=\"fd-no\" value=\"${esc(d.no)}\" readonly aria-readonly=\"true\">\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">按「年/月/日 + 四位当日流水」生成，唯一且不可修改。\u003c/p>\u003c/div>\n \u003cdiv>\u003clabel for=\"fd-createdby\">创建人 / 创建部门\u003c/label>\n  \u003cinput class=\"input readonly\" id=\"fd-createdby\" value=\"${esc(d.createdBy)} · ${esc(d.createdDept)}\" readonly aria-readonly=\"true\">\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">系统自动记录。\u003c/p>\u003c/div>\n \u003cdiv class=\"span2\">\u003clabel for=\"fd-note\">部门说明\u003c/label>\n  \u003ctextarea class=\"input\" id=\"fd-note\" data-formf=\"note\" rows=\"3\" placeholder=\"部门职责与使用范围，可留空\">${esc(d.note)}\u003c/textarea>\u003c/div>\n \u003c/div>\n \u003cdiv class=\"sec\">\u003ch3>删除约束\u003c/h3>\n  \u003cp class=\"meta\" style=\"margin:0\">部门下存在在编人员或已产生业务数据时不可直接删除；需先将人员与数据归属转移到其他部门。批量删除须逐项返回成功 / 失败明细。\u003c/p>\u003c/div>`;\n}\nfunction formCat(){\n const d=S.form.draft;\n return `\u003cdiv class=\"form-grid\">\n \u003cdiv>\u003clabel for=\"fc-name\">分类名称 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  \u003cinput class=\"input${fBad('name')}\" id=\"fc-name\" data-formf=\"name\" value=\"${esc(d.name)}\" maxlength=\"20\" placeholder=\"例如：客户研究\" autocomplete=\"off\">${fErr('name')}\u003c/div>\n \u003cdiv>\u003clabel for=\"fc-code\">分类编码 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  \u003cinput class=\"input${fBad('code')}\" id=\"fc-code\" data-formf=\"code\" value=\"${esc(d.code)}\" maxlength=\"12\" placeholder=\"例如：C-01\" autocomplete=\"off\">${fErr('code')}\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">用于排序与报表分组，需唯一。\u003c/p>\u003c/div>\n \u003cdiv>\u003clabel for=\"fc-sort\">排序 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  \u003cinput type=\"number\" class=\"input${fBad('sort')}\" id=\"fc-sort\" data-formf=\"sort\" min=\"1\" max=\"999\" value=\"${esc(d.sort)}\">${fErr('sort')}\u003c/div>\n \u003cdiv>\u003clabel for=\"fc-no\">单据编号\u003c/label>\n  \u003cinput class=\"input readonly\" id=\"fc-no\" value=\"${esc(d.no)}\" readonly aria-readonly=\"true\">\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">按「年/月/日 + 四位当日流水」生成，唯一且不可修改。\u003c/p>\u003c/div>\n \u003cdiv>\u003clabel for=\"fc-createdby\">创建人 / 创建部门\u003c/label>\n  \u003cinput class=\"input readonly\" id=\"fc-createdby\" value=\"${esc(d.createdBy)} · ${esc(d.createdDept)}\" readonly aria-readonly=\"true\">\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">系统自动记录。\u003c/p>\u003c/div>\n \u003c/div>\n \u003cdiv class=\"sec\">\u003ch3>删除约束\u003c/h3>\n  \u003cp class=\"meta\" style=\"margin:0\">已被任务使用的分类不可删除；需先解除关联，历史任务保留原分类名称快照。\u003c/p>\u003c/div>`;\n}\nfunction formStage(){\n const d=S.form.draft;\n return `\u003cdiv class=\"form-grid\">\n \u003cdiv>\u003clabel for=\"fs-name\">阶段名称 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  \u003cinput class=\"input${fBad('name')}\" id=\"fs-name\" data-formf=\"name\" value=\"${esc(d.name)}\" maxlength=\"20\" placeholder=\"例如：试点验证\" autocomplete=\"off\">${fErr('name')}\u003c/div>\n \u003cdiv>\u003clabel for=\"fs-sort\">排序 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\n  \u003cinput type=\"number\" class=\"input${fBad('sort')}\" id=\"fs-sort\" data-formf=\"sort\" min=\"1\" max=\"999\" value=\"${esc(d.sort)}\">${fErr('sort')}\u003c/div>\n \u003cdiv>\u003clabel for=\"fs-no\">单据编号\u003c/label>\n  \u003cinput class=\"input readonly\" id=\"fs-no\" value=\"${esc(d.no)}\" readonly aria-readonly=\"true\">\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">按「年/月/日 + 四位当日流水」生成，唯一且不可修改。\u003c/p>\u003c/div>\n \u003cdiv>\u003clabel for=\"fs-createdby\">创建人 / 创建部门\u003c/label>\n  \u003cinput class=\"input readonly\" id=\"fs-createdby\" value=\"${esc(d.createdBy)} · ${esc(d.createdDept)}\" readonly aria-readonly=\"true\">\n  \u003cp class=\"hint\" style=\"margin:4px 0 0\">系统自动记录。\u003c/p>\u003c/div>\n \u003c/div>\n \u003cdiv class=\"sec\">\u003ch3>删除约束\u003c/h3>\n  \u003cp class=\"meta\" style=\"margin:0\">已被项目使用的阶段不可删除；需先解除项目关联，批量删除逐项校验并返回成功 / 失败明细。\u003c/p>\u003c/div>`;\n}\nfunction validateForm(){\n const f=S.form,d=f.draft,e={};\n if(f.type==='new-project'||f.type==='edit-project'){\n  const n=(d.name||'').trim();\n  if(!n)e.name='项目名称为必填项。';\n  else if(D.projects.some(p=>p.name===n&&p.id!==f.id))e.name='项目名称已存在，请改用其他名称或直接编辑已有项目。';\n  else if(n.length\u003c2)e.name='项目名称过短，请填写可识别的完整名称。';\n  if(!d.cat)e.cat='请选择项目分类。';\n  if(!d.stage)e.stage='请选择项目阶段；可在下拉内直接新建阶段。';\n  if(!d.owner)e.owner='请选择项目负责人。';\n  if((d.followText||'').length>500)e.followText='项目跟进内容请控制在 500 字以内。';\n }\n if(f.type==='new-task'||f.type==='edit-task'){\n  const n=(d.name||'').trim();\n  if(!n)e.name='任务名称为必填项。';\n  else if(D.tasks.some(t=>t.name===n&&t.id!==f.id))e.name='任务名称已存在，请改用其他名称。';\n  const lv=Number(d.level);\n  if(!(lv>=1&&lv\u003c=3))e.level='任务层级只能是 1、2、3 级。';\n  if(lv>1&&!d.parent)e.parent=lv===3?'三级任务必须归属上级任务，请选择上级：否则无法确定其在三级结构中的位置。':'二级任务请指定上级任务。';\n  if(lv===3&&d.parent){const pt=D.tasks.find(t=>t.name===d.parent);if(pt&&pt.level>=3)e.parent='所选上级已是三级任务，不能再作为父级（三级为上限）。'}\n  if(!d.cat)e.cat='请选择任务分类。';\n  if(!d.owner)e.owner='请选择主负责人。';\n  if(!d.priority)e.priority='请选择优先级。';\n  if(!d.project)e.project='请选择关联项目。';\n  if(!d.due)e.due='请选择截止日期。';\n  else if(d.due\u003cd.created)e.due='截止日期不能早于创建日期 '+d.created+'。';\n }\n if(f.type==='new-follow'){\n  if(!d.project)e.project='请选择关联项目。';\n  if(!d.date)e.date='请选择跟进日期。';\n  else if(d.date>today())e.date='跟进日期不能晚于今天（'+today()+'）。';\n  if(!d.person)e.person='请选择跟进人员。';\n  const c=(d.content||'').trim();\n  if(!c)e.content='跟进内容为必填项：缺少内容无法形成有效跟进记录。';\n  else if(c.length\u003c4)e.content='跟进内容过短，请补充具体进展与结论。';\n }\n if(f.type==='new-progress'){\n  if(!d.task)e.task='请选择任务。';\n  if(!d.date)e.date='请选择跟进日期。';\n  else if(d.date>today())e.date='进度日期不能晚于今天（'+today()+'）。';\n  if(!d.person)e.person='请选择填写人员。';\n  if(!d.status)e.status='请选择任务状态。';\n  const c=(d.content||'').trim();\n  if(!c)e.content=d.status==='已完成'?'标记为已完成时必须填写完成说明。':'进度内容为必填项。';\n  else if(c.length\u003c4)e.content='进度内容过短，请补充具体产出与阻塞。';\n }\n if(f.type==='new-person'||f.type==='edit-person'){\n  const n=(d.name||'').trim(),edit=f.mode==='edit';\n  if(!n)e.name='人员姓名为必填项。';\n  else if(D.accounts.some(a=>a.name===n&&a.name!==f.id))e.name='该姓名已存在，请确认是否重复添加。';\n  const ph=(d.phone||'').trim();\n  if(!ph)e.phone='手机号为必填项：手机号即登录账号。';\n  else if(!/^1[3-9]\\d{9}$/.test(ph))e.phone='手机号格式不正确，应为 1 开头的 11 位数字。';\n  else if(D.accounts.some(a=>(a.raw||'')===ph&&a.name!==f.id))e.phone='该手机号已被其他人员使用，一个手机号只能对应一个人员。';\n  if(!d.dept)e.dept='归属部门为必填项：人员必须归属一个部门。';\n  if(!d.status)e.status='请选择账号状态。';\n  if(!d.funcPerms||!d.funcPerms.length)e.funcPerms='至少保留一项功能权限；如确需停用该账号，请改用「账号状态」。';\n  if(!d.dataDepts||!d.dataDepts.length)e.dataDepts='至少选择一个可见部门作为数据权限范围。';\n  const pw=d.pwd||'';\n  if(!pw){if(!edit)e.pwd='设置密码为必填项。'}\n  else{\n   if(pw.length\u003c8)e.pwd='密码长度至少 8 位。';\n   else if(!(/[A-Za-z]/.test(pw)&&/\\d/.test(pw)))e.pwd='密码需同时包含字母与数字。';\n   if((d.pwd2||'')!==pw)e.pwd2='两次输入的密码不一致。';\n  }\n }\n if(f.type==='new-dept'||f.type==='edit-dept'){\n  const c=(d.code||'').trim().toUpperCase(),n=(d.name||'').trim();\n  if(!c)e.code='部门编码为必填项。';\n  else if(!/^[A-Za-z0-9-]{2,20}$/.test(c))e.code='部门编码只能使用字母、数字与连字符，长度 2–20。';\n  else if(D.depts.some(x=>String(x.code).toUpperCase()===c&&x.no!==f.id))e.code='部门编码已存在，请改用其他编码。';\n  if(!n)e.name='部门名称为必填项。';\n  else if(D.depts.some(x=>x.name===n&&x.no!==f.id))e.name='部门名称已存在，请改用其他名称。';\n  if(!d.status)e.status='请选择状态。';\n }\n if(f.type==='new-cat'||f.type==='edit-cat'){\n  const n=(d.name||'').trim(),c=(d.code||'').trim();\n  if(!n)e.name='分类名称为必填项。';\n  else if(D.taskCats.some(x=>x.name===n&&x.no!==f.id))e.name='分类名称已存在，请改用其他名称。';\n  if(!c)e.code='分类编码为必填项。';\n  else if(D.taskCats.some(x=>x.code===c&&x.no!==f.id))e.code='分类编码已存在，请改用其他编码。';\n  if(!(Number(d.sort)>=1))e.sort='排序需为不小于 1 的数字。';\n }\n if(f.type==='new-stage'||f.type==='edit-stage'){\n  const n=(d.name||'').trim();\n  if(!n)e.name='阶段名称为必填项。';\n  else if(D.stages.some(x=>x.name===n&&x.no!==f.id))e.name='阶段名称已存在，请直接在下拉中选用，不做重复创建。';\n  if(!(Number(d.sort)>=1))e.sort='排序需为不小于 1 的数字。';\n }\n return e;\n}\nfunction addFollowRec(project,date,person,content,createdBy,createdDept){\n const no=billNo('FO',D.follows,date);\n const rec={no:no,project:project,date:date,person:person,content:content,createdBy:createdBy||person,createdDept:createdDept||curDept()};\n D.follows.push(rec);\n D.syncPool.push({no:rec.no,type:'项目跟进',project:project,person:person,date:date,text:content});\n return rec;\n}\nfunction addProgressRec(task,date,person,content,status,createdBy,createdDept){\n const no=billNo('PR',D.progresses,date);\n const rec={no:no,task:task,date:date,person:person,content:content,status:status,createdBy:createdBy||person,createdDept:createdDept||curDept()};\n D.progresses.push(rec);\n D.syncPool.push({no:rec.no,type:'任务进度',project:(D.tasks.find(t=>t.name===task)||{}).project||'—',person:person,date:date,text:content});\n return rec;\n}\nfunction submitForm(){\n const f=S.form;if(!f)return;\n f.errors=validateForm();\n const bad=Object.keys(f.errors);\n if(bad.length){\n  renderOverlay();\n  const first=document.querySelector('#drawer .input.bad');\n  if(first)first.focus();\n  notify('校验未通过：'+bad.length+' 个字段需要修正，原因已标在字段下方。本次未写入任何数据。');\n  return;\n }\n const d=f.draft,ty=f.type;\n if(ty==='new-project'||ty==='edit-project'){\n  let extra='';\n  if(f.mode==='edit'){\n   const p=D.projects.find(x=>x.id===f.id);\n   if(p){\n    const old=p.name,now=d.name.trim();\n    p.name=now;p.cat=d.cat;p.stage=d.stage;p.owner=d.owner;\n    if(old!==now){D.tasks.forEach(t=>{if(t.project===old)t.project=now});D.follows.forEach(x=>{if(x.project===old)x.project=now})}\n   }\n  }else{\n   const nid='P'+String(D.projects.length+1).padStart(2,'0');\n   const no=noUnique(D.projects,d.no)?d.no:billNo('PJ',D.projects);\n   D.projects.push({no:no,id:nid,name:d.name.trim(),cat:d.cat,stage:d.stage,owner:d.owner,computed:null,override:null,reason:'',created:d.created,createdBy:curUser(),createdDept:curDept()});\n  }\n  if((d.followText||'').trim()){const fr=addFollowRec(d.name.trim(),today(),d.owner,d.followText.trim());extra='，并创建 1 条项目跟进（单据编号 '+fr.no+'）'}\n  closeForm();\n  notify('项目已'+(f.mode==='edit'?'保存':'创建')+'（演示）：单据编号 '+d.no+'，创建日期 '+d.created+' 不受编辑影响'+extra+'。');\n  return;\n }\n if(ty==='new-task'||ty==='edit-task'){\n  const lv=Number(d.level);\n  let extra='';\n  if(f.mode==='edit'){\n   const t=D.tasks.find(x=>x.id===f.id);\n   if(t){\n    const old=t.name,now=d.name.trim();\n    t.name=now;t.level=lv;t.priority=d.priority;t.owner=d.owner;t.partners=d.partners.slice();t.project=d.project;t.due=d.due;t.path=d.cat||'—';\n    if(old!==now)D.progresses.forEach(p=>{if(p.task===old)p.task=now});\n   }\n  }else{\n   const nid='T'+String(D.tasks.length+1).padStart(2,'0');\n   const no=noUnique(D.tasks,d.no)?d.no:billNo('TK',D.tasks);\n   D.tasks.push({no:no,id:nid,name:d.name.trim(),created:d.created,priority:d.priority,owner:d.owner,partners:d.partners.slice(),project:d.project,status:'未开始',latest:'尚未填写任务进度',due:d.due,level:lv,path:d.cat||'—',createdBy:curUser(),createdDept:curDept()});\n  }\n  if((d.progressText||'').trim()){const pr=addProgressRec(d.name.trim(),today(),d.owner,d.progressText.trim(),'未开始');extra='，并追加 1 条任务进度（单据编号 '+pr.no+'）'}\n  closeForm();\n  notify('任务已'+(f.mode==='edit'?'保存':'创建')+'（演示）：单据编号 '+d.no+'，'+d.created+'｜'+d.name.trim()+'，层级 '+lv+' 级，优先级'+d.priority+extra+'。');\n  return;\n }\n if(ty==='new-follow'){\n  const rec=addFollowRec(d.project,d.date,d.person,d.content.trim(),curUser(),curDept());\n  closeForm();\n  if(S.nav==='follows')render();\n  notify('项目跟进已提交（演示）：单据编号 '+rec.no+'；已同步更新「'+d.project+'」的最近跟进日期与最后跟进内容。');\n  return;\n }\n if(ty==='new-progress'){\n  const t=D.tasks.find(x=>x.name===d.task);\n  const rec=addProgressRec(d.task,d.date,d.person,d.content.trim(),d.status,curUser(),curDept());\n  if(t){t.status=d.status;t.latest=d.content.trim()}\n  closeForm();\n  notify('任务进度已提交（演示）：单据编号 '+rec.no+'；任务「'+d.task+'」状态更新为'+d.status+'，历史记录保留 '+D.progresses.filter(p=>p.task===d.task).length+' 条。');\n  return;\n }\n if(ty==='new-person'||ty==='edit-person'){\n  const nm=d.name.trim(),ph=d.phone.trim(),pw=d.pwd||'';\n  if(f.mode==='edit'){\n   const a=D.accounts.find(x=>x.name===f.id);\n   if(a){a.name=nm;a.phone=ph.slice(0,3)+'****'+ph.slice(7);a.raw=ph;\n    a.dept=d.dept;a.status=d.status;a.funcPerms=d.funcPerms.slice();a.dataDepts=d.dataDepts.slice();\n    if(pw){a.pwdSet=true}\n    const i=D.people.indexOf(f.id);if(i>=0)D.people[i]=nm;\n    D.projects.forEach(p=>{if(p.owner===f.id)p.owner=nm});\n    D.tasks.forEach(t=>{if(t.owner===f.id)t.owner=nm;const j=t.partners.indexOf(f.id);if(j>=0)t.partners[j]=nm});\n    D.follows.forEach(x=>{if(x.person===f.id)x.person=nm});\n    D.progresses.forEach(x=>{if(x.person===f.id)x.person=nm});\n   }\n  }else{\n   D.accounts.push({no:noUnique(D.accounts,d.no)?d.no:billNo('PS',D.accounts),name:nm,phone:ph.slice(0,3)+'****'+ph.slice(7),raw:ph,dept:d.dept,status:d.status,pwdSet:!!pw,funcPerms:d.funcPerms.slice(),dataDepts:d.dataDepts.slice(),created:today(),createdBy:curUser(),createdDept:curDept()});\n   if(D.people.indexOf(nm)\u003c0)D.people.push(nm);\n  }\n  const warn=d.status==='停用'?'　该账号为停用状态，将无法登录。':'';\n  closeForm();\n  notify('人员已'+(f.mode==='edit'?'保存':'新增')+'（演示）：'+d.no+' · '+nm+'；归属部门 '+d.dept+'，功能权限 '+d.funcPerms.length+'/'+PERMS.length+' 项，数据权限 '+d.dataDepts.length+' 个部门。密码不落明文、不写入演示数据。'+warn);\n  return;\n }\n if(ty==='new-dept'||ty==='edit-dept'){\n  if(f.mode==='edit'){\n   const x=D.depts.find(v=>v.no===f.id);\n   if(x){const old=x.name;x.code=d.code.trim().toUpperCase();x.name=d.name.trim();x.note=d.note.trim();x.status=d.status;\n    if(old!==x.name){D.accounts.forEach(a=>{if(a.dept===old)a.dept=x.name});D.projects.forEach(p=>{if(p.createdDept===old)p.createdDept=x.name})}}\n  }else{\n   D.depts.push({no:noUnique(D.depts,d.no)?d.no:billNo('DP',D.depts),code:d.code.trim().toUpperCase(),name:d.name.trim(),note:d.note.trim(),status:d.status,created:today(),createdBy:curUser(),createdDept:curDept()});\n  }\n  closeForm();render();\n  notify('部门已'+(f.mode==='edit'?'保存':'新增')+'（演示）：'+d.no+' · '+d.name.trim()+'（编码 '+d.code.trim().toUpperCase()+'）。');\n  return;\n }\n if(ty==='new-cat'||ty==='edit-cat'){\n  if(f.mode==='edit'){\n   const x=D.taskCats.find(v=>v.no===f.id);\n   if(x){const old=x.name;x.name=d.name.trim();x.code=d.code.trim();x.sort=Number(d.sort);\n    if(old!==x.name)D.tasks.forEach(t=>{if(t.path===old)t.path=x.name})}\n  }else{\n   D.taskCats.push({no:noUnique(D.taskCats,d.no)?d.no:billNo('TC',D.taskCats),name:d.name.trim(),code:d.code.trim(),sort:Number(d.sort),created:today(),createdBy:curUser(),createdDept:curDept()});\n  }\n  closeForm();render();\n  notify('任务分类已'+(f.mode==='edit'?'保存':'新增')+'（演示）：'+d.no+' · '+d.name.trim()+'（编码 '+d.code.trim()+'，排序 '+d.sort+'）。');\n  return;\n }\n if(ty==='new-stage'||ty==='edit-stage'){\n  if(f.mode==='edit'){\n   const x=D.stages.find(v=>v.no===f.id);\n   if(x){const old=x.name;x.name=d.name.trim();x.sort=Number(d.sort);\n    if(old!==x.name)D.projects.forEach(p=>{if(p.stage===old)p.stage=x.name})}\n  }else{\n   D.stages.push({no:noUnique(D.stages,d.no)?d.no:billNo('ST',D.stages),name:d.name.trim(),sort:Number(d.sort),created:today(),createdBy:c
