urUser(),createdDept:curDept()});\n  }\n  closeForm();render();\n  notify('项目阶段已'+(f.mode==='edit'?'保存':'新增')+'（演示）：'+d.no+' · '+d.name.trim()+'。');\n  return;\n }\n closeForm();\n}\n/* ============================== 抽屉与对话框 ============================== */\nfunction renderOverlay(){\n closeChoice(true,true);\n const ov=$('overlay'),shell=document.querySelector('.app');\n const oldKey=UI.overlayKey,focused=focusDescription(document.activeElement);\n const oldDrawer=ov.querySelector('#drawer'),oldBody=oldDrawer?.querySelector('.drawer-body');\n const oldDrawerKey=oldDrawer?.dataset.context||'';\n if(oldBody&&oldDrawerKey)UI.drawerScroll.set(oldDrawerKey,oldBody.scrollTop);\n const drawerKey=S.drawer?'drawer:'+S.drawer.type+':'+(S.drawer.id||'')+(S.drawer.type==='ai'?':'+(S.report.batch?.id||''):'')+(S.form?':'+S.form.type+':'+(S.form.id||''):''):'';\n const key=S.dialog?'dialog:'+S.dialog.ok+':'+S.dialog.title:drawerKey;\n clearTimeout(UI.closeTimer);\n if(!key){\n  if(!ov.childElementCount){shell.inert=false;document.body.classList.remove('modal-open');UI.overlayKey='';return}\n  const target=UI.returnFocus;UI.overlayKey='';ov.classList.add('is-closing');ov.inert=true;\n  const finish=()=>{\n   if(UI.overlayKey)return;\n   ov.replaceChildren();ov.classList.remove('is-closing');ov.inert=false;shell.inert=false;\n   document.body.classList.remove('modal-open');\n   if(!focusDescribed(target))document.querySelector('.nav-btn.active')?.focus({preventScroll:true});\n   UI.returnFocus=null;UI.dialogReturn=null;\n  };\n  UI.closeTimer=setTimeout(finish,window.matchMedia('(prefers-reduced-motion:reduce)').matches?0:160);return;\n }\n if(!oldKey)UI.returnFocus=focused||UI.returnFocus;\n if(S.dialog&&!oldKey.startsWith('dialog:'))UI.dialogReturn=focused;\n shell.inert=true;document.body.classList.add('modal-open');\n ov.classList.remove('is-closing');ov.inert=false;UI.overlayKey=key;\n const side=S.drawer?.side==='left'?' left':' right';\n const isForm=S.drawer?.type==='form';\n const label=isForm?'新增或编辑表单，从左侧滑出':'详情侧滑页，从右侧滑出';\n const sameDrawer=oldDrawerKey===drawerKey;\n const motionClass=sameDrawer?' no-enter':'';\n let html='';\n if(S.drawer&&!S.dialog){\n  html=`\u003cdiv class=\"backdrop${oldKey?' no-enter':''}\" data-action=\"close-overlay\" aria-hidden=\"true\">\u003c/div>\u003caside class=\"drawer${side}${motionClass}\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"drawer-title\" aria-label=\"${label}\" tabindex=\"-1\" id=\"drawer\" data-context=\"${esc(drawerKey)}\">${drawerContent()}\u003c/aside>`;\n }else if(S.drawer&&S.dialog){\n  html=`\u003caside class=\"drawer${side}${motionClass} inactive\" role=\"dialog\" aria-label=\"${label}\" id=\"drawer\" data-context=\"${esc(drawerKey)}\" aria-hidden=\"true\" inert>${drawerContent()}\u003c/aside>\u003cdiv class=\"backdrop\" style=\"z-index:32\" data-action=\"cancel-dialog\" aria-hidden=\"true\">\u003c/div>${dialogHtml()}`;\n }else{\n  html=`\u003cdiv class=\"backdrop\" style=\"z-index:32\" data-action=\"cancel-dialog\" aria-hidden=\"true\">\u003c/div>${dialogHtml()}`;\n }\n ov.innerHTML=html;enhanceRegion(ov);\n const body=ov.querySelector('.drawer-body');\n if(body)body.scrollTop=UI.drawerScroll.get(drawerKey)||0;\n const restore=oldKey===key?focused:!S.dialog&&oldKey.startsWith('dialog:')?UI.dialogReturn:null;\n requestAnimationFrame(()=>{\n  if(UI.overlayKey!==key)return;\n  const active=S.dialog?ov.querySelector('.dialog-card'):ov.querySelector('#drawer');if(!active)return;\n  const bad=active.querySelector('.input.bad');\n  if(bad){bad.focus({preventScroll:true});bad.scrollIntoView({block:'nearest'});return}\n  if(focusDescribed(restore,active))return;\n  const target=S.dialog?(active.querySelector('input,textarea,[data-choice]')||active.querySelector('[data-action=\"cancel-dialog\"]')):isForm?active.querySelector('input:not([readonly]):not(:disabled),textarea:not(:disabled),[data-choice]:not(:disabled)'):active.querySelector('[data-action=\"close-overlay\"]');\n  (target||active).focus({preventScroll:true});\n });\n}\nfunction dialogHtml(){\n const d=S.dialog;\n return `\u003cdiv class=\"dialog-layer\">\u003cdiv class=\"panel dialog-card${d.danger?' is-danger':''}\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"dlg-title\" aria-describedby=\"dlg-copy\" tabindex=\"-1\">\n  \u003cdiv class=\"dialog-heading\">${icon(d.danger?'warning':'info')}\u003ch2 id=\"dlg-title\">${esc(d.title)}\u003c/h2>\u003c/div>\n  \u003cdiv id=\"dlg-copy\" class=\"dialog-copy\">${d.body}\u003c/div>\n  ${d.extra||''}\n  \u003cdiv class=\"actions\">${act(d.cancelText||'取消','cancel-dialog')}${act(d.okText||'确认','dialog-ok',d.danger?'danger':'primary')}\u003c/div>\n \u003c/div>\u003c/div>`;\n}\nfunction drawerContent(){\n const d=S.drawer;if(!d)return '';\n if(d.type==='form')return formDrawer();\n if(d.type==='project')return projectDrawer(d.id);\n if(d.type==='task')return taskDrawer(d.id);\n if(d.type==='report')return reportDrawer(d.id);\n if(d.type==='ai')return aiDrawer();\n if(d.type==='stages')return stagesDrawer();\n if(d.type==='taskcats')return taskCatsDrawer();\n if(d.type==='ue')return ueDrawer();\n if(d.type==='info')return infoDrawer(d.id);\n return '';\n}\nconst drawerHead=(eyebrow,title,extra='')=>`\u003cdiv class=\"drawer-head\">\u003cdiv>\u003cspan class=\"eyebrow\">${esc(eyebrow)}\u003c/span>\u003ch2 id=\"drawer-title\">${title}\u003c/h2>\u003cdiv class=\"drawer-meta\">${extra}\u003c/div>\u003c/div>${act('关闭','close-overlay','small')}\u003c/div>`;\nfunction projectDrawer(id){\n const p=D.projects.find(x=>x.id===id);if(!p)return '';\n const cur=p.override!==null?p.override:p.computed;\n const fs=D.follows.filter(f=>f.project===p.name).sort((a,b)=>b.date.localeCompare(a.date));\n const f=fs[0]||null;\n return drawerHead('PROJECT / '+p.id,p.name,tag(p.stage)+' '+tag(p.cat))\n +`\u003cdiv class=\"drawer-body\">\n  \u003cdiv class=\"facts\">\n   \u003cdiv>\u003cspan>项目负责人\u003c/span>\u003cstrong>${esc(p.owner)}\u003c/strong>\u003c/div>\n   \u003cdiv>\u003cspan>最近跟进日期\u003c/span>\u003cstrong>${f?f.date:'暂无有效跟进'}\u003c/strong>\u003c/div>\n   \u003cdiv>\u003cspan>创建日期\u003c/span>\u003cstrong>${p.created}\u003c/strong>\u003c/div>\n   \u003cdiv>\u003cspan>当前进度\u003c/span>\u003cstrong>${cur===null?'暂无可计算进度':cur+'% · '+(p.override!==null?'人工修正':'系统计算')}\u003c/strong>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>进度来源与人工修正\u003c/h3>\n   \u003cdiv class=\"diff\">\n    \u003cdiv class=\"box\">\u003cb>系统计算值（末级任务）\u003c/b>${p.computed===null?'无有效末级任务，不显示 0%':p.computed+'%'}\u003c/div>\n    \u003cdiv class=\"box\">\u003cb>人工修正值（优先展示）\u003c/b>${p.override===null?'无':p.override+'%'}\u003c/div>\n   \u003c/div>\n   ${p.override!==null?`\u003cp class=\"meta\">修正原因：${esc(p.reason)}。末级任务变化触发重算时会提示「保留人工修正 / 采用最新计算值」，不静默覆盖。\u003c/p>`:''}\n   \u003cdiv class=\"row-actions\">${act('调整项目进度','adjust-progress','small')}\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>项目跟进（${fs.length} 条）\u003c/h3>\n   ${f?`\u003cp style=\"margin:0 0 4px\">${esc(f.content)}\u003c/p>\u003cp class=\"meta\">跟进人员 ${esc(f.person)} · 跟进日期 ${f.date}（最近跟进日期按该项目全部跟进的最大日期实时重算）\u003c/p>`:'\u003cp class=\"meta\" style=\"margin:0\">暂无项目跟进。最近跟进日期与最后跟进内容均由跟进记录派生，无跟进时保持为空，不显示占位值。\u003c/p>'}\n   \u003cdiv class=\"row-actions\">${act('填写项目跟进','open-follow:'+esc(p.name),'small primary')}${fs.length>1?act('查看全部 '+(fs.length-1)+' 条历史','goto-follows','small'):''}\u003c/div>\n   ${fs.slice(1).map(x=>`\u003cdiv class=\"kv\">\u003cstrong>${x.date} · ${esc(x.person)}\u003c/strong>\u003cspan class=\"meta\">${esc(x.content)}\u003c/span>\u003c/div>`).join('')}\n  \u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>关联任务\u003c/h3>\n   ${D.tasks.filter(t=>t.project===p.name).map(t=>`\u003cdiv class=\"kv\">\u003cbutton class=\"link-btn\" data-action=\"open-task:${esc(t.id)}\">${t.created}｜${esc(t.name)}\u003c/button>\u003cspan class=\"cell-sub\">${esc(t.owner)} · ${esc(t.status)} · 截止 ${t.due}\u003c/span>\u003c/div>`).join('')||'\u003cp class=\"meta\">没有关联任务。\u003c/p>'}\n  \u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>周报关联\u003c/h3>\u003cp class=\"meta\" style=\"margin:0\">暂无周报来源引用。数据获取区同步内容不反向更新项目最后跟进内容。\u003c/p>\u003c/div>\n \u003c/div>\n \u003cdiv class=\"drawer-foot\">${act('删除项目','delete-project','small danger')}${act('编辑项目','edit-project')}\u003c/div>`;\n}\nfunction taskDrawer(id){\n const t=D.tasks.find(x=>x.id===id);if(!t)return '';\n const pid=(D.projects.find(p=>p.name===t.project)||{}).id;\n const ps=D.progresses.filter(p=>p.task===t.name).sort((a,b)=>b.date.localeCompare(a.date));\n const lp=ps[0]||null;\n return drawerHead('TASK / '+t.id+' · '+t.level+' 级任务',\n  `\u003cspan class=\"date-prefix\">${t.created}｜\u003c/span>`+esc(t.name),\n  tag(t.priority,prClass(t.priority))+' '+tag(t.status,t.status==='已完成'?'good':''))\n +`\u003cdiv class=\"drawer-body\">\n  \u003cdiv class=\"facts\">\n   \u003cdiv>\u003cspan>主负责人\u003c/span>\u003cstrong>${esc(t.owner)}\u003c/strong>\u003c/div>\n   \u003cdiv>\u003cspan>协作者\u003c/span>\u003cstrong>${t.partners.join('、')||'无'}\u003c/strong>\u003c/div>\n   \u003cdiv>\u003cspan>开始 / 截止\u003c/span>\u003cstrong>${t.created} / ${t.due}\u003c/strong>\u003c/div>\n   \u003cdiv>\u003cspan>任务层级路径\u003c/span>\u003cstrong>${esc(t.path)}\u003c/strong>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>关联项目\u003c/h3>\u003cp style=\"margin:0 0 8px\">${esc(t.project)}\u003c/p>\n   ${pid?`\u003cdiv class=\"row-actions\">\u003cbutton class=\"link-btn\" data-action=\"open-project:${esc(pid)}\">查看项目详情\u003c/button>\u003c/div>`:''}\u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>任务跟进（${ps.length} 条进度记录）\u003c/h3>\n   \u003cp style=\"margin:0 0 8px\">${esc(lp?lp.content:t.latest)}\u003c/p>\n   \u003cp class=\"meta\">每次提交进度形成一条历史记录且不可覆盖；标记完成需填写完成说明，重新打开需填写原因；任务进度可被周报「同步数据」读取。\u003c/p>\n   \u003cdiv class=\"row-actions\">${act('填写任务进度','open-progress:'+esc(t.name),'small primary')}\u003c/div>\n   ${ps.slice(1).map(x=>`\u003cdiv class=\"kv\">\u003cstrong>${x.date} · ${esc(x.person)} · ${esc(x.status)}\u003c/strong>\u003cspan class=\"meta\">${esc(x.content)}\u003c/span>\u003c/div>`).join('')}\n  \u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>三级任务关系\u003c/h3>\n   \u003cp class=\"meta\">${t.level===3?'当前为三级任务，是最小执行单元，不允许再新增第四级。':'当前为 '+t.level+' 级，可在其下新增子任务（最多三级）。'}\u003c/p>\n   \u003cdiv class=\"row-actions\">${t.level>=3?act('尝试新增第四级','add-child','small'):act('新增子任务','add-child','small')}\u003c/div>\u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>周报来源\u003c/h3>\u003cp class=\"meta\" style=\"margin:0\">暂无周报引用。周报同步来源按来源单据编号去重，同一周报内不重复出现。\u003c/p>\u003c/div>\n \u003c/div>\n \u003cdiv class=\"drawer-foot\">${act('删除任务','delete-task','small danger')}${act('编辑任务','edit-task')}\u003c/div>`;\n}\nfunction reportDrawer(id){\n const r=D.reports.find(x=>x.id===id);if(!r)return '';\n return drawerHead('WEEKLY REPORT / 第 '+r.week+' 周',esc(r.person)+' 的工作周报',tag(r.status,'good')+' \u003cspan class=\"meta\">'+r.start+' — '+r.end+'\u003c/span>')\n +`\u003cdiv class=\"drawer-body\">\n  \u003cdiv class=\"notice\">查看模式仅展示\u003cstrong>最终汇报快照\u003c/strong>；数据获取区与手工填写区原文不在查看态与看板展示。\u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>工作主题 / 项目\u003c/h3>\u003cp style=\"margin:0\">${esc(r.topic)}\u003c/p>\u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>完成事项\u003c/h3>\u003cp style=\"margin:0\">${esc(r.done)}\u003c/p>\u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>关键进展\u003c/h3>\u003cp style=\"margin:0\">${esc(r.advance)}\u003c/p>\u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>问题风险\u003c/h3>\u003cp style=\"margin:0\">${esc(r.risk)}\u003c/p>\u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>下一步动作\u003c/h3>\u003cp style=\"margin:0\">${esc(r.next)}\u003c/p>\u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>来源说明\u003c/h3>\u003cp class=\"meta\" style=\"margin:0\">最终汇报快照由数据获取与手工填写整合而成；本卡为演示数据，不代表真实系统记录。\u003c/p>\u003c/div>\n \u003c/div>`;\n}\nfunction aiDrawer(){\n const b=S.report.batch;if(!b)return '';\n const ro=b.status==='已提交',cur=b.status==='失败'?'待提交':b.status;\n const steps=['草稿','生成中','待提交','提交中','已提交'];\n return drawerHead('AI REVIEW / '+b.id,'生成结果审核',tag(b.status,ro?'good':b.status==='失败'?'high':'ai')+` \u003cspan class=\"meta\">仅手工填写区 · 内容版本 v${b.version}\u003c/span>`)\n +`\u003cdiv class=\"drawer-body\">\n  \u003cdiv class=\"batch-status\">${steps.map((s,i)=>`\u003cspan class=\"step ${s===cur?(b.status==='失败'?'fail':'now'):(steps.indexOf(cur)>i?'done':'')}\">${s}\u003c/span>${i\u003csteps.length-1?'\u003cspan class=\"arrow\">'+icon('forward')+'\u003c/span>':''}`).join('')}\u003c/div>\n  \u003cdiv class=\"notice\">AI 结果为\u003cstrong>待确认建议\u003c/strong>。请逐行核对「原文证据 → 匹配对象 → 建议内容」；未点击「提交生成结果」前，正式对象写入数为 \u003cstrong>0\u003c/strong>。\u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>项目跟进生成表（${b.projRows.length} 行）\u003c/h3>${b.projRows.map((r,i)=>aiRow('proj',r,i,ro)).join('')||'\u003cdiv class=\"empty\" style=\"padding:16px\">当前没有项目跟进行。\u003c/div>'}\n   ${ro?'':`\u003cdiv class=\"row-actions\">${act('补充项目跟进行','ai-add-proj','small')}\u003c/div>`}\u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>任务进度生成表（${b.taskRows.length} 行）\u003c/h3>${b.taskRows.map((r,i)=>aiRow('task',r,i,ro)).join('')||'\u003cdiv class=\"empty\" style=\"padding:16px\">当前没有任务进度行。\u003c/div>'}\n   ${ro?'':`\u003cdiv class=\"row-actions\">${act('补充任务进度行','ai-add-task','small')}\u003c/div>`}\u003c/div>\n  ${ro?'\u003cdiv class=\"notice warn\">已提交批次\u003cstrong>只读\u003c/strong>，不可重复提交。如需修正，请使用「回滚本次生成」并重新生成新批次；回滚需二次确认并保留审计日志。\u003c/div>':''}\n \u003c/div>\n \u003cdiv class=\"drawer-foot\">\n  ${ro?act('回滚本次生成','rollback-ai','small danger'):''}\n  ${ro?'':`${act('暂不处理','close-overlay')}${act(b.status==='失败'?'修正并重试提交':'提交生成结果','ai-submit','primary')}`}\n \u003c/div>`;\n}\nfunction aiRow(kind,r,i,ro){\n if(kind==='proj'){\n  return `\u003cdiv class=\"ai-row${r.error?' error':''}\">\n   \u003cdiv class=\"ai-row-head\">${tag('AI 建议','ai')}${matchTag(r.match)}\u003cspan class=\"meta\">行 ${i+1}\u003c/span>\u003c/div>\n   \u003cdiv class=\"evidence\">\u003cstrong>原文证据：\u003c/strong>${esc(r.evidence)}\u003cbr>\u003cstrong>匹配理由：\u003c/strong>${esc(r.reason)}\u003c/div>\n   \u003cdiv class=\"field\">\u003clabel for=\"ai-p-${i}\">匹配项目（未匹配必须人工选择，不自动创建对象）\u003c/label>\n    ${choice({id:`ai-p-${i}`,className:`input`,bindings:{\"ai-p\":`${i}`},disabled:ro},opts(['请选择项目',...D.projects.map(p=>p.name)],r.project))}\u003c/div>\n   \u003cdiv class=\"field\" style=\"margin-top:8px\">\u003clabel for=\"ai-pc-${i}\">跟进内容\u003c/label>\n    \u003ctextarea class=\"input\" id=\"ai-pc-${i}\" data-ai-pc=\"${i}\" ${ro?'disabled':''}>${esc(r.content)}\u003c/textarea>\u003c/div>\n   ${r.error?`\u003cp class=\"err\" role=\"alert\">${icon('warning')}\u003cspan>${esc(r.error)}\u003c/span>\u003c/p>`:''}\n   ${ro?'':`\u003cdiv class=\"row-actions\">${act('采纳本行','noop','small')}${act('移除此行','ai-del-proj:'+esc(i),'small danger')}\u003c/div>`}\n  \u003c/div>`;\n }\n return `\u003cdiv class=\"ai-row${r.error?' error':''}\">\n  \u003cdiv class=\"ai-row-head\">${tag('AI 建议','ai')}${matchTag(r.match)}\u003cspan class=\"meta\">行 ${i+1}\u003c/span>\u003c/div>\n  \u003cdiv class=\"evidence\">\u003cstrong>原文证据：\u003c/strong>${esc(r.evidence)}\u003cbr>\u003cstrong>匹配理由：\u003c/strong>${esc(r.reason)}\u003c/div>\n  \u003cdiv class=\"field\">\u003clabel for=\"ai-t-${i}\">匹配任务\u003c/label>\n   ${choice({id:`ai-t-${i}`,className:`input`,bindings:{\"ai-t\":`${i}`},disabled:ro},opts(['请选择任务',...D.tasks.map(t=>t.name)],r.task))}\u003c/div>\n  \u003cdiv class=\"diff\" style=\"margin-top:8px\">\n   \u003cdiv class=\"box\">\u003cb>当前状态\u003c/b>${esc(r.current||'未开始')}\u003c/div>\n   \u003cdiv class=\"box\">\u003cb>建议状态\u003c/b>${esc(r.status)}\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"field\">\u003clabel for=\"ai-tc-${i}\">进度内容\u003c/label>\n   \u003ctextarea class=\"input\" id=\"ai-tc-${i}\" data-ai-tc=\"${i}\" ${ro?'disabled':''}>${esc(r.content)}\u003c/textarea>\u003c/div>\n  ${r.error?`\u003cp class=\"err\" role=\"alert\">${icon('warning')}\u003cspan>${esc(r.error)}\u003c/span>\u003c/p>`:''}\n  ${ro?'':`\u003cdiv class=\"row-actions\">${act('采纳本行','noop','small')}${act('移除此行','ai-del-task:'+esc(i),'small danger')}\u003c/div>`}\n \u003c/div>`;\n}\nfunction stagesDrawer(){\n return drawerHead('PROJECT STAGES','项目阶段','\u003cspan class=\"meta\">项目档案单选控件内可直接新建并回填当前项目\u003c/span>')\n +`\u003cdiv class=\"drawer-body\">\n  \u003cdiv class=\"notice\">已被项目使用的阶段不可删除；批量删除需逐项校验并返回成功 / 失败明细。阶段档案含单据编号、创建人与创建部门。\u003c/div>\n  ${D.stages.slice().sort((a,b)=>a.sort-b.sort).map(s=>{const used=D.projects.filter(p=>p.stage===s.name).length;\n   return `\u003cdiv class=\"kv\" style=\"display:flex;justify-content:space-between;align-items:center;gap:8px\">\n    \u003cspan>${esc(s.name)}\u003cspan class=\"cell-sub\">${esc(s.no)} · 排序 ${s.sort} · ${used?used+' 个项目在用':'未被使用'} · 创建人 ${esc(s.createdBy)} · 创建部门 ${esc(s.createdDept)}\u003c/span>\u003c/span>\n    \u003cspan class=\"row-actions\" style=\"margin:0\">${act('编辑','edit-stage:'+esc(s.no),'small')}${act('删除','del-stage:'+esc(s.no),'small danger')}\u003c/span>\u003c/div>`}).join('')}\n  \u003cdiv class=\"actions\" style=\"margin-top:12px\">${act('新增项目阶段','add-stage','primary')}\u003c/div>\n \u003c/div>`;\n}\nfunction taskCatsDrawer(){\n return drawerHead('TASK CATEGORIES','任务分类','\u003cspan class=\"meta\">任务表单按分类单选；分类档案在此维护\u003c/span>')\n +`\u003cdiv class=\"drawer-body\">\n  \u003cdiv class=\"notice\">任务分类支持\u003cstrong>新增、编辑、删除\u003c/strong>。已被任务使用的分类不可直接删除，需先解除关联；历史任务保留原分类名称快照。\u003c/div>\n  \u003cdiv class=\"cat-list\">\n  ${D.taskCats.slice().sort((a,b)=>a.sort-b.sort).map(c=>{const used=D.tasks.filter(t=>t.path===c.name||(t.path||'').split(' / ')[0]===c.name).length;\n   return `\u003cdiv class=\"cat-item\">\n    \u003cdiv class=\"cat-main\">\n     \u003cstrong>${esc(c.name)}\u003c/strong>\n     \u003cspan class=\"meta\">编码 ${esc(c.code)} · 排序 ${c.sort}\u003c/span>\n     \u003cspan class=\"cell-sub\" style=\"margin-top:4px\">${esc(c.no)}\u003c/span>\n     \u003cspan class=\"cell-sub\" style=\"margin-top:4px\">创建人 ${esc(c.createdBy)} · 创建部门 ${esc(c.createdDept)}\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"cat-side\">\n     \u003cspan>${used?tag(used+' 个任务在用',''):tag('未被使用','good')}\u003c/span>\n     \u003cspan class=\"row-actions\" style=\"margin:0\">${act('编辑','edit-cat:'+esc(c.no),'small')}${act('删除','del-cat:'+esc(c.no),'small danger')}\u003c/span>\n    \u003c/div>\u003c/div>`}).join('')}\n  \u003c/div>\n  \u003cdiv class=\"actions\" style=\"margin-top:12px\">${act('新增任务分类','add-cat','primary')}\u003c/div>\n \u003c/div>`;\n}\nfunction ueDrawer(){\n return drawerHead('UE SPEC','UE 设计说明与状态演示','\u003cspan class=\"meta\">CRM AI 产品 UE/UI 设计专家视角\u003c/span>')\n +`\u003cdiv class=\"drawer-body\">\n  \u003cdiv class=\"sec\">\u003ch3>设计目标（可衡量）\u003c/h3>\n   \u003cul style=\"margin:0;padding-left:16px;line-height:1.85\">\n    \u003cli>G1 负责人首屏 30 秒掌握本周部门进展\u003c/li>\n    \u003cli>G2 单人完成一份周报 ≤ 8 分钟\u003c/li>\n    \u003cli>G3 AI 单行校正 ≤ 30 秒、≤ 3 次操作\u003c/li>\n    \u003cli>G4 未确认前正式对象写入数恒为 0\u003c/li>\n    \u003cli>G5 每条 AI 结论 1 次点击可回溯原始记录\u003c/li>\n   \u003c/ul>\u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>五态演示\u003c/h3>\u003cp class=\"meta\" style=\"margin:0 0 8px\">点击可直接检视每一态在界面上的真实形态。权限受限态由「人员档案 → 停用 / 裁剪权限 → 重新登录」真实复现：停用账号在登录校验第③步被拦截，不进入工作台；裁剪功能权限后对应模块入口对本人不可用。\u003c/p>\n   \u003cdiv class=\"state-grid\">\n    ${act('空态 · 筛选无结果 / 未同步','demo-empty','small')}\n    ${act('加载态 · 骨架占位','demo-loading','small')}\n    ${act('部分失败态 · AI 行校验失败','demo-fail','small')}\n    ${act('会话失效态 · 需重新登录','demo-session','small')}\n    ${act('正常态 · 返回','demo-normal','small')}\n   \u003c/div>\n   ${S.stateDemo?`\u003cp class=\"meta\" style=\"margin-top:8px\">当前演示：\u003cstrong>${esc(S.stateDemo)}\u003c/strong>\u003c/p>`:''}\u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>AI 可信层四要素\u003c/h3>\n   \u003cdiv class=\"kv\">\u003cstrong>① 生成标识\u003c/strong>\u003cspan class=\"meta\">AI 建议加标签 + 左侧虚线边框（形状线索，不只靠颜色）；人工录入与系统同步各有独立标识\u003c/span>\u003c/div>\n   \u003cdiv class=\"kv\">\u003cstrong>② 匹配方式（替代原「置信度」）\u003c/strong>\u003cspan class=\"meta\">底层真实语义只有「原文是否命中对象名称」这一个布尔判断，故界面如实呈现「匹配方式：名称命中 / 需人工指定」，不做置信度语义包装；若确需置信信号，须引入独立实现（模型自报 + 规则计算交叉），不得用布尔值伪装\u003c/span>\u003c/div>\n   \u003cdiv class=\"kv\">\u003cstrong>③ 来源入口\u003c/strong>\u003cspan class=\"meta\">每行含原文证据、匹配理由、来源单据编号与「查看原记录」\u003c/span>\u003c/div>\n   \u003cdiv class=\"kv\">\u003cstrong>④ 确认拦截 + 回滚\u003c/strong>\u003cspan class=\"meta\">提交前点名受影响对象与数量；已提交批次只读并提供回滚与二次确认\u003c/span>\u003c/div>\u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>组织与权限模型\u003c/h3>\n   \u003cdiv class=\"kv\">\u003cstrong>部门档案\u003c/strong>\u003cspan class=\"meta\">部门是组织归属与数据权限的载体；人员档案必须归属一个部门（必填）\u003c/span>\u003c/div>\n   \u003cdiv class=\"kv\">\u003cstrong>创建人 / 创建部门\u003c/strong>\u003cspan class=\"meta\">所有新增业务数据自动记录创建人与创建部门，随单据永久保留\u003c/span>\u003c/div>\n   \u003cdiv class=\"kv\">\u003cstrong>默认全部权限\u003c/strong>\u003cspan class=\"meta\">新增人员默认拥有全部功能权限与全部部门数据权限；可按人裁剪，裁剪后不静默恢复\u003c/span>\u003c/div>\n   \u003cdiv class=\"kv\">\u003cstrong>功能权限真实生效\u003c/strong>\u003cspan class=\"meta\">裁剪后，对应模块在左侧导航中对本人\u003cstrong>不可见、不可点\u003c/strong>（非提示后放行）；若当前停留页已失去权限，自动回落到仍可用的模块。可用「人员档案 → 编辑 → 取消勾选 → 重新登录」复现\u003c/span>\u003c/div>\n   \u003cdiv class=\"kv\">\u003cstrong>数据权限（部门）真实生效\u003c/strong>\u003cspan class=\"meta\">项目 / 任务 / 项目跟进 / 任务进度 / 周报列表只展示「创建部门」落在本人可见部门范围内的数据；工作台指标带同步按可见范围统计。部门与人员档案属组织主数据，不纳入数据权限过滤\u003c/span>\u003c/div>\n   \u003cdiv class=\"kv\">\u003cstrong>账号启停用\u003c/strong>\u003cspan class=\"meta\">停用账号不可登录（登录校验第③步拦截）；启用后按档案中已配置权限生效\u003c/span>\u003c/div>\u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>单据编号与删除\u003c/h3>\n   \u003cdiv class=\"kv\">\u003cstrong>编号规则\u003c/strong>\u003cspan class=\"meta\">前缀 + 年/月/日 + 四位当日流水（如 PJ-20260908-0001），保存时生成并校验唯一\u003c/span>\u003c/div>\n   \u003cdiv class=\"kv\">\u003cstrong>删除释放\u003c/strong>\u003cspan class=\"meta\">编号即现存记录本身，删除记录时编号随之释放、不保留孤儿编号，从根本上消除「删除后重号致同步去重失效」\u003c/span>\u003c/div>\n   \u003cdiv class=\"kv\">\u003cstrong>删除前置校验\u003c/strong>\u003cspan class=\"meta\">所有新增业务数据均支持删除；存在关联引用时先阻断并提示解除方式，已提交 / 已归档记录改软删除\u003c/span>\u003c/div>\u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>80 / 20 协同点\u003c/h3>\n   \u003cp class=\"meta\" style=\"margin:0\">AI 预识别：项目匹配、任务匹配、状态建议、日期与人员默认值。人工校正 20%：项目与任务归属、状态、内容表述。校正控件全部内联在行内（下拉选择 + 状态对照 + 文本域），不跳页、不丢上下文。\u003c/p>\u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>待确认清单\u003c/h3>\n   \u003col style=\"margin:0;padding-left:16px;line-height:1.85\">\n    \u003cli>WorkBuddy 是否支持自定义手机号 + 密码认证（P0，不支持则改用平台原生认证）\u003c/li>\n    \u003cli>附件上传 / 预览 / 下载与全文索引能力\u003c/li>\n    \u003cli>@项目 / @任务 / @人员 与版本记录能力\u003c/li>\n    \u003cli>图片输入三级降级（粘贴 → 上传 → 附件卡片）实现程度\u003c/li>\n    \u003cli>人工修正项目进度的审批与重算提示策略\u003c/li>\n   \u003c/ol>\u003c/div>\n \u003c/div>`;\n}\nfunction infoDrawer(name){\n return drawerHead('PROTOTYPE NOTE',esc(name),'\u003cspan class=\"meta\">交互占位\u003c/span>')\n +`\u003cdiv class=\"drawer-body\">\u003cdiv class=\"notice warn\">此入口为原型占位，用于说明该功能的位置与交互意图，不执行真实新增、编辑、删除或批量删除。\u003c/div>\n  \u003cp class=\"meta\">正式实现需：服务端逐条关联校验、返回成功 / 失败明细；关联对象与已提交批次采用软删除并保留操作日志；失败项需给出对象名称、阻断关联与处理建议。\u003c/p>\u003c/div>`;\n}\nfunction dialog(title,body,ok,okText,danger,extra,cancelText){\n S.dialog={title,body,ok,okText,danger,extra,cancelText};renderOverlay();\n}\n/* ============================== 状态同步与自动保存 ============================== */\nfunction snapshot(){\n if(S.nav!=='reports'||S.reportMode!=='edit')return;\n const m=$('manual'),n=$('next');\n if(m)S.report.manual=m.innerHTML;\n if(n)S.report.next=n.innerHTML;\n const b=S.report.batch;\n document.querySelectorAll('[data-ff]').forEach(el=>{if(S.report.final)S.report.final[el.dataset.ff]=el.value});\n document.querySelectorAll('[data-src]').forEach(el=>{const s=S.report.sources[+el.dataset.src];if(s)s.text=el.value});\n if(!b)return;\n document.querySelectorAll('[data-ai-p]').forEach(el=>{const r=b.projRows[+el.dataset.aiP];if(r)r.project=el.value});\n document.querySelectorAll('[data-ai-pc]').forEach(el=>{const r=b.projRows[+el.dataset.aiPc];if(r)r.content=el.value});\n document.querySelectorAll('[data-ai-t]').forEach(el=>{const r=b.taskRows[+el.dataset.aiT];if(r)r.task=el.value});\n document.querySelectorAll('[data-ai-tc]').forEach(el=>{const r=b.taskRows[+el.dataset.aiTc];if(r)r.content=el.value});\n}\nconst textOf=html=>{const d=document.createElement('div');d.innerHTML=html||'';return (d.textContent||'').trim()};\nfunction autoSave(){\n if(!S.session)return;\n S.report.save='有未保存的更改';\n if($('save-state'))$('save-state').textContent=S.report.save;\n clearTimeout(S.autoTimer);\n S.autoTimer=setTimeout(()=>{\n  snapshot();\n  if(!S.report.created)S.report.created=today();\n  S.report.version++;\n  S.report.save='已自动保存（演示）· v'+S.report.version;\n  if($('save-state'))$('save-state').textContent=S.report.save;\n },900);\n}\n/* ============================== 业务动作 ============================== */\nfunction doSave(){\n snapshot();\n if(!S.report.created)S.report.created=today();\n S.report.version++;S.report.save='已保存草稿（演示）· v'+S.report.version;\n if($('save-state'))$('save-state').textContent=S.report.save;\n notify('演示草稿已保存：创建日期按首次成功保存生成；后续自动保存只更新更新时间，系统内部保留精确审计时间。');\n}\nfunction doSync(){\n snapshot();\n const r=S.report,btn=$('sync-btn');\n if(r.start>r.end){notify('结束日期不能早于开始日期，请检查工作周范围。');return}\n if(btn){btn.disabled=true;btn.setAttribute('aria-busy','true');btn.textContent='同步中…'}\n setTimeout(()=>{\n  const matches=D.syncPool.filter(x=>x.date>=r.start&&x.date\u003c=r.end&&x.person===r.syncPerson);\n  const fresh=matches.filter(x=>!r.sources.some(s=>s.no===x.no));\n  r.sources.push(...fresh);\n  if(btn){btn.disabled=false;btn.removeAttribute('aria-busy');btn.textContent='同步数据';enhanceRegion(btn.parentElement)}\n  if($('sources')){$('sources').innerHTML=sourcesHtml();enhanceRegion($('sources'))}\n  if($('syncwho'))$('syncwho').textContent=r.syncPerson;\n  notify(`同步完成：符合条件 ${matches.length} 条，新增 ${fresh.length} 条，重复来源已按单据编号跳过。原项目跟进与任务进度未被修改。`);\n },450);\n}\nfunction makeFinal(){\n snapshot();\n const r=S.report,manual=textOf(r.manual),next=textOf(r.next);\n if(!manual&&!r.sources.length){notify('请先填写手工内容，或在数据获取区同步已有业务记录。');return}\n r.final={topic:r.sources[0]?r.sources[0].project:'本周工作汇报',\n  done:[...r.sources.map(s=>s.text),manual].filter(Boolean).join('；')||'暂无',\n  risk:'待补充问题风险',next:next||'待补充下周工作计划'};\n if($('final-area')){$('final-area').innerHTML=finalHtml();enhanceRegion($('final-area'))}\n notify('最终汇报快照已生成：可编辑表达与排版，编辑不会反向改写数据获取区原文或原业务对象。');\n}\nfunction generateAI(){\n snapshot();\n const r=S.report,manual=textOf(r.manual);\n if(!manual){notify('请先在【手工填写】区输入本周工作内容；AI 只处理该区域。');return}\n if(r.batch&&r.batch.status==='已提交'){S.drawer={type:'ai'};renderOverlay();notify('该周报已有已提交批次，批次只读且不可重复提交。');return}\n if(r.batch&&r.batch.status==='失败'){S.drawer={type:'ai'};renderOverlay();notify('原批次存在失败行，请修正后重试，不新建重复批次。');return}\n if(r.batch&&r.batch.version===r.version){S.drawer={type:'ai'};renderOverlay();notify('已打开同一内容版本的待提交批次，避免重复生成。');return}\n const p=D.projects.find(x=>manual.includes(x.name));\n const t=D.tasks.find(x=>manual.includes(x.name));\n const clip=n=>manual.slice(0,n);\n r.batch={id:'B-'+String(Date.now()).slice(-6),status:'待提交',version:Math.max(r.version,1),\n  projRows:[{project:p?p.name:'请选择项目',content:clip(90),evidence:clip(110),reason:p?'原文命中项目名称「'+p.name+'」':'未命中任何项目名称，需人工选择（不自动创建对象）',match:p?'名称命中':'需人工指定',error:''}],\n  taskRows:[{task:t?t.name:'请选择任务',current:'进行中',status:'进行中',content:clip(90),evidence:clip(110),reason:t?'原文命中任务名称「'+t.name+'」':'未命中任何任务名称，需人工选择（不自动创建对象）',match:t?'名称命中':'需人工指定',error:''}]};\n if($('ai-summary'))$('ai-summary').innerHTML=batchSummary();\n S.drawer={type:'ai'};renderOverlay();\n notify('已生成待确认建议：请核对原文证据与匹配对象；提交前不会写回任何正式对象。');\n}\nfunction submitAI(){\n snapshot();\n const b=S.report.batch;\n if(!b||b.status==='已提交'){notify('已提交批次不可重复提交。');return}\n let bad=0;\n b.projRows.forEach(r=>{\n  r.error=r.project==='请选择项目'?'未选择匹配项目：项目无法匹配时必须人工选择，系统不自动创建对象。'\n   :!r.content.trim()?'跟进内容为空：请补充后再提交。':'';\n  if(r.error)bad++;\n });\n b.taskRows.forEach(r=>{\n  r.error=r.task==='请选择任务'?'未选择匹配任务：任务无法匹配时必须人工选择，系统不自动创建对象。'\n   :!r.content.trim()?'进度内容为空：请补充后再提交。':'';\n  if(r.error)bad++;\n });\n if(bad){\n  b.status='失败';\n  renderOverlay();\n  if($('ai-summary'))$('ai-summary').innerHTML=batchSummary();\n  notify(`校验未通过：${bad} 行存在问题。正式对象写入已全部回滚，错误行与原因保留，可在原批次修正后重试。`);\n  return;\n }\n const n=b.projRows.length,m=b.taskRows.length;\n const projNames=[...new Set(b.projRows.map(r=>r.project))].join('、');\n const taskNames=[...new Set(b.taskRows.map(r=>r.task))].join('、');\n dialog('确认提交 AI 生成结果',\n  `将按批次 \u003cstrong>${esc(b.id)}\u003c/strong> 拆分写入：\u003cbr>· 项目跟进 \u003cstrong>${n}\u003c/strong> 条 → 影响项目：${esc(projNames)}\u003cbr>· 任务进度 \u003cstrong>${m}\u003c/strong> 条 → 影响任务：${esc(taskNames)}\u003cbr>\u003cbr>该事务为一次性提交：任一行失败则全部回滚，不产生半成品数据。提交后批次转为只读；如需修正，只能回滚后重新生成。`,\n  'ai-commit','确认提交生成结果');\n}\n/* ============================== 事件绑定 ============================== */\nfunction handleAction(a){\n if(!a)return;\n const [k,...rest]=a.split(':'),id=rest.join(':');\n switch(k){\n  case 'refresh':S.loading=true;render();setTimeout(()=>{S.loading=false;render();notify('演示数据已刷新。')},600);break;\n  case 'scope-toggle':S.scope=S.scope==='dept'?'me':'dept';render();\n   notify(S.scope==='me'?'已切换到我的视角：业务人员字段默认当前登录人员，任务清单按负责人过滤。':'已切换到部门整体视角。');break;\n  case 'new-report':UI.pageScroll.set(S.nav+':'+(S.nav==='reports'?S.reportMode:''),window.scrollY);S.nav='reports';S.reportMode='edit';S.drawer=null;S.dialog=null;window.scrollTo(0,0);render();break;\n  case 'report-list':snapshot();S.reportMode='list';window.scrollTo(0,0);render();restorePageContext();break;\n  case 'open-report':saveScroll();S.drawer={type:'report',id};renderOverlay();break;\n  case 'open-project':saveScroll();S.drawer={type:'project',id};renderOverlay();break;\n  case 'open-task':saveScroll();S.drawer={type:'task',id};renderOverlay();break;\n  case 'open-ue':saveScroll();S.drawer={type:'ue'};renderOverlay();break;\n  case 'close-overlay':if(S.form){closeForm();break}S.form=null;S.drawer=null;S.dialog=null;renderOverlay();restoreScroll();break;\n  case 'cancel-dialog':S.dialog=null;renderOverlay();break;  case 'dialog-ok':case 'confirm-dialog':{\n   const ok=S.dialog?S.dialog.ok:null;\n   if(ok==='add-stage'){\n    const el=$('stage-name'),v=(el?el.value:'').trim();\n    if(!v){notify('阶段名称不能为空。');if(el)el.focus();return}\n    if(stageNames().includes(v)){notify('阶段名称「'+v+'」已存在，请直接在下拉中选用，不做重复创建。');if(el)el.focus();return}\n    const rec={no:billNo('ST',D.stages),name:v,sort:D.stages.length+1,created:today(),createdBy:curUser(),createdDept:curDept()};\n    D.stages.push(rec);\n    S.dialog=null;\n    if(S.form&&(S.form.type==='new-project'||S.form.type==='edit-project')){\n     S.form.draft.stage=v;renderOverlay();\n     notify('项目阶段「'+v+'」已新增（'+rec.no+'）并回填当前项目（演示）。');\n    }else{\n     render();notify('项目阶段「'+v+'」已新增（'+rec.no+'）；正式实现先保存阶段档案再回填当前项目。');\n    }\n    return;\n   }\n   S.dialog=null;renderOverlay();if(ok)handleAction(ok);break;\n  }\n  case 'reset-reports':S.week='all';S.rPerson='all';S.rStatus='all';S.rQ='';render();break;\n  case 'reset-projects':S.pQ='';S.pStage='all';render();break;\n  case 'reset-tasks':S.tOwner='all';S.tPri='all';S.tStatus='all';render();break;\n  case 'save-draft':doSave();break;\n  case 'sync':doSync();break;\n  case 'make-final':makeFinal();break;\n  case 'generate-ai':generateAI();break;\n  case 'submit-report':{\n   snapshot();const r=S.report;\n   if(r.start>r.end){notify('工作周结束日期不能早于开始日期。');return}\n   if(!r.final){notify('请先生成并检查最终汇报，再提交周报。');return}\n   dialog('确认提交周报',\n    `将保存 \u003cstrong>${r.person}\u003c/strong> 第 \u003cstrong>${r.week}\u003c/strong> 周（${r.start} — ${r.end}）的最终汇报快照，并提交周报状态。\u003cbr>\u003cbr>本次提交\u003cstrong>不会\u003c/strong>执行 AI 生成，也\u003cstrong>不会\u003c/strong>创建或修改项目跟进、任务进度。如需写入业务对象，请回到 AI 批次使用「提交生成结果」。`,\n    'report-commit','提交周报');\n   break;\n  }\n  case 'report-commit':{\n   S.report.status='已提交';if(!S.report.created)S.report.created=today();S.report.save='已提交（演示）';\n   snapshot();\n   /* 需求①：提交成功后自动返回工作汇报列表，不驻留编辑态 */\n   S.reportMode='list';S.drawer=null;S.dialog=null;window.scrollTo(0,0);render();\n   notify('周报已提交（演示）：只改变周报状态并保存汇报快照，未产生任何项目跟进或任务进度；已自动返回工作汇报列表。');break;\n  }\n  case 'view-ai':S.drawer={type:'ai'};renderOverlay();break;\n  case 'ai-submit':submitAI();break;\n  case 'ai-commit':S.report.batch.status='已提交';render();\n   notify('演示批次已提交并转为只读。正式环境此处按事务拆分写入项目跟进与任务进度，失败则全部回滚。');break;\n  case 'rollback-ai':dialog('确认回滚本次生成',\n   '将撤销本批次已创建的项目跟进与任务进度记录，并按回写前快照回滚（不得硬编码原值），同时保留操作日志与审计信息。已回滚批次不可再次提交；如需重新写入，请基于最新手工内容生成新批次。\u003cbr>\u003cbr>此动作不可自动恢复。',\n   'ai-rollback-do','确认回滚',true);break;\n  case 'ai-rollback-do':S.report.batch=null;render();notify('演示批次已回滚并保留审计日志占位。');break;\n  case 'ai-del-proj':case 'ai-del-task':{\n   const b=S.report.batch;if(!b||b.status==='已提交')break;\n   (k==='ai-del-proj'?b.projRows:b.taskRows).splice(+id,1);\n   renderOverlay();if($('ai-summary'))$('ai-summary').innerHTML=batchSummary();break;\n  }\n  case 'ai-add-proj':case 'ai-add-task':{\n   const b=S.report.batch;if(!b||b.status==='已提交')break;\n   if(k==='ai-add-proj')b.projRows.push({project:'请选择项目',content:'',evidence:'用户补充行',reason:'人工新增',match:'需人工指定',error:''});\n   else b.taskRows.push({task:'请选择任务',current:'未开始',status:'未开始',content:'',evidence:'用户补充行',reason:'人工新增',match:'需人工指定',error:''});\n   renderOverlay();if($('ai-summary'))$('ai-summary').innerHTML=batchSummary();break;\n  }\n  case 'source-open':notify('来源记录 '+id+'：正式实现跳转原记录详情；演示环境仅展示来源 ID，用于可追溯校验。');break;\n  case 'manage-stages':saveScroll();S.drawer={type:'stages'};renderOverlay();break;\n  case 'add-stage':case 'quick-add-stage':dialog('新建项目阶段',\n   '项目阶段为单选，可在项目表单内直接新建：先保存阶段档案，成功后自动回填当前项目；同名时提示复用已有阶段，不做重复创建。',\n   'add-stage','新建阶段',false,\n   '\u003cdiv class=\"field\" style=\"margin-top:12px\">\u003clabel for=\"stage-name\">阶段名称 \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cinput id=\"stage-name\" class=\"input\" maxlength=\"30\" placeholder=\"例如：试点验证\">\u003c/div>');break;\n  case 'edit-stage':openForm('edit-stage',id);break;\n  case 'del-stage':{\n   const st=D.stages.find(v=>v.no===id);\n   if(!st){notify('该阶段不存在或已被删除。');break}\n   const used=D.projects.filter(p=>p.stage===st.name).length;\n   if(used){notify('「'+st.name+'」正被 '+used+' 个项目使用，不可直接删除；请先解除项目关联。');break}\n   dialog('删除项目阶段','确认删除未被使用的项目阶段「'+esc(st.name)+'」（单据编号 '+esc(st.no)+'）？删除后该单据编号随之释放并保留操作日志；批量删除需逐项返回成功 / 失败明细。','del-stage-do:'+id,'删除阶段',true);break;\n  }\n  case 'del-stage-do':{const i=D.stages.findIndex(v=>v.no===id);if(i>=0){const [rm]=D.stages.splice(i,1);render();notify('阶段「'+rm.name+'」已删除（演示）：单据编号 '+rm.no+' 已释放。')}else notify('该阶段不存在或已被删除。');break}\n  case 'adjust-progress':dialog('人工修正项目进度','正式操作必须：填写修正原因、记录修正人与修正时间、保存修正前后数值；取消修正需二次确认。后续末级任务变化触发重算时，先提示「保留人工修正 / 采用最新计算值」，不静默覆盖。','noop','了解');break;\n  case 'delete-project':{\n   const p=D.projects.find(x=>x.id===id);\n   if(!p){notify('该项目不存在或已被删除。');break}\n   const relTasks=D.tasks.filter(t=>t.project===p.name).length,relFollows=D.follows.filter(f=>f.project===p.name).length;\n   dialog('删除项目','确认删除项目「'+esc(p.name)+'」（单据编号 '+esc(p.no)+'）？\u003cbr>\u003cbr>删除前关联校验：该项目存在 \u003cstrong>'+relTasks+'\u003c/strong> 项关联任务、\u003cstrong>'+relFollows+'\u003c/strong> 条项目跟进。删除后项目单据编号随之释放、不会复用到其他记录；关联任务与跟进记录保留，但需人工重新归属。\u003cbr>\u003cbr>正式实现必须：服务端逐条校验 → 返回成功 / 失败明细 → 已进入正式批次的记录采用软删除并保留来源与日志，禁止物理删除导致断链。','delete-project-do:'+id,'删除项目',true);break;\n  }\n  case 'delete-project-do':{\n   const i=D.projects.findIndex(x=>x.id===id);\n   if(i\u003c0){notify('该项目不存在或已被删除。');break}\n   const [rm]=D.projects.splice(i,1);\n   S.drawer=null;render();\n   notify('项目「'+rm.name+'」已删除（演示）：单据编号 '+rm.no+' 已释放，不做编号回收复用。');break;\n  }\n  case 'delete-task':{\n   const t=D.tasks.find(x=>x.id===id);\n   if(!t){notify('该任务不存在或已被删除。');break}\n   const rel=D.progresses.filter(p=>p.task===t.name).length;\n   dialog('删除任务','确认删除任务「'+esc(t.name)+'」（单据编号 '+esc(t.no)+'）？\u003cbr>\u003cbr>删除前关  const used=new Set(list.map(x=>x.no||'').filter(Boolean));
 let seq=0;

}

 root.querySelectorAll('.control,.field,.form-grid > div,.facts > div').forEach(el=>el.classList.add('od-field'));
 root.querySelectorAll('.report-head > div:first-child,.cat-main,.kv:not([style*="display:flex"])').forEach(el=>el.classList.add('od-field'));
 root.querySelectorAll('.notice').forEach(el=>{
  if(el.querySelector('.notice-symbol'))return;
  el.classList.add('has-symbol');el.insertAdjacentHTML('afterbegin',icon(el.classList.contains('danger')||el.classList.contains('warn')?'warning':'info','notice-symbol'));
 });
 root.querySelectorAll('.empty').forEach(el=>{if(!el.querySelector('.ico'))el.insertAdjacentHTML('afterbegin',icon('empty'))});
 root.querySelectorAll('.arrow').forEach(el=>{el.innerHTML=icon('forward')});
 root.querySelectorAll('.btn[data-action]').forEach(el=>{
  if(el.querySelector('.btn-label'))return;
  const name=commandIcon(el.dataset.action),label=el.textContent.trim();
  el.innerHTML=(name?icon(name):'')+'<span class="btn-label">'+esc(label.replace(/^＋\s*/,''))+'</span>';
 });
 root.querySelectorAll('[data-formf]').forEach(el=>{
  const parent=el.closest('.form-grid > div');
  if(parent?.querySelector('label .req'))el.setAttribute('aria-required','true');
  if(S.form?.errors?.[el.dataset.formf])syncFieldError(el,el.dataset.formf);
 });
 for(const [key,selector] of [['funcPerms','[data-formfp]'],['dataDepts','[data-formdp]']]){
  const group=root.querySelector(selector)?.closest('.checks');
  if(group&&S.form?.errors?.[key]){group.setAttribute('aria-describedby','form-error-'+key);group.setAttribute('aria-invalid','true')}
 }
 root.querySelectorAll('.table-wrap').forEach((el,tableIndex)=>{
  el.tabIndex=0;el.setAttribute('role','region');el.setAttribute('aria-label',pageContextLabel()+' 数据表');
  el.dataset.tableKind=S.nav==='people'?'people':S.nav==='departments'?'departments':'business';
  el.dataset.tableKey=[S.nav,S.nav==='dashboard'?S.tab:S.reportMode,el.closest('#drawer')?.dataset.context||'',tableIndex].join(':');
  const table=el.querySelector(':scope > table');if(!table)return;
  table.classList.add('data-table');table.setAttribute('role','table');
  const headings=[...table.querySelectorAll('thead th')];
  headings.forEach(th=>{th.setAttribute('scope','col');th.setAttribute('role','columnheader')});
  table.querySelectorAll('thead,tbody').forEach(group=>group.setAttribute('role','rowgroup'));
  table.querySelectorAll('thead tr').forEach(row=>row.setAttribute('role','row'));
  const tbody=table.tBodies[0];
  if(tbody&&!tbody.rows.length){
   const row=tbody.insertRow(),cell=row.insertCell();
   cell.colSpan=headings.length||1;cell.className='cell-empty';
   cell.innerHTML='<div class="empty"><strong>没有符合条件的记录</strong><p>请调整搜索条件后重试。</p><button type="button" class="btn" data-clear-search>清空搜索</button></div>';
  }
  [...(tbody?.rows||[])].forEach(row=>{
   row.setAttribute('role','row');
   [...row.cells].forEach((cell,index)=>{
    const label=headings[index]?.textContent.trim()||'';
    cell.dataset.label=label;cell.setAttribute('role','cell');
    if(label==='操作')cell.classList.add('cell-actions');
    if(/^(跟进日期|最近跟进日期|截止日期|状态|优先级|手机号|在编人数|业务数据)$/.test(label))cell.classList.add('cell-compact');
    if(!cell.querySelector(':scope > .cell-content')){
     const content=document.createElement('div');content.className='cell-content';
     while(cell.firstChild)content.appendChild(cell.firstChild);
     cell.appendChild(content);
    }
   });
  });
  const saved=UI.tableScroll.get(el.dataset.tableKey);if(typeof saved==='number')el.scrollLeft=saved;
 });
 root.querySelectorAll('.src-row label.sr-only').forEach(label=>label.classList.remove('sr-only'));
 root.querySelectorAll('.richbox img').forEach(img=>{
  const measure=()=>{if(img.naturalWidth&&img.naturalHeight){img.setAttribute('width',img.naturalWidth);img.setAttribute('height',img.naturalHeight)}};
  if(img.complete)measure();else img.addEventListener('load',measure,{once:true});
 });
 errorSummary(root);
}
function enhanceApp(){
 const app=$('app');
 app.dataset.module=S.session?S.nav:'session';
 app.dataset.board=S.nav==='dashboard'?S.tab:'';
 // Normalize presentation once per render, retaining the original content and action nodes.
 const head=app.querySelector(':scope > .pagehead');
 if(head&&!head.querySelector(':scope > .page-cover')){
  const body=document.createElement('div');body.className='pagehead-body';
  while(head.firstChild)body.appendChild(head.firstChild);
  const copy=body.querySelector(':scope > div:not(.actions)');
  if(copy)copy.classList.add('pagehead-copy','od-field');
  const cover=document.createElement('div');cover.className='page-cover';
  cover.innerHTML='<span class="cover-disc" aria-hidden="true"></span><span class="cover-sheet" aria-hidden="true"></span>';
  cover.append(body);
  head.append(cover);
 }
 enhanceRegion(app);
 document.querySelectorAll('.nav-btn').forEach(el=>{
  if(!el.querySelector('.nav-label')){const label=el.textContent;el.innerHTML=icon(el.dataset.nav)+'<span class="nav-label">'+esc(label)+'</span>'}
  if(el.classList.contains('active'))el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');
 });
 app.querySelectorAll('[data-tab]').forEach(el=>{el.tabIndex=el.getAttribute('aria-selected')==='true'?0:-1});
 const pageKey=[S.session?'on':'off',S.nav,S.nav==='dashboard'?S.tab:'',S.nav==='reports'?S.reportMode:'',S.loading?'loading':'ready'].join(':');
 app.classList.remove('ui-page-enter');clearTimeout(UI.pageTimer);
 if(UI.pageKey!==pageKey){
  app.classList.add('ui-page-enter');app.querySelectorAll('.reports > .report').forEach((el,i)=>el.style.setProperty('--entry-index',Math.min(i,4)));
  UI.pageTimer=setTimeout(()=>app.classList.remove('ui-page-enter'),200);
 }
 UI.pageKey=pageKey;
}
function syncEditorToolbar(id){
 const box=$(id);if(!box)return;
 const toolbar=box.previousElementSibling;if(!toolbar?.classList.contains('editor-toolbar'))return;
 for(const [name,command] of [['bold','bold'],['list','insertUnorderedList']]){
  const button=toolbar.querySelector('[data-tool="'+name+':'+id+'"]');if(!button)continue;
  let active=false;try{active=document.queryCommandState(command)}catch(error){}
  button.setAttribute('aria-pressed',String(active));
 }
}
function focusEditor(id){
 const box=$(id);if(!box)return;
 box.focus();const selection=window.getSelection(),saved=UI.editorRanges.get(id);
 if(saved&&saved.commonAncestorContainer.isConnected&&box.contains(saved.commonAncestorContainer)){
  selection.removeAllRanges();selection.addRange(saved);
 }else{
  const range=document.createRange();range.selectNodeContents(box);range.collapse(false);selection.removeAllRanges();selection.addRange(range);
 }
}
function dismissToast(){
 const el=$('toast');clearTimeout(S.toastTimer);clearTimeout(UI.toastExit);
 if(el.classList.contains('hidden'))return;
 el.classList.add('is-leaving');UI.toastExit=setTimeout(()=>{el.classList.add('hidden');el.classList.remove('is-leaving')},window.matchMedia('(prefers-reduced-motion:reduce)').matches?0:140);
}
function restorePageContext(){
 const key=S.nav+':'+(S.nav==='reports'?S.reportMode:'');
 const y=UI.pageScroll?.get(key);if(typeof y==='number')window.scrollTo(0,y);
}
document.addEventListener('selectionchange',()=>{
 const selection=window.getSelection();if(!selection?.rangeCount)return;
 const range=selection.getRangeAt(0),node=range.commonAncestorContainer;
 const el=node.nodeType===1?node:node.parentElement,box=el?.closest('.richbox');
 if(box){UI.editorRanges.set(box.id,range.cloneRange());syncEditorToolbar(box.id)}
});
document.addEventListener('mousedown',e=>{if(e.target.closest('.editor-toolbar [data-tool]'))e.preventDefault()});
document.addEventListener('focusout',e=>{
 const el=e.target,key=el.dataset?.formf;if(!key||!S.form||!el.isConnected)return;
 if(el.hasAttribute('data-choice')&&activeChoice?.trigger===el)return;
 const all=validateForm();S.form.errors=S.form.errors||{};
 if(all[key])S.form.errors[key]=all[key];else delete S.form.errors[key];
 syncFieldError(el,key);
 errorSummary($('overlay'));
});
document.addEventListener('click',e=>{
 const close=e.target.closest('[data-toast-close]');if(close){dismissToast();return}
 const clear=e.target.closest('[data-clear-search]');if(clear){
  const input=$('app').querySelector('input[data-filter]');
  if(input){
   const id=input.id,root=input.closest('[data-board-search]');
   if(root)UI.boardSearch=root.dataset.boardSearch;
   input.value='';input.dispatchEvent(new Event('input',{bubbles:true}));$(id)?.focus({preventScroll:true});
  }
  return;
 }
 const link=e.target.closest('[data-error-focus]');if(link){
  const key=link.dataset.errorFocus;
  const el=$(key)||(key==='funcPerms'?document.querySelector('[data-formfp]'):key==='dataDepts'?document.querySelector('[data-formdp]'):null);
  el?.focus();el?.scrollIntoView({block:'center',behavior:window.matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
 }
});
document.addEventListener('keydown',e=>{
 if(e.key==='Tab'&&(S.drawer||S.dialog)){
  const active=S.dialog?document.querySelector('.dialog-card'):document.getElementById('drawer');if(!active)return;
  const items=[...active.querySelectorAll('button:not(:disabled),input:not(:disabled),[data-choice]:not(:disabled),textarea:not(:disabled),a[href],[contenteditable="true"],[tabindex]:not([tabindex="-1"])')].filter(el=>!el.closest('[inert]')&&el.getClientRects().length);
  if(!items.length){e.preventDefault();active.focus();return}
  const first=items[0],last=items[items.length-1];
  if(e.shiftKey&&(document.activeElement===first||!active.contains(document.activeElement))){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&(document.activeElement===last||!active.contains(document.activeElement))){e.preventDefault();first.focus()}
 }
 const tab=e.target.closest('[role="tab"][data-tab]');
 if(tab&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){
  const tabs=[...document.querySelectorAll('[role="tab"][data-tab]')],i=tabs.indexOf(tab);
  const index=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
  const key=tabs[index].dataset.tab;e.preventDefault();tabs[index].click();document.querySelector('[data-tab="'+key+'"]')?.focus();
 }
 const tool=e.target.closest('[data-tool]');
 if(tool&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){
  const tools=[...tool.closest('.editor-toolbar').querySelectorAll('[data-tool]')],i=tools.indexOf(tool);
  const index=e.key==='Home'?0:e.key==='End'?tools.length-1:(i+(e.key==='ArrowRight'?1:-1)+tools.length)%tools.length;
  e.preventDefault();tools[index].focus();
 }
});
$('toast').addEventListener('mouseenter',()=>clearTimeout(S.toastTimer));
$('toast').addEventListener('focusin',()=>clearTimeout(S.toastTimer));
$('toast').addEventListener('mouseleave',()=>{S.toastTimer=setTimeout(dismissToast,4200)});
$('toast').addEventListener('focusout',e=>{if(!$('toast').contains(e.relatedTarget))S.toastTimer=setTimeout(dismissToast,4200)});

function notify(msg){
 const el=$('toast');clearTimeout(S.toastTimer);clearTimeout(UI.toastExit);
 el.className='toast';
 el.innerHTML=icon(/失败|错误|未通过|不可|不能为空/.test(msg)?'warning':'info')+'<span class="toast-message">'+esc(msg)+'</span><button type="button" class="toast-close" data-toast-close aria-label="关闭提示">'+icon('close')+'</button>';
 S.toastTimer=setTimeout(dismissToast,4200);
}

function applyNav(){
 const perms=funcPermsOf();
 document.querySelectorAll('.nav-btn').forEach(b=>{
  const ok=perms.indexOf(NAVNAME[b.dataset.nav])>=0;
  b.classList.toggle('nav-off',!ok);b.disabled=!ok;b.setAttribute('aria-disabled',ok?'false':'true');
  if(!ok){b.setAttribute('title','当前登录人无「'+NAVNAME[b.dataset.nav]+'」功能权限，入口不可用');}
 });
 document.querySelectorAll('.sidebar nav .nav-title').forEach(t=>{
  let n=t.nextElementSibling,any=false;
  while(n&&!n.classList.contains('nav-title')){if(n.classList.contains('nav-btn')&&!n.classList.contains('nav-off'))any=true;n=n.nextElementSibling}
  t.classList.toggle('nav-off',!any);
 });
}
function render(){
 closeChoice(false,true);
 document.querySelectorAll('.table-wrap[data-table-key]').forEach(el=>UI.tableScroll.set(el.dataset.tableKey,el.scrollLeft));
 if(!S.session){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));$('app').innerHTML=sessionView();enhanceApp();renderOverlay();return}
 applyNav();
 const perms=funcPermsOf();
 if(perms.indexOf(NAVNAME[S.nav])<0){
  const first=S.nav==='dashboard'?null:PERMS.find(p=>perms.indexOf(p)>=0);
  const key=Object.keys(NAVNAME).find(k=>NAVNAME[k]===first)||'dashboard';
  S.nav=key;S.tab=key==='dashboard'?S.tab||'reports':S.tab;S.drawer=null;S.form=null;S.dialog=null;
 }
 document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.nav===S.nav));
 $('app').innerHTML=
  S.nav==='dashboard'?(S.loading?skeleton():dashboard()):
  S.nav==='reports'?(S.reportMode==='edit'?editor():reportsPage()):
  S.nav==='projects'?(S.loading?skeleton():projectsPage()):
  S.nav==='follows'?(S.loading?skeleton():followsPage()):
  S.nav==='tasks'?(S.loading?skeleton():tasksPage()):
  S.nav==='people'?peoplePage():departmentsPage();
 enhanceApp();renderOverlay();
}

function recordText(value,shortLimit=48){
 const text=String(value??'');
 if(text.length<=shortLimit)return `<p class="record-body">${esc(text)}</p>`;

function validateForm(){
 const f=S.form,d=f.draft,e={};
 if(f.type==='new-project'||f.type==='edit-project'){
  const n=(d.name||'').trim();
  if(!n)e.name='项目名称为必填项。';
  else if(D.projects.some(p=>p.name===n&&p.id!==f.id))e.name='项目名称已存在，请改用其他名称或直接编辑已有项目。';
  else if(n.length<2)e.name='项目名称过短，请填写可识别的完整名称。';
  if(!d.cat)e.cat='请选择项目分类。';
  if(!d.stage)e.stage='请选择项目阶段；可在下拉内直接新建阶段。';
  if(!d.owner)e.owner='请选择项目负责人。';
  if((d.followText||'').length>500)e.followText='项目跟进内容请控制在 500 字以内。';
 }
 if(f.type==='new-task'||f.type==='edit-task'){
  const n=(d.name||'').trim();
  if(!n)e.name='任务名称为必填项。';
  else if(D.tasks.some(t=>t.name===n&&t.id!==f.id))e.name='任务名称已存在，请改用其他名称。';
  const lv=Number(d.level);
  if(!(lv>=1&&lv<=3))e.level='任务层级只能是 1、2、3 级。';
  if(lv>1&&!d.parent)e.parent=lv===3?'三级任务必须归属上级任务，请选择上级：否则无法确定其在三级结构中的位置。':'二级任务请指定上级任务。';
  if(lv===3&&d.parent){const pt=D.tasks.find(t=>t.name===d.parent);if(pt&&pt.level>=3)e.parent='所选上级已是三级任务，不能再作为父级（三级为上限）。'}
  if(!d.cat)e.cat='请选择任务分类。';
  if(!d.owner)e.owner='请选择主负责人。';
  if(!d.priority)e.priority='请选择优先级。';
  if(!d.project)e.project='请选择关联项目。';
  if(!d.due)e.due='请选择截止日期。';
  else if(d.due<d.created)e.due='截止日期不能早于创建日期 '+d.created+'。';
 }
 if(f.type==='new-follow'){
  if(!d.project)e.project='请选择关联项目。';
  if(!d.date)e.date='请选择跟进日期。';
  else if(d.date>today())e.date='跟进日期不能晚于今天（'+today()+'）。';
  if(!d.person)e.person='请选择跟进人员。';
  const c=(d.content||'').trim();
  if(!c)e.content='跟进内容为必填项：缺少内容无法形成有效跟进记录。';
  else if(c.length<4)e.content='跟进内容过短，请补充具体进展与结论。';
 }
 if(f.type==='new-progress'){
  if(!d.task)e.task='请选择任务。';
  if(!d.date)e.date='请选择跟进日期。';
  else if(d.date>today())e.date='进度日期不能晚于今天（'+today()+'）。';
  if(!d.person)e.person='请选择填写人员。';
  if(!d.status)e.status='请选择任务状态。';
  const c=(d.content||'').trim();
  if(!c)e.content=d.status==='已完成'?'标记为已完成时必须填写完成说明。':'进度内容为必填项。';
  else if(c.length<4)e.content='进度内容过短，请补充具体产出与阻塞。';
 }
 if(f.type==='new-person'||f.type==='edit-person'){
  const n=(d.name||'').trim(),edit=f.mode==='edit';
  if(!n)e.name='人员姓名为必填项。';
  else if(D.accounts.some(a=>a.name===n&&a.name!==f.id))e.name='该姓名已存在，请确认是否重复添加。';
  const ph=(d.phone||'').trim();
  if(!ph)e.phone='手机号为必填项：手机号即登录账号。';
  else if(!/^1[3-9]\d{9}$/.test(ph))e.phone='手机号格式不正确，应为 1 开头的 11 位数字。';
  else if(D.accounts.some(a=>(a.raw||'')===ph&&a.name!==f.id))e.phone='该手机号已被其他人员使用，一个手机号只能对应一个人员。';
  if(!d.dept)e.dept='归属部门为必填项：人员必须归属一个部门。';
  if(!d.status)e.status='请选择账号状态。';
  if(!d.funcPerms||!d.funcPerms.length)e.funcPerms='至少保留一项功能权限；如确需停用该账号，请改用「账号状态」。';
  if(!d.dataDepts||!d.dataDepts.length)e.dataDepts='至少选择一个可见部门作为数据权限范围。';
  const pw=d.pwd||'';
  if(!pw){if(!edit)e.pwd='设置密码为必填项。'}
  else{
   if(pw.length<8)e.pwd='密码长度至少 8 位。';
   else if(!(/[A-Za-z]/.test(pw)&&/\d/.test(pw)))e.pwd='密码需同时包含字母与数字。';
   if((d.pwd2||'')!==pw)e.pwd2='两次输入的密码不一致。';
  }
 }
 if(f.type==='new-dept'||f.type==='edit-dept'){
  const c=(d.code||'').trim().toUpperCase(),n=(d.name||'').trim();
  if(!c)e.code='部门编码为必填项。';
  else if(!/^[A-Za-z0-9-]{2,20}$/.test(c))e.code='部门编码只能使用字母、数字与连字符，长度 2–20。';
  else if(D.depts.some(x=>String(x.code).toUpperCase()===c&&x.no!==f.id))e.code='部门编码已存在，请改用其他编码。';
  if(!n)e.name='部门名称为必填项。';
  else if(D.depts.some(x=>x.name===n&&x.no!==f.id))e.name='部门名称已存在，请改用其他名称。';
  if(!d.status)e.status='请选择状态。';
 }
 if(f.type==='new-cat'||f.type==='edit-cat'){
  const n=(d.name||'').trim(),c=(d.code||'').trim();
  if(!n)e.name='分类名称为必填项。';
  else if(D.taskCats.some(x=>x.name===n&&x.no!==f.id))e.name='分类名称已存在，请改用其他名称。';
  if(!c)e.code='分类编码为必填项。';
  else if(D.taskCats.some(x=>x.code===c&&x.no!==f.id))e.code='分类编码已存在，请改用其他编码。';
  if(!(Number(d.sort)>=1))e.sort='排序需为不小于 1 的数字。';
 }
 if(f.type==='new-stage'||f.type==='edit-stage'){
  const n=(d.name||'').trim();
  if(!n)e.name='阶段名称为必填项。';
  else if(D.stages.some(x=>x.name===n&&x.no!==f.id))e.name='阶段名称已存在，请直接在下拉中选用，不做重复创建。';
  if(!(Number(d.sort)>=1))e.sort='排序需为不小于 1 的数字。';
 }
 return e;
}
function addFollowRec(project,date,person,content,createdBy,createdDept){

 D.follows.push(rec);
 D.syncPool.push({no:rec.no,type:'项目跟进',project:project,person:person,date:date,text:content});

}
function addProgressRec(task,date,person,content,status,createdBy,createdDept){

 if(ty==='new-project'||ty==='edit-project'){

 if(ty==='new-person'||ty==='edit-person'){

 }
 if(ty==='new-dept'||ty==='edit-dept'){

 }
 if(ty==='new-cat'||ty==='edit-cat'){

 const key=S.dialog?'dialog:'+S.dialog.ok+':'+S.dialog.title:drawerKey;
 clearTimeout(UI.closeTimer);
 if(!key){

  };

 }
 if(!oldKey)UI.returnFocus=focused||UI.returnFocus;
 if(S.dialog&&!oldKey.startsWith('dialog:'))UI.dialogReturn=focused;
 shell.inert=true;document.body.classList.add('modal-open');
 ov.classList.remove('is-closing');ov.inert=false;UI.overlayKey=key;
 const side=S.drawer?.side==='left'?' left':' right';

 const sameDrawer=oldDrawerKey===drawerKey;

 let html='';
 if(S.drawer&&!S.dialog){

 }else if(S.drawer&&S.dialog){

 }else{
  html=`<div class="backdrop" style="z-index:32" data-action="cancel-dialog" aria-hidden="true"></div>${dialogHtml()}`;
 }
 ov.innerHTML=html;enhanceRegion(ov);
 const body=ov.querySelector('.drawer-body');
 if(body)body.scrollTop=UI.drawerScroll.get(drawerKey)||0;
 const restore=oldKey===key?focused:!S.dialog&&oldKey.startsWith('dialog:')?UI.dialogReturn:null;
 requestAnimationFrame(()=>{
  if(UI.overlayKey!==key)return;

  (target||active).focus({preventScroll:true});
 });

 if(d.type==='report')return reportDrawer(d.id);

/* ============================== 状态同步与自动保存 ============================== */
function snapshot(){
 if(S.nav!=='reports'||S.reportMode!=='edit')return;
 const m=$('manual'),n=$('next');
 if(m)S.report.manual=m.innerHTML;
 if(n)S.report.next=n.innerHTML;
 const b=S.report.batch;
 document.querySelectorAll('[data-ff]').forEach(el=>{if(S.report.final)S.report.final[el.dataset.ff]=el.value});
 document.querySelectorAll('[data-src]').forEach(el=>{const s=S.report.sources[+el.dataset.src];if(s)s.text=el.value});
 if(!b)return;
 document.querySelectorAll('[data-ai-p]').forEach(el=>{const r=b.projRows[+el.dataset.aiP];if(r)r.project=el.value});
 document.querySelectorAll('[data-ai-pc]').forEach(el=>{const r=b.projRows[+el.dataset.aiPc];if(r)r.content=el.value});
 document.querySelectorAll('[data-ai-t]').forEach(el=>{const r=b.taskRows[+el.dataset.aiT];if(r)r.task=el.value});
 document.querySelectorAll('[data-ai-tc]').forEach(el=>{const r=b.taskRows[+el.dataset.aiTc];if(r)r.content=el.value});
}
const textOf=html=>{const d=document.createElement('div');d.innerHTML=html||'';return (d.textContent||'').trim()};
function autoSave(){
 if(!S.session)return;
 S.report.save='有未保存的更改';
 if($('save-state'))$('save-state').textContent=S.report.save;
 clearTimeout(S.autoTimer);
 S.autoTimer=setTimeout(()=>{
  snapshot();
  if(!S.report.created)S.report.created=today();
  S.report.version++;
  S.report.save='已自动保存（演示）· v'+S.report.version;
  if($('save-state'))$('save-state').textContent=S.report.save;
 },900);

/* ============================== 业务动作 ============================== */
function doSave(){
 snapshot();
 if(!S.report.created)S.report.created=today();
 S.report.version++;S.report.save='已保存草稿（演示）· v'+S.report.version;
 if($('save-state'))$('save-state').textContent=S.report.save;
 notify('演示草稿已保存：创建日期按首次成功保存生成；后续自动保存只更新更新时间，系统内部保留精确审计时间。');
}
function doSync(){
 snapshot();
 const r=S.report,btn=$('sync-btn');
 if(r.start>r.end){notify('结束日期不能早于开始日期，请检查工作周范围。');return}
 if(btn){btn.disabled=true;btn.setAttribute('aria-busy','true');btn.textContent='同步中…'}
 setTimeout(()=>{
  const matches=D.syncPool.filter(x=>x.date>=r.start&&x.date<=r.end&&x.person===r.syncPerson);
  const fresh=matches.filter(x=>!r.sources.some(s=>s.no===x.no));
  r.sources.push(...fresh);
  if(btn){btn.disabled=false;btn.removeAttribute('aria-busy');btn.textContent='同步数据';enhanceRegion(btn.parentElement)}
  if($('sources')){$('sources').innerHTML=sourcesHtml();enhanceRegion($('sources'))}
  if($('syncwho'))$('syncwho').textContent=r.syncPerson;
  notify(`同步完成：符合条件 ${matches.length} 条，新增 ${fresh.length} 条，重复来源已按单据编号跳过。原项目跟进与任务进度未被修改。`);
 },450);
}
function makeFinal(){
 snapshot();
 const r=S.report,manual=textOf(r.manual),next=textOf(r.next);
 if(!manual&&!r.sources.length){notify('请先填写手工内容，或在数据获取区同步已有业务记录。');return}
 r.final={topic:r.sources[0]?r.sources[0].project:'本周工作汇报',
  done:[...r.sources.map(s=>s.text),manual].filter(Boolean).join('；')||'暂无',
  risk:'待补充问题风险',next:next||'待补充下周工作计划'};
 if($('final-area')){$('final-area').innerHTML=finalHtml();enhanceRegion($('final-area'))}
 notify('最终汇报快照已生成：可编辑表达与排版，编辑不会反向改写数据获取区原文或原业务对象。');
}
function generateAI(){
 snapshot();
 const r=S.report,manual=textOf(r.manual);
 if(!manual){notify('请先在【手工填写】区输入本周工作内容；AI 只处理该区域。');return}
 if(r.batch&&r.batch.status==='已提交'){S.drawer={type:'ai'};renderOverlay();notify('该周报已有已提交批次，批次只读且不可重复提交。');return}
 if(r.batch&&r.batch.status==='失败'){S.drawer={type:'ai'};renderOverlay();notify('原批次存在失败行，请修正后重试，不新建重复批次。');return}
 if(r.batch&&r.batch.version===r.version){S.drawer={type:'ai'};renderOverlay();notify('已打开同一内容版本的待提交批次，避免重复生成。');return}
 const p=D.projects.find(x=>manual.includes(x.name));
 const t=D.tasks.find(x=>manual.includes(x.name));
 const clip=n=>manual.slice(0,n);
 r.batch={id:'B-'+String(Date.now()).slice(-6),status:'待提交',version:Math.max(r.version,1),
  projRows:[{project:p?p.name:'请选择项目',content:clip(90),evidence:clip(110),reason:p?'原文命中项目名称「'+p.name+'」':'未命中任何项目名称，需人工选择（不自动创建对象）',match:p?'名称命中':'需人工指定',error:''}],
  taskRows:[{task:t?t.name:'请选择任务',current:'进行中',status:'进行中',content:clip(90),evidence:clip(110),reason:t?'原文命中任务名称「'+t.name+'」':'未命中任何任务名称，需人工选择（不自动创建对象）',match:t?'名称命中':'需人工指定',error:''}]};
 if($('ai-summary'))$('ai-summary').innerHTML=batchSummary();
 S.drawer={type:'ai'};renderOverlay();
 notify('已生成待确认建议：请核对原文证据与匹配对象；提交前不会写回任何正式对象。');
}
function submitAI(){
 snapshot();
 const b=S.report.batch;
 if(!b||b.status==='已提交'){notify('已提交批次不可重复提交。');return}
 let bad=0;
 b.projRows.forEach(r=>{
  r.error=r.project==='请选择项目'?'未选择匹配项目：项目无法匹配时必须人工选择，系统不自动创建对象。'
   :!r.content.trim()?'跟进内容为空：请补充后再提交。':'';
  if(r.error)bad++;
 });
 b.taskRows.forEach(r=>{
  r.error=r.task==='请选择任务'?'未选择匹配任务：任务无法匹配时必须人工选择，系统不自动创建对象。'
   :!r.content.trim()?'进度内容为空：请补充后再提交。':'';
  if(r.error)bad++;
 });
 if(bad){
  b.status='失败';
  renderOverlay();
  if($('ai-summary'))$('ai-summary').innerHTML=batchSummary();
  notify(`校验未通过：${bad} 行存在问题。正式对象写入已全部回滚，错误行与原因保留，可在原批次修正后重试。`);
  return;
 }
 const n=b.projRows.length,m=b.taskRows.length;
 const projNames=[...new Set(b.projRows.map(r=>r.project))].join('、');
 const taskNames=[...new Set(b.taskRows.map(r=>r.task))].join('、');
 dialog('确认提交 AI 生成结果',
  `将按批次 <strong>${esc(b.id)}</strong> 拆分写入：<br>· 项目跟进 <strong>${n}</strong> 条 → 影响项目：${esc(projNames)}<br>· 任务进度 <strong>${m}</strong> 条 → 影响任务：${esc(taskNames)}<br><br>该事务为一次性提交：任一行失败则全部回滚，不产生半成品数据。提交后批次转为只读；如需修正，只能回滚后重新生成。`,
  'ai-commit','确认提交生成结果');
}

  case 'cancel-dialog':S.dialog=null;renderOverlay();break;  case 'dialog-ok':case 'confirm-dialog':{

  S.report.attach.push({name:file.name,status:'本地演示，未上传'});
  if($('attach'))$('attach').innerHTML=S.report.attach.map(a=>tag(a.name+' · '+a.status)).join('');
  if(box&&file.type.indexOf('image/')===0){
   const rd=new FileReader();
   rd.onload=()=>{box.insertAdjacentHTML('beforeend','<figure style="margin:8px 0"><img src="'+rd.result+'" alt="'+esc(file.name)+'" style="max-width:100%;border:1px solid var(--line)"><figcaption style="font-size:var(--fs-helper);color:var(--text-3)">'+esc(file.name)+' · 仅本地预览</figcaption></figure>');autoSave()};
   rd.readAsDataURL(file);
  }else if(box){box.insertAdjacentHTML('beforeend','<p>附件：'+esc(file.name)+'（本地演示，未上传至服务端）</p>');autoSave()}
  e.target.value='';
  notify('文件已加入本地预览，未上传至服务端。');
 }
});
document.addEventListener('paste',e=>{
 const box=e.target.closest?e.target.closest('.richbox'):null;
 if(!box)return;
 const items=e.clipboardData?[...(e.clipboardData.items||[])]:[];
 const item=items.find(i=>i.type.indexOf('image/')===0);
 if(!item)return;
 e.preventDefault();
 const file=item.getAsFile(),rd=new FileReader();
 rd.onload=()=>{box.insertAdjacentHTML('beforeend','<figure style="margin:8px 0"><img src="'+rd.result+'" alt="粘贴的截图" style="max-width:100%;border:1px solid var(--line)"><figcaption style="font-size:var(--fs-helper);color:var(--text-3)">粘贴的截图 · 仅当前演示页面可见</figcaption></figure>');autoSave()};
 rd.readAsDataURL(file);
 notify('截图已插入演示编辑区（第一级降级：剪贴板粘贴），未上传服务端。');
});
document.addEventListener('keydown',e=>{
 if(e.isComposing||e.keyCode===229||activeChoice?.composing||e.key!=='Escape')return;
 if(S.dialog){S.dialog=null;renderOverlay();return}
 if(S.drawer){if(S.form){closeForm();return}S.drawer=null;renderOverlay();restoreScroll()}
});
render();
</script>
</body></html>
